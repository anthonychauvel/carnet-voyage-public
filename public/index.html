  /* ══════════ 🏙️ Étape (ville) : découvrir les lieux + itinéraire sur plusieurs jours ══════════ */
  const POI_CATS = {
    monu: {lbl:'Monuments', icon:'🏛️'}, relig: {lbl:'Églises & lieux saints', icon:'⛪'}, vue: {lbl:'Points de vue', icon:'🌅'},
    parc: {lbl:'Parcs & jardins', icon:'🌳'}, musee: {lbl:'Musées', icon:'🖼️'}, loisir: {lbl:'Loisirs', icon:'🎡'},
  };
  const stayDays = h => h && h.date ? range(h.date, h.dateFin || h.date) : [];
  const stays = () => items(i=>i.cat==='hotel' && i.date).sort(sortItems);
  function placesOfStay(hid){
    const h = R[hid], ds = stayDays(h).slice(0, -1).concat(h && !h.dateFin ? [h.date] : []);
    return list('place', p=>p.trip===M.trip && (p.stay===hid || (!p.stay && ds.includes(p.date))));
  }
  const poiCat = t => {
    if(/^(museum|gallery)$/.test(t.tourism||'')) return 'musee';
    if(t.tourism==='viewpoint') return 'vue';
    if(/^(theme_park|zoo|aquarium)$/.test(t.tourism||'')) return 'loisir';
    if(/^(park|garden)$/.test(t.leisure||'')) return 'parc';
    if(t.amenity==='place_of_worship' || /^(church|cathedral|basilica|monastery)$/.test(t.historic||t.building||'')) return 'relig';
    return 'monu';
  };
  const poiScore = t => (t.wikidata?5:0) + (t.wikipedia?3:0) + (t.heritage?2:0) + (t.tourism==='attraction'?2:0) + (t.historic?1:0) + (t['name:fr']?1:0);
  let disc = null;
  // Lieux à voir : cache par ville (30 jours), puis l'API /api/seewhat (cache serveur 24 h)
  // en course avec OpenStreetMap (Overpass) interrogé sur 2 serveurs en parallèle.
  const DISC_TTL = 30*864e5;
  const seeCat = c => /Musée|Galerie/i.test(c) ? 'musee' : /Point de vue/i.test(c) ? 'vue' : /Zoo|Aquarium|Parc d|Loisir|attraction/i.test(c) ? 'loisir'
    : /Parc|Jardin|Nature|Plage|Site naturel/i.test(c) ? 'parc' : /Église|Cathédrale|Temple|Sanctuaire|Religi|Monastère/i.test(c) ? 'relig' : 'monu';
  function withTimeout(pr, ms){ return Promise.race([pr, new Promise((_,rej)=>setTimeout(()=>rej(new Error('délai dépassé')), ms))]); }
  async function seeApi(c){
    const r = await fetch(`https://vol-bm4.pages.dev/api/seewhat?lat=${c.lat}&lng=${c.lng}&radius=7000`); if(!r.ok) throw new Error('api');
    const j = await r.json(); const pl = (j && j.places) || []; if(!pl.length) throw new Error('vide');
    return pl.map(p=>({nom:p.name, cat:seeCat(p.cat||''), score:(p.wiki?5:0) + (p.site?1:0), lat:p.lat, lng:p.lng, wiki:p.wiki||''}));
  }
  // Wikipédia : lieux qui ont un article, autour d'un point (rapide, sans clé, CORS ouvert)
  const wikiCat = t => /Musée|Museo|Galerie|Pinacoth/i.test(t) ? 'musee' : /Mirador|Belvédère|Point de vue|Tour |Torre/i.test(t) ? 'vue'
    : /Parc |Parque|Jardin|Jardín|Bois |Plage|Lac /i.test(t) ? 'parc' : /Église|Iglesia|Cathédrale|Catedral|Basilique|Basílica|Chapelle|Temple|Mosquée|Synagogue|Monastère|Couvent|Abbaye|Sanctuaire/i.test(t) ? 'relig'
    : /Zoo|Aquarium|Stade|Estadio|Arène|Plaza de toros/i.test(t) ? 'loisir' : 'monu';
  async function seeWiki(c){
    const u = `https://fr.wikipedia.org/w/api.php?action=query&list=geosearch&gscoord=${c.lat}%7C${c.lng}&gsradius=10000&gslimit=150&format=json&origin=*`;
    const r = await fetch(u); if(!r.ok) throw new Error('wiki');
    const g = ((await r.json()).query || {}).geosearch || []; if(!g.length) throw new Error('vide');
    return g.filter(x=>!/^(Liste |Gare |Station |Métro|Ligne |Arrondissement|Quartier|District|Barrio|Rue |Avenue |Calle |Ambassade|Consulat|Hôpital|École|Lycée|Collège|Université|Ministère|Siège|Bataille)/i.test(x.title) && !/\(métro|\(station|\(gare/i.test(x.title))
      .map(x=>({nom: x.title.replace(/ \([^)]*\)$/,''), cat: wikiCat(x.title + ' '), score: 4.5 - Math.min(x.dist, 10000)/4000, lat: x.lat, lng: x.lon, wiki: 'fr:' + x.title}));
  }
  async function seeOverpass(c){
    const a = `(around:4500,${c.lat},${c.lng})`;
    const q = `[out:json][timeout:15];(
      nw["tourism"~"^(attraction|museum|viewpoint|gallery|zoo|theme_park|aquarium)$"]["name"]${a};
      nw["historic"~"^(monument|castle|ruins|archaeological_site|memorial|fort|city_gate|palace|church|cathedral|tower|monastery)$"]["name"]${a};
      nw["amenity"="place_of_worship"]["wikidata"]${a};
      nw["leisure"~"^(park|garden)$"]["wikidata"]${a};
    );out center tags 250;`;
    const one = ep => fetch(ep, {method:'POST', body:'data=' + encodeURIComponent(q), headers:{'Content-Type':'application/x-www-form-urlencoded'}})
      .then(r=>{ if(!r.ok) throw new Error('osm'); return r.json(); });
    const j = await Promise.any(['https://overpass-api.de/api/interpreter', 'https://overpass.kumi.systems/api/interpreter'].map(one));
    return (j.elements||[]).map(e=>{ const t = e.tags || {};
      return {nom: t['name:fr'] || t.name, cat: poiCat(t), score: poiScore(t), lat: e.lat ?? (e.center||{}).lat, lng: e.lon ?? (e.center||{}).lon, wiki: t.wikipedia || ''}; });
  }
  async function discover(hid){
    const h = R[hid]; if(!h) return;
    const city = cityOf(h.titre), key = normQ(city);
    disc = {hid, city, list:[], f: M.poiF || {musee:false}, q:''};
    M.poiCache = M.poiCache || {};
    const hit = M.poiCache[key];
    if(hit && Date.now() - hit.t < DISC_TTL && hit.list.length){ disc.list = hit.list; discRender(); return; }
    openSheet(`<h2>🔎 À voir à ${esc(city)}</h2><div class="cv-route-load" id="ds-msg">📡 Je cherche les lieux autour de ${esc(city)}…<br><small>La première recherche d’une ville prend quelques secondes, les suivantes sont immédiates.</small></div>`);
    try {
      const c = await withTimeout(geocode(city, null), 10000).catch(()=>null);
      if(!c) throw new Error('Ville introuvable : vérifie le nom de l’étape (fiche hôtel).');
      // 3 sources en parallèle : Wikipédia (très rapide), le serveur (cache 24 h), OpenStreetMap.
      // On affiche dès la première réponse, puis on complète quand les autres arrivent.
      let got = [], ok = 0;
      const finalize = arr => { const seen = new Set();
        return arr.filter(p=>p.nom && p.lat != null && !/^\d+$/.test(p.nom))
          .sort((x,y)=>y.score-x.score)
          .filter(p=>{ const k = normQ(p.nom); if(seen.has(k)) return false; seen.add(k); return true; })
          .slice(0, 150); };
      await new Promise(done => {
        let left = 3;
        [seeWiki(c), seeApi(c), seeOverpass(c)].forEach(pr => withTimeout(pr, 22000).then(list => {
          if(!list || !list.length) return;
          got = got.concat(list); ok++;
          if(!disc || disc.hid !== hid) return;
          disc.list = finalize(got);
          M.poiCache[key] = {t: Date.now(), list: disc.list}; const ks = Object.keys(M.poiCache); if(ks.length > 30) delete M.poiCache[ks[0]]; persist();
          discRender(); done();
        }).catch(()=>{}).finally(()=>{ if(--left === 0) done(); }));
      });
      if(!ok) throw new Error('Aucun service de lieux ne répond pour l’instant (Wikipédia, OpenStreetMap). Vérifie ta connexion et réessaie dans un instant.');
    } catch(e){ const m = document.getElementById('ds-msg'); if(m) m.textContent = '⚠️ ' + e.message; }
  }
  function discRender(){
    const shY = (document.querySelector('#v-sheet-bg .v-sheet') || {}).scrollTop || 0, keepY = disc && disc.keepY != null ? disc.keepY : (disc && disc.rendered ? shY : 0); if(disc){ disc.keepY = null; disc.rendered = 1; }
    const d = disc; if(!d) return;
    const mine = new Set(placesOfStay(d.hid).map(p=>normQ(p.nom)));
    const shown = d.list.filter(p => d.f[p.cat] !== false && (!d.q || normQ(p.nom).includes(normQ(d.q))));
    openSheet(`<h2>🔎 À voir à ${esc(d.city)}</h2>
      <div class="v-sum-small" style="margin-bottom:8px">${d.list.length} lieux trouvés (Wikipédia, OpenStreetMap), les plus connus en premier. Touche une photo ou un nom pour voir le lieu, ＋ pour l’ajouter à l’étape.</div>
      <div class="v-filters" style="flex-wrap:wrap">${Object.entries(POI_CATS).map(([k,c])=>`<button class="v-chip${d.f[k]!==false?' on':''}" onclick="CV.discF('${k}')">${c.icon} ${c.lbl}</button>`).join('')}</div>
      <input class="v-in" id="ds-q" placeholder="Rechercher un lieu…" value="${esc(d.q)}" oninput="CV.discQ(this.value)">
      <div id="ds-list" style="margin-top:8px">${shown.map(p=>{ const i = d.list.indexOf(p), has = mine.has(normQ(p.nom));
        return `<div class="cv-poi"><button type="button" class="cv-pth" onclick="CV.discInfo(${i})">${p.wiki ? `<img data-wk="${esc(p.wiki)}" alt="">` : ''}<span class="ic">${POI_CATS[p.cat].icon}</span></button><span class="x" onclick="CV.discInfo(${i})"><b>${esc(p.nom)}</b>${p.score>=5?' <span class="star">★</span>':''}<small>${POI_CATS[p.cat].lbl}</small></span>
          <a href="https://www.google.com/maps/search/?api=1&query=${p.lat.toFixed(6)},${p.lng.toFixed(6)}" target="_blank" rel="noopener">📍</a>
          <button class="cv-x${has?' ok':''}" onclick="CV.discAdd(${i})">${has?'✓':'＋'}</button></div>`; }).join('') || '<div class="v-empty">Aucun lieu avec ces filtres.</div>'}</div>
      <div class="v-actions"><button type="button" class="v-btn" onclick="CV.planCity('${d.hid}')">🏙️ Organiser l’étape</button><button type="button" class="v-btn sec cv-sq" onclick="CV.close()">✕</button></div>`);
    const q = document.getElementById('ds-q'); if(q && d.q){ q.focus(); q.setSelectionRange(d.q.length, d.q.length); }
    { const sh = document.querySelector('#v-sheet-bg .v-sheet'); if(sh && keepY) sh.scrollTop = keepY; }
    setTimeout(discThumbs, 30);
  }
  function discF(k){ disc.f[k] = disc.f[k]===false; M.poiF = disc.f; persist(); discRender(); }
  let discT = null;
  function discQ(v){ disc.q = v; clearTimeout(discT); discT = setTimeout(discRender, 350); }
  function discAdd(i){
    const p = disc.list[i]; if(!p) return;
    const ex = placesOfStay(disc.hid).find(x=>normQ(x.nom)===normQ(p.nom));
    if(ex){ drop(ex.id, '↩️ Retiré'); }
    else put({id:'pl'+uid(), type:'place', trip:M.trip, stay:disc.hid, date:'', nom:p.nom, adresse:'', lat:p.lat, lng:p.lng, cat:p.cat, lock:false}, '📍 ' + p.nom);
    const sc = document.querySelector('#v-sheet-bg .v-sheet'), y = sc ? sc.scrollTop : 0;
    discRender();
    const sc2 = document.querySelector('#v-sheet-bg .v-sheet'); if(sc2) sc2.scrollTop = y;
  }

  /* ── Organiser l’étape : jours, verrous, optimisation ── */
  let cityH = null;
  function planCity(hid){

    cityH = hid;
    const t = trip(), ds = stayDays(h), pl = placesOfStay(hid);

        <button class="cv-x cv-lk${p.lock?' on':''}" title="Verrouiller ce jour" onclick="CV.cityLock('${p.id}')">${p.lock?'🔒':'🔓'}</button>
        <button class="cv-x" onclick="CV.cityDel('${p.id}')">✕</button></div>`;
    openSheet(`<h2>🏙️ ${esc(cityOf(h.titre))}</h2>
      <div class="v-sum-small" style="margin-bottom:10px">${fdate(h.date)} → ${fdate(h.dateFin||h.date)} · ${pl.length} lieu(x). Place les lieux toi-même ou laisse l’optimisation répartir. 🔒 = ce lieu reste sur ce jour.</div>
      <button class="v-btn sec" onclick="CV.discover('${hid}')">🔎 Découvrir les lieux à visiter</button>
      ${unplaced.length ? `<div class="cv-cday"><b>À placer</b>${unplaced.map(row).join('')}</div>` : ''}
      ${ds.map(d=>`<div class="cv-cday"><b>${fdate(d)}${dayInfo(d).titre ? ' · ' + esc(dayInfo(d).titre) : ''}</b>${byDay(d).map(row).join('') || '<div class="v-sum-small">—</div>'}</div>`).join('')}
      <div class="cv-paybox" style="margin-top:12px"><div class="cv-paybox-h">⚡ Optimisation</div>
        <label class="cv-checkline"><input type="checkbox" id="cy-spread" ${h.planEtaler===false?'':'checked'}> Répartir les lieux sur les jours (sinon : chaque lieu garde son jour, seul l’ordre change)</label>
        <div class="v-f"><label>Jours à remplir</label><div class="cv-qsel" id="cy-days">${ds.map(d=>`<button type="button" class="${sel.has(d)?'on':''}" data-p="${d}" style="--pc:var(--navy)" onclick="this.classList.toggle('on')">${fdate(d)}</button>`).join('')}</div></div>
        <div class="v-f2"><div class="v-f"><label>À pied par trajet (km)</label><input class="v-in" id="cy-walk" inputmode="decimal" value="${esc(t.marche||2.5)}"></div>
          <div class="v-f"><label>À pied par jour (km)</label><input class="v-in" id="cy-day" inputmode="decimal" value="${esc(t.marcheJour||25)}"></div></div>
        <button class="v-btn" id="cy-go" onclick="CV.cityOpt()">⚡ Optimiser l’étape</button>

  function kmeansDays(P, k, lockIdx){
    // P : points {lat,lng,lk} · lk = index du jour verrouillé ou -1
    const C = Array.from({length:k}, (_, j) => { const L = P.filter(p=>p.lk===j); return L.length ? {lat:L.reduce((s,p)=>s+p.lat,0)/L.length, lng:L.reduce((s,p)=>s+p.lng,0)/L.length} : null; });
    const free = P.filter(p=>p.lk<0);
    for(let j=0;j<k;j++) if(!C[j]){
      const have = C.filter(Boolean); let best = null, bd = -1;
      (free.length ? free : P).forEach(p=>{ const d = have.length ? Math.min(...have.map(c=>km(c,p))) : km(P[0], p); if(d > bd){ bd = d; best = p; } });
      C[j] = best ? {lat:best.lat, lng:best.lng} : {lat:P[0].lat, lng:P[0].lng};
    }
    const asg = P.map(p=>p.lk>=0 ? p.lk : 0);
    for(let it=0; it<20; it++){
      P.forEach((p,i)=>{ if(p.lk<0){ let b = 0, bd = Infinity; C.forEach((c,j)=>{ const d = km(c,p); if(d < bd){ bd = d; b = j; } }); asg[i] = b; } });
      C.forEach((c,j)=>{ const m = P.filter((p,i)=>asg[i]===j); if(m.length){ c.lat = m.reduce((s,p)=>s+p.lat,0)/m.length; c.lng = m.reduce((s,p)=>s+p.lng,0)/m.length; } });
    }
    const cap = Math.ceil(P.length / k) + 1;
    for(let guard=0; guard<200; guard++){
      const cnt = C.map((_,j)=>asg.filter(a=>a===j).length), over = cnt.findIndex(n=>n>cap);
      if(over < 0) break;
      let mv = -1, md = -1; P.forEach((p,i)=>{ if(asg[i]===over && p.lk<0){ const d = km(C[over], p); if(d > md){ md = d; mv = i; } } });
      if(mv < 0) break;
      let to = -1, td = Infinity; C.forEach((c,j)=>{ if(j!==over && cnt[j] < cap){ const d = km(c, P[mv]); if(d < td){ td = d; to = j; } } });
      if(to < 0) break; asg[mv] = to;
    }
    return asg;
  }

        // trajets, marche, conseils

        const legs = []; for(let i=1;i<stops.length;i++) legs.push({i:i-1, dk:km(stops[i-1], stops[i])});
        const tr = [];

        const tips = [];

          const cand = legs.filter(l=>l.dk<=walk).sort((a,b)=>b.dk-a.dk), names = [];
          for(const l of cand){ if(walkKm <= walkDay) break; tr.push(l.i); walkKm -= l.dk;
            const a = l.i===0 ? 'l’hôtel' : R[ids[l.i-1]].nom, b = l.i>=ids.length ? 'l’hôtel' : R[ids[l.i]].nom; names.push(`${esc(a)} → ${esc(b)} (${fmtKm(l.dk)})`); }
          tips.push(`🚇 Plus de ${fmtKm(walkDay)} à pied : prends le métro, le bus ou le tram pour ${names.join(', ')}.`);
        }
        const longLeg = legs.filter(l=>l.dk>12);
        if(longLeg.length) tips.push(`🚆 ${longLeg.length} trajet(s) de plus de 12 km : train ou VTC conseillé.`);
        const visit = ids.reduce((s,id)=>s+(R[id].cat==='musee'?120:R[id].cat==='loisir'?240:60),0);
        const move = legs.reduce((s,l)=>s+legAdvice(l.dk, walk, tr.includes(l.i)).min,0);
        if(visit + move > 11*60){
          const far = ids.filter(id=>!R[id].lock).sort((a,b)=>km(home,pts[b])-km(home,pts[a]))[0];
          tips.push(`⏱️ Journée chargée (~${fmtMin(visit+move)} avec les visites)${far ? ` : déplace « ${esc(R[far].nom)} » sur un jour plus léger` : ''}.`);
        }
        if(!ids.length) tips.push('🌿 Journée libre (ou jour de trajet).');
        const tot = legs.reduce((s,l)=>s+l.dk,0);
        resume.push({d, n:ids.length, km:tot, walk:walkKm, min:visit+move, tips});
        const lbl = (h.nom ? h.nom + ' · ' : 'Hôtel · ') + city;
        const info = Object.assign(clone(R[dayId(d)] || {}), {id:dayId(d), type:'day', trip:M.trip, date:d}); delete info.deleted;

        out.push(info);

    } catch(e){ say(''); alert(e.message); }

  }

  // Tracé de l'itinéraire d'un jour (SVG, sans service extérieur) : départ, visites numérotées, arrivée
  function routeSVG(r){
    if(!r || !r.pts) return '';
    const ids = (r.ids||[]).filter(id=>r.pts[id] && r.pts[id].lat != null);
    if(!ids.length) return '';
    const ok = p => p && p.lat != null && p.lng != null;
    const seq = [];
    if(ok(r.start)) seq.push({p:r.start, k:'D'});
    ids.forEach((id,i)=>seq.push({p:r.pts[id], k:String(i+1)}));
    const fin = r.loop ? r.start : r.end; if(ok(fin)) seq.push({p:fin, k: r.loop ? '' : 'A'});
    const lat0 = seq.reduce((s,x)=>s + +x.p.lat, 0) / seq.length, kx = Math.cos(lat0*Math.PI/180);
    const X = seq.map(x=>+x.p.lng*kx), Y = seq.map(x=>-x.p.lat);
    const W = 600, H = 260, pad = 28;
    const minX = Math.min(...X), maxX = Math.max(...X), minY = Math.min(...Y), maxY = Math.max(...Y);
    const sc = Math.min((W-2*pad)/Math.max(maxX-minX, 1e-4), (H-2*pad)/Math.max(maxY-minY, 1e-4));
    const ox = (W - (maxX-minX)*sc)/2, oy = (H - (maxY-minY)*sc)/2;
    const P = i => [(X[i]-minX)*sc + ox, (Y[i]-minY)*sc + oy].map(v=>Math.round(v*10)/10);
    const pts = seq.map((_,i)=>P(i));
    let dist = 0; for(let i=1;i<seq.length;i++) dist += km(seq[i-1].p, seq[i].p);
    // échelle : longueur « ronde » proche de 1/5 de la largeur
    const pxKm = sc / 111.32, target = W/5/pxKm, nice = [0.1,0.2,0.5,1,2,5,10,20,50,100,200,500].find(v=>v >= target*0.6) || 500, bar = nice*pxKm;
    let g = `<rect width="${W}" height="${H}" rx="10" fill="#faf7f2"/>`;
    for(let x=0;x<=W;x+=50) g += `<line x1="${x}" y1="0" x2="${x}" y2="${H}" stroke="#eee6dc" stroke-width="1"/>`;
    for(let y=0;y<=H;y+=50) g += `<line x1="0" y1="${y}" x2="${W}" y2="${y}" stroke="#eee6dc" stroke-width="1"/>`;
    g += `<polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="#7C3AED" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="${r.loop ? '0' : '0'}"/>`;
    seq.forEach((x,i)=>{
      if(!x.k) return;
      const [a,b] = pts[i], end = x.k==='D' || x.k==='A';
      g += end ? `<rect x="${a-11}" y="${b-11}" width="22" height="22" rx="5" fill="#2A1238"/><text x="${a}" y="${b+4.5}" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" font-family="sans-serif">${x.k==='D' && r.loop ? '🏨' : x.k}</text>`
        : `<circle cx="${a}" cy="${b}" r="11" fill="#fff" stroke="#7C3AED" stroke-width="2.5"/><text x="${a}" y="${b+4.5}" font-size="12" font-weight="700" fill="#4C1D95" text-anchor="middle" font-family="sans-serif">${x.k}</text>`;
    });
    g += `<line x1="${W-pad-bar}" y1="${H-14}" x2="${W-pad}" y2="${H-14}" stroke="#2A1238" stroke-width="2"/><text x="${W-pad-bar/2}" y="${H-19}" font-size="11" fill="#2A1238" text-anchor="middle" font-family="sans-serif">${nice < 1 ? nice*1000 + ' m' : nice + ' km'}</text>`;
    const st = r.start && r.start.lbl ? esc(r.start.lbl) : 'départ', en = r.loop ? 'retour au départ' : (r.end && r.end.lbl ? esc(r.end.lbl) : 'arrivée');
    return `<figure class="pr-map"><svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Carte de l’itinéraire">${g}</svg>
      <figcaption>🗺️ Itinéraire : <b>D</b> ${st} → ${ids.length} visite${ids.length>1?'s':''} → ${r.loop ? '🏨 ' + en : '<b>A</b> ' + en} · ≈ ${dist < 10 ? dist.toFixed(1) : Math.round(dist)} km à vol d’oiseau</figcaption></figure>`;
  }

    return `<svg class="${cls||'cv-share-qr'}" viewBox="0 0 ${n+2*q} ${n+2*q}" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges" role="img" aria-label="QR code de l’appli"><rect width="100%" height="100%" fill="#fff"/><path d="${d}" fill="#2A1238"/></svg>`;
  }

      <div class="v-sum-small" style="margin-bottom:6px;text-align:center">Ton ami scanne ce code avec l’appareil photo de son téléphone, puis installe l’appli sur son écran d’accueil.</div>

  async function shareLink(){
    const url = APP_URL(), text = 'Je t’invite sur Carnet de voyage : on prépare nos voyages à plusieurs (programme, budget, souvenirs), et tout est chiffré.';
    try { if(navigator.share){ await navigator.share({title:'Carnet de voyage', text, url}); return; } } catch(e){ if(e && e.name === 'AbortError') return; }

  }
  /* ══════════════════════════════════════════════════════════════════════════
     🧰 OUTILS DU VOYAGE (5 octobre 2026)
     Fiche du jour · rappels calendrier · devises · météo · tickets · carte ·
     bagages · documents · journal · paquets sans serveur
     Tout se fait sur le téléphone ; les seuls appels réseau sont des services
     publics gratuits (taux de change, météo, lecture de ticket) — jamais vers l'éditeur.
     ══════════════════════════════════════════════════════════════════════════ */
  const tlDays = () => { const t = trip(); return t && t.debut ? dayList() : []; };
  const isoToday = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
  async function tlShareFile(blob, name, title){
    try {
      const f = new File([blob], name, {type: blob.type || 'application/octet-stream'});
      if(navigator.canShare && navigator.canShare({files:[f]})){ await navigator.share({files:[f], title: title || name}); return; }
    } catch(e){ if(e && e.name === 'AbortError') return; }
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 4000);
  }
  function tlPickFile(accept, cb, capture){
    // iOS ne déclenche « change » que si le champ fait partie de la page
    const i = document.createElement('input'); i.type = 'file'; i.accept = accept; if(capture) i.setAttribute('capture', 'environment');
    i.style.cssText = 'position:fixed;left:-1000px;top:0;width:1px;height:1px;opacity:0';
    document.body.appendChild(i);
    i.addEventListener('change', () => { const f = i.files && i.files[0]; setTimeout(()=>i.remove(), 1000); if(f) cb(f); });
    i.click();
  }
  const tlB64 = { enc: buf => { const u = new Uint8Array(buf); let s = ''; for(let i=0;i<u.length;i+=0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i+0x8000)); return btoa(s); },
                dec: str => { const s = atob(str), u = new Uint8Array(s.length); for(let i=0;i<s.length;i++) u[i] = s.charCodeAt(i); return u; } };

  /* ---------- 📴 Fiche du jour ---------- */
  function tlDay(){
    const ds = tlDays(); if(!ds.length){ alert('Ajoute d’abord les dates du voyage.'); return; }
    const td = isoToday(); let i = ds.indexOf(td); if(i < 0) i = td < ds[0] ? 0 : ds.length - 1;
    const show = ds.slice(i, i+2);
    const tel = s => s ? `<a href="tel:${esc(String(s).replace(/[^+\d]/g,''))}">☎ ${esc(s)}</a>` : '';
    const map = s => s ? `<a href="https://maps.apple.com/?q=${encodeURIComponent(s)}">📍 ${esc(s)}</a>` : '';
    let h = `<h2>📴 Fiche du jour</h2><div class="v-sum-small" style="margin-bottom:8px">Enregistrée dans ton téléphone : elle s’ouvre même sans réseau. Astuce : fais une capture d’écran avant de partir.</div>`;
    show.forEach(d=>{
      const k = ds.indexOf(d), info = dayInfo(d), {own, night} = itemsForDay(d);
      h += `<div class="cv-dayc"><h3>J${k+1} · ${longDate(d)}${info.titre ? ' — ' + esc(info.titre) : ''}</h3>`;
      if(info.plan) h += `<p class="v-sum-small">${esc(info.plan)}</p>`;
      [...own, ...night].forEach(it=>{
        h += `<div class="cv-dayi"><b>${icon(it)} ${esc(it.titre)}</b>${it.heureDep||it.heure ? ` · ${esc(it.heureDep||it.heure)}${it.heureArr ? ' → ' + esc(it.heureArr) : ''}` : ''}
          <div>${[it.compagnie, it.nom && it.cat==='hotel' ? it.nom : '', it.ref ? 'Réf. <b>' + esc(it.ref) + '</b>' : ''].filter(Boolean).map(x=>x.startsWith('Réf.') ? x : esc(x)).join(' · ')}</div>
          <div class="cv-dayl">${map(it.adresse)} ${tel(it.tel)} ${it.lien ? `<a href="${esc(it.lien)}">🔗 réservation</a>` : ''}</div>${pjChips(it)}</div>`;
      });
      const pl = placesOf(d); if(pl.length) h += `<div class="v-sum-small">À voir : ${pl.map((p,n)=>`${n+1}. ${esc(p.nom)}`).join(' · ')}</div>`;
      if(!own.length && !night.length && !pl.length) h += `<div class="v-sum-small">Rien de prévu.</div>`;
      h += `</div>`;
    });
    h += `<div class="v-actions"><button type="button" class="v-btn sec" onclick="CV.close()">Fermer</button></div>`;
    openSheet(h); hydrate();
  }

  /* ---------- 🔔 Rappels dans le calendrier (même mécanisme que le menu de SimulHeures) ----------
     Pas de notification de l'appli : les rappels vont dans le calendrier du téléphone.
     • iPhone (Safari / appli installée) : l'appli ouvre une vraie adresse « rappels.ics » fabriquée
       sur le téléphone par le service worker → Calendrier s'ouvre et propose « Ajouter tout ».
     • Sinon, ou en secours : le fichier .ics est envoyé par le menu Partager (Mail, Fichiers…). */
  const ICS_KINDS = [['ech','💶 Échéances de paiement (la veille)'], ['chk','🛫 Enregistrement en ligne (24 h avant le vol)'], ['vol','✈️ Vols et trajets (alerte 3 h avant)'], ['htl','🏨 Arrivées à l’hôtel'], ['act','🎟️ Visites et réservations à heure fixe']];
  const rpIsIOS = () => /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  function tlIcsBuild(on){
    const t = trip(), ev = [], z = n => String(n).padStart(2,'0'), dt = iso => iso.replace(/-/g,'');
    const stampNow = new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+Z$/,'Z');
    const esc2 = s => String(s||'').replace(/\\/g,'\\\\').replace(/[,;]/g, m=>'\\' + m).replace(/\n/g,'\\n');
    const add = (uid, sum, start, allDay, desc, alarm) => ev.push(['BEGIN:VEVENT', 'UID:' + uid + '@carnet-voyage', 'DTSTAMP:' + stampNow,
      allDay ? 'DTSTART;VALUE=DATE:' + start : 'DTSTART:' + start, allDay ? '' : 'DURATION:PT30M', 'SUMMARY:' + esc2(sum), desc ? 'DESCRIPTION:' + esc2(desc) : '',
      'BEGIN:VALARM', 'ACTION:DISPLAY', 'DESCRIPTION:' + esc2(sum), 'TRIGGER:' + (alarm || '-PT2H'), 'END:VALARM', 'END:VEVENT'].filter(Boolean).join('\r\n'));
    items().forEach(it=>{
      if(on.ech) (it.echeances||[]).forEach((e,k)=>{ if(e.fait || !e.date) return; const d = e.date.length === 7 ? e.date + '-05' : e.date;
        add('ech-' + it.id + '-' + k, '💶 ' + (it.titre||'Paiement') + ' : ' + eur(num(e.montant)), dt(d), true, t.titre, '-P1D'); });
      if(it.cat==='transport' && it.date && it.heureDep){
        if(on.chk && it.mode==='Avion'){ const d = new Date(it.date + 'T' + it.heureDep + ':00'); d.setDate(d.getDate() - 1);
          add('chk-' + it.id, '🛫 Enregistrement en ligne : ' + it.titre + (it.compagnie ? ' (' + it.compagnie + ')' : ''), d.getFullYear() + z(d.getMonth()+1) + z(d.getDate()) + 'T' + z(d.getHours()) + z(d.getMinutes()) + '00', false, it.ref ? 'Réf. ' + it.ref : '', '-PT0M'); }
        if(on.vol) add('vol-' + it.id, icon(it) + ' ' + it.titre + (it.compagnie ? ' · ' + it.compagnie : ''), dt(it.date) + 'T' + it.heureDep.replace(':','') + '00', false, [it.ref ? 'Réf. ' + it.ref : '', it.adresse].filter(Boolean).join(' · '), '-PT3H');
      }
      if(on.htl && it.cat==='hotel' && it.date) add('htl-' + it.id, '🏨 Arrivée : ' + (it.nom || it.titre), it.heure ? dt(it.date) + 'T' + it.heure.replace(':','') + '00' : dt(it.date), !it.heure, [it.adresse, it.ref ? 'Réf. ' + it.ref : ''].filter(Boolean).join(' · '), it.heure ? '-PT2H' : '-PT9H');
      if(on.act && it.cat==='activite' && it.date && it.heure) add('act-' + it.id, '🎟️ ' + it.titre, dt(it.date) + 'T' + it.heure.replace(':','') + '00', false, it.adresse || '', '-PT1H');
    });
    return {n: ev.length, txt: ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Carnet de voyage//Rappels//FR','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:' + esc2(t.titre), ...ev, 'END:VCALENDAR'].join('\r\n')};
  }
  function tlIcs(){
    const t = trip(); if(!t) return;
    const on = M.icsOn || {ech:1, chk:1, vol:1, htl:1, act:1};
    openSheet(`<h2>📅 Rappels dans mon calendrier</h2>
      <div class="v-sum-small" style="margin-bottom:8px">Pas de notification de l’appli : tes rappels vont dans le calendrier de ton téléphone. Tu les modifies ou les supprimes là-bas, comme tes autres rendez-vous.</div>
      <div class="v-f">${ICS_KINDS.map(([k,l])=>`<label class="cv-checkline"><input type="checkbox" id="ics-${k}"${on[k]?' checked':''}> ${l}</label>`).join('')}</div>
      <div id="ics-msg" class="v-sum-small" style="margin:6px 0"></div>
      <button type="button" class="v-btn" onclick="CV.tlIcsGo()">📅 Ajouter à mon calendrier</button>
      <button type="button" class="v-btn sec" id="ics-share" style="${rpIsIOS() ? 'display:none' : ''}" onclick="CV.tlIcsGo(true)">📤 Envoyer le fichier (Mail, Fichiers…)</button>
      <div class="v-sum-small" style="text-align:center;margin-top:6px">Pour arrêter un rappel, supprime-le dans ton calendrier.</div>
      <div class="v-actions"><button type="button" class="v-btn sec" onclick="CV.close()">Fermer</button></div>`);
  }
  const icsMsg = (m, ok) => { const e = document.getElementById('ics-msg'); if(e){ e.innerHTML = m; e.style.color = ok ? '#15803d' : '#b45309'; } };
  const rpB64 = txt => btoa(unescape(encodeURIComponent(txt))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
  function tlIcsGo(share){
    const on = {}; ICS_KINDS.forEach(([k])=>{ const e = document.getElementById('ics-' + k); on[k] = e && e.checked ? 1 : 0; });
    M.icsOn = on; persist();
    const r = tlIcsBuild(on);
    if(!r.n){ icsMsg('Rien à rappeler : coche au moins un type, ou ajoute des dates, des horaires ou un échéancier à tes fiches.'); return; }
    const t = trip(), fn = 'rappels-' + (t.titre||'voyage').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'') + '.ics';
    const iosOther = rpIsIOS() && /CriOS|FxiOS|EdgiOS|OPiOS/.test(navigator.userAgent || '');   // Chrome, Firefox… sur iPhone n'ouvrent pas Calendrier
    if(rpIsIOS() && !iosOther && !share){
      const sh = document.getElementById('ics-share'); if(sh) sh.style.display = 'block';
      if(!(navigator.serviceWorker && navigator.serviceWorker.controller)){ icsMsg('Ouverture directe pas encore prête (l’appli doit avoir été ouverte une fois avec du réseau). Utilise « Envoyer le fichier » → Mail vers toi, puis touche le fichier.'); return; }
      icsMsg(`Ouverture de Calendrier… touche <b>« Ajouter tout »</b> (${r.n} rappel${r.n>1?'s':''}).`, true);
      location.href = 'rappels.ics?c=' + rpB64(r.txt);
      return;
    }
    const f = new File([r.txt], fn, {type:'text/calendar'});
    if(navigator.share && navigator.canShare && navigator.canShare({files:[f]})){
      navigator.share({files:[f], title:'Rappels ' + (t.titre||'')}).then(()=>icsMsg(`${r.n} rappel(s) prêt(s). Choisis Calendrier ou ton agenda pour les ajouter.`, true))
        .catch(e=>{ if(e && e.name === 'AbortError') icsMsg('Ajout annulé.'); else tlShareFile(f, fn); });
      return;
    }
    tlShareFile(f, fn); icsMsg(`${r.n} rappel(s) prêt(s) : ouvre le fichier ${esc(fn)} pour les ajouter à ton calendrier.`, true);
  }

  /* ---------- 💱 Devises ---------- */
  const FX_LIST = ['USD','GBP','CHF','JPY','MAD','EGP','TND','TRY','THB','CAD','AUD','NZD','SEK','NOK','DKK','ISK','CZK','HUF','PLN','RON','BGN','MXN','BRL','ARS','CNY','HKD','KRW','INR','IDR','VND','PHP','SGD','MYR','AED','QAR','ILS','JOD','ZAR','KES','XOF','XPF'];
  const fxOpts = sel => FX_LIST.map(c=>`<option${c===sel?' selected':''}>${c}</option>`).join('');
  async function fxRates(){
    if(M.fx && Date.now() - M.fx.t < 12*3600e3) return M.fx.rates;
    let rates = null;
    try { const r = await fetch('https://open.er-api.com/v6/latest/EUR'); const j = await r.json(); if(j && j.rates) rates = j.rates; } catch(e){}
    if(!rates) try { const r = await fetch('https://api.frankfurter.app/latest?from=EUR'); const j = await r.json(); if(j && j.rates) rates = Object.assign({EUR:1}, j.rates); } catch(e){}
    if(rates){ M.fx = {t:Date.now(), rates}; persist(); return rates; }
    if(M.fx) return M.fx.rates;   // hors ligne : derniers taux connus
    throw new Error('Taux de change indisponibles (pas de réseau ?).');
  }
  async function fxToEur(amount, cur){ const r = await fxRates(); if(!r[cur]) throw new Error('Devise non disponible : ' + cur); return amount / r[cur]; }
  async function fxTool(){
    const a = num((document.getElementById('fxo-a')||{}).value), c = (document.getElementById('fxo-c')||{}).value, out = document.getElementById('fxo-r');
    if(!a){ out.textContent = 'Saisis un montant.'; return; }
    try { const e = await fxToEur(a, c); M.fxLast = c; persist(); out.innerHTML = `<b>${a.toLocaleString('fr-FR')} ${c} = ${eur(e)}</b> · taux du ${new Date(M.fx.t).toLocaleDateString('fr-FR')}`; }
    catch(e){ out.textContent = '⚠️ ' + e.message; }
  }
  async function fxFill(){
    const a = num((document.getElementById('fx-a')||{}).value), c = (document.getElementById('fx-c')||{}).value, f = document.querySelector('#v-form [name=prix]');
    if(!a || !f) return;
    try { const e = await fxToEur(a, c); M.fxLast = c; persist(); f.value = String(Math.round(e*100)/100).replace('.', ','); f.dispatchEvent(new Event('input', {bubbles:true}));
      const n = document.getElementById('fx-n'); if(n) n.textContent = `${a.toLocaleString('fr-FR')} ${c} ≈ ${eur(e)} (taux du ${new Date(M.fx.t).toLocaleDateString('fr-FR')})`; }
    catch(e){ alert(e.message); }
  }

  async function meteoFor(st){
    const key = 'mt:' + normQ(st.city) + ':' + st.debut + ':' + st.fin; M.meteo = M.meteo || {};
    const hit = M.meteo[key]; if(hit && Date.now() - hit.t < 6*3600e3) return hit.v;
    const c = await geocode(st.city, null); if(!c) throw new Error('ville introuvable');
    const days = (new Date(st.debut) - new Date(isoToday())) / 864e5;
    let v;
    if(days >= -1 && days <= 14){
      const end = st.fin > st.debut ? st.fin : st.debut;
      const r = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${c.lat}&longitude=${c.lng}&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,weathercode&timezone=auto&start_date=${st.debut}&end_date=${end}`);
      const j = await r.json(); const d = j.daily || {};
      v = {kind:'prev', max:Math.round(Math.max(...d.temperature_2m_max)), min:Math.round(Math.min(...d.temperature_2m_min)), pluie:Math.max(...(d.precipitation_probability_max||[0])), code:(d.weathercode||[])[0]};
    } else {
      const y = new Date().getFullYear() - (st.debut.slice(5) > isoToday().slice(5) ? 1 : 0);
      const shift = s => (y + s.slice(4));
      const r = await fetch(`https://archive-api.open-meteo.com/v1/archive?latitude=${c.lat}&longitude=${c.lng}&start_date=${shift(st.debut)}&end_date=${shift(st.fin > st.debut ? st.fin : st.debut)}&daily=temperature_2m_max,temperature_2m_min,precipitation_sum&timezone=auto`);
      const j = await r.json(); const d = j.daily || {}; const mx = d.temperature_2m_max||[], mn = d.temperature_2m_min||[];
      if(!mx.length) throw new Error('pas de données');
      const avg = a => Math.round(a.reduce((s,x)=>s+(x||0),0)/a.length);
      v = {kind:'clim', year:y, max:avg(mx), min:avg(mn), jp:(d.precipitation_sum||[]).filter(x=>x>=1).length, n:mx.length};
    }
    M.meteo[key] = {t:Date.now(), v}; persist(); return v;
  }

  async function tlRcOcr(){

      const small = await shrink(rcpt.blob, 1600, 0.85);

  function geoCached(city){ const r = R['geo:' + normQ(city)]; return r && !r.deleted && r.lat != null ? {lat:r.lat, lng:r.lng} : null; }
  function tripMapSVG(pts){
    if(pts.length < 1) return '';
    const W = 600, H = 300, pad = 34, lat0 = pts.reduce((s,p)=>s+p.lat,0)/pts.length, kx = Math.cos(lat0*Math.PI/180);
    const X = pts.map(p=>p.lng*kx), Y = pts.map(p=>-p.lat), mnX = Math.min(...X), mxX = Math.max(...X), mnY = Math.min(...Y), mxY = Math.max(...Y);
    const sc = Math.min((W-2*pad)/Math.max(mxX-mnX,1e-3), (H-2*pad)/Math.max(mxY-mnY,1e-3)), ox = (W-(mxX-mnX)*sc)/2, oy = (H-(mxY-mnY)*sc)/2;
    const P = pts.map((_,i)=>[Math.round(((X[i]-mnX)*sc+ox)*10)/10, Math.round(((Y[i]-mnY)*sc+oy)*10)/10]);
    let tot = 0; for(let i=1;i<pts.length;i++) tot += km(pts[i-1], pts[i]);
    let g = `<rect width="${W}" height="${H}" rx="12" fill="#f4f1fb"/>`;
    for(let x=0;x<=W;x+=60) g += `<line x1="${x}" y1="0" x2="${x}" y2="${H}" stroke="#e7e0f3"/>`; for(let y=0;y<=H;y+=60) g += `<line x1="0" y1="${y}" x2="${W}" y2="${y}" stroke="#e7e0f3"/>`;
    g += `<polyline points="${P.map(p=>p.join(',')).join(' ')}" fill="none" stroke="#7C3AED" stroke-width="3" stroke-dasharray="7 5" stroke-linecap="round"/>`;
    P.forEach(([a,b],i)=>{ const right = a < W - 140;
      g += `<circle cx="${a}" cy="${b}" r="12" fill="#2A1238"/><text x="${a}" y="${b+4.5}" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" font-family="sans-serif">${i+1}</text>
        <text x="${right ? a+16 : a-16}" y="${b+4}" font-size="13" font-weight="700" fill="#2A1238" text-anchor="${right?'start':'end'}" font-family="sans-serif" paint-order="stroke" stroke="#f4f1fb" stroke-width="4">${esc(pts[i].lbl)}</text>`; });
    return `<figure class="pr-map"><svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Carte du voyage">${g}</svg>
      <figcaption>🗺️ ${pts.length} étape${pts.length>1?'s':''} · ≈ ${Math.round(tot).toLocaleString('fr-FR')} km à vol d’oiseau entre les étapes</figcaption></figure>`;
  }

  async function pkgKey(pass, salt){
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass.trim()), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:200000, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
  }


  function pkgImport(){ tlPickFile('.carnet,application/octet-stream,application/json,text/plain', f => pkgOpen(f)); }
  /* ---------- 📦 Fusion intelligente des paquets ----------
     Chaque fiche (vol, hôtel, note, dépense, souvenir…) porte sa date de modification.
     M.pkgBase garde, pour chaque fiche, la version connue au dernier échange (envoi ou réception).
     À la réception :
       • fiche nouvelle chez l'autre          → ajoutée
       • modifiée seulement chez l'autre      → mise à jour
       • modifiée seulement chez moi          → gardée telle quelle
       • modifiée des deux côtés (conflit)    → fusion champ par champ (la plus récente, complétée par
                                                ce que l'autre a rempli et que la récente a laissé vide,
                                                photos réunies), ou choix « la mienne / la sienne ».
     Rien n'est effacé, sauf ce que l'autre a explicitement supprimé (et que tu n'as pas retouché depuis). */
  function pkgSnap(){ M.pkgBase = M.pkgBase || {}; Object.values(R).forEach(r=>{ if(r && r.id && !r.demo) M.pkgBase[r.id] = r.updatedAt || 0; }); }
  const SKIP_F = ['updatedAt','updatedBy','createdAt','createdBy'];
  function pkgFuse(mine, theirs){
    const newer = (theirs.updatedAt||0) >= (mine.updatedAt||0) ? theirs : mine, older = newer === theirs ? mine : theirs;
    const out = clone(newer);
    Object.keys(older).forEach(k=>{
      if(SKIP_F.includes(k) || k === 'deleted') return;
      const a = out[k], b = older[k];
      if((a == null || a === '' || (Array.isArray(a) && !a.length)) && b != null && b !== '') out[k] = clone(b);
      else if(k === 'photos' && Array.isArray(a) && Array.isArray(b)) out[k] = [...new Set([...a, ...b])];
    });
    if(mine.deleted !== theirs.deleted) out.deleted = newer.deleted;
    out.updatedAt = Math.max(mine.updatedAt||0, theirs.updatedAt||0) + 1;
    return out;
  }
  const sameRec = (a, b) => { const s = r => JSON.stringify(Object.keys(r).filter(k=>!SKIP_F.includes(k)).sort().map(k=>[k, r[k]])); return s(a) === s(b); };
  const recLabel = r => (r.type==='item' ? icon(r) + ' ' + (r.titre||'') : r.type==='note' ? '📌 ' + (r.texte||'').slice(0,40) : r.type==='souv' ? '📸 ' + (r.titre||'souvenir') : r.type==='trip' ? '🧭 ' + (r.titre||'voyage') : r.type==='day' ? '🗓️ ' + (r.titre || r.date || 'jour') : r.type==='check' ? '✅ ' + (r.label||'') : r.type==='profile' ? '👤 ' + (r.nom||'') : r.type==='doc' ? '🛂 ' + (r.kind||'') : r.type) + (r.deleted ? ' (supprimé)' : '');
  let pkgPending = null;
  async function pkgOpenV1(f){
    let o; try { o = JSON.parse(await f.text()); } catch(e){ alert('Ce fichier n’est pas un paquet du carnet.'); return; }
    if(!o || !o.carnetPaquet){ alert('Ce fichier n’est pas un paquet du carnet.'); return; }
    const pass = prompt('Phrase du groupe :', M.pkgPass || ''); if(pass === null) return;
    let data;
    try { const plain = await crypto.subtle.decrypt({name:'AES-GCM', iv:tlB64.dec(o.iv)}, await pkgKey(pass, tlB64.dec(o.salt)), tlB64.dec(o.data)); data = JSON.parse(new TextDecoder().decode(plain)); }
    catch(e){ alert('Phrase incorrecte : impossible d’ouvrir ce paquet.'); return; }
    M.pkgPass = pass.trim();
    return pkgMerge(data, data.photos || {});
  }
  function pkgMerge(data, photos){
    M.pkgBase = M.pkgBase || {};
    const add = [], upd = [], keep = [], conf = [];
    (data.records||[]).forEach(r=>{
      if(!r || !r.id || r.demo) return;
      const cur = R[r.id], base = M.pkgBase[r.id] || 0;
      if(!cur) return add.push(r);
      if(sameRec(cur, r)) return;
      const iChanged = (cur.updatedAt||0) > base, theyChanged = (r.updatedAt||0) > base;
      if(theyChanged && !iChanged) upd.push(r);
      else if(iChanged && !theyChanged) keep.push(r);
      else if((r.updatedAt||0) === (cur.updatedAt||0)) keep.push(r);
      else conf.push({mine:cur, theirs:r, pick:'fuse'});
    });
    pkgPending = {data, photos, add, upd, keep, conf};
    if(!conf.length) return pkgApply();
    openSheet(`<h2>📦 Paquet de ${esc(data.from || 'ton ami')}</h2>
      <div class="v-sum-small" style="margin-bottom:8px">${add.length} nouvelle(s) fiche(s) · ${upd.length} mise(s) à jour · ${keep.length} gardée(s) chez toi.<br>
      <b>${conf.length} fiche(s) modifiée(s) des deux côtés</b> : choisis pour chacune. « Fusionner » garde la version la plus récente et la complète avec ce que l’autre avait rempli.</div>
      ${conf.map((c,i)=>`<div class="cv-dayi"><b>${esc(recLabel(c.mine))}</b><div class="v-sum-small">chez toi : ${new Date(c.mine.updatedAt||0).toLocaleString('fr-FR')} · chez ${esc(data.from||'lui')} : ${new Date(c.theirs.updatedAt||0).toLocaleString('fr-FR')}</div>
        <select class="v-in" onchange="CV.pkgPick(${i}, this.value)"><option value="fuse">🔀 Fusionner (recommandé)</option><option value="mine">✋ Garder la mienne</option><option value="theirs">📥 Prendre la sienne</option></select></div>`).join('')}
      <div class="v-actions"><button type="button" class="v-btn" onclick="CV.pkgApply()">✅ Appliquer</button><button type="button" class="v-btn sec cv-sq" onclick="CV.close()">✕</button></div>`);
  }
  function pkgPick(i, v){ if(pkgPending && pkgPending.conf[i]) pkgPending.conf[i].pick = v; }
  async function pkgApply(){
    const P = pkgPending; if(!P) return; pkgPending = null;
    const touch = r => { R[r.id] = r; markDirty(r.id); };
    P.add.forEach(touch); P.upd.forEach(touch);
    let nf = 0; P.conf.forEach(c=>{ if(c.pick === 'theirs') touch(c.theirs); else if(c.pick === 'fuse'){ touch(pkgFuse(c.mine, c.theirs)); nf++; } });
    let np = 0;
    for(const [id, s] of Object.entries(P.photos||{})){
      try { const ex = await IDB.get(id); if(ex && ex.blob) continue; await IDB.put({id, blob:new Blob([typeof s === 'function' ? await s() : tlB64.dec(s)], {type:'image/jpeg'}), up:0}); np++; if(M.sync && M.sync.on){ M.pq = M.pq || []; M.pq.push(id); } } catch(e){}
    }
    pkgSnap();
    if(!M.trip || !R[M.trip]){ const tt = trips()[0]; if(tt) M.trip = tt.id; }
    persist(); closeSheet(true); refresh(); if(M.sync && M.sync.on){ queueSync(); uploadQueue(); }
    alert(`📥 Paquet de ${P.data.from || 'quelqu’un'} fusionné :\n• ${P.add.length} fiche(s) ajoutée(s)\n• ${P.upd.length} mise(s) à jour\n• ${P.keep.length} gardée(s) telles quelles chez toi\n• ${P.conf.length} conflit(s) réglé(s)${nf ? ' (' + nf + ' fusionnée(s))' : ''}\n• ${np} photo(s) ajoutée(s)\n\nRien de ce que tu avais saisi n’a été perdu.`);
  }
  const pkgBox = () => `<div class="v-box"><h3>📦 Sans serveur : paquets à échanger</h3>
    <p>Pour ceux qui ne veulent pas passer par la synchro en ligne : après tes modifications, envoie un <b>paquet chiffré</b> dans votre conversation de groupe ; les autres le reçoivent et tout se fusionne. Rien ne passe par le serveur de l’appli.</p>

    ${M.pkgLast ? `<div class="v-sum-small" style="margin-top:6px">Dernier paquet envoyé le ${new Date(M.pkgLast).toLocaleString('fr-FR')}.</div>` : ''}
    <div class="v-sum-small" style="margin-top:6px">Les deux modes cohabitent : un membre synchronisé peut aussi recevoir un paquet, il sera ensuite partagé avec les autres via la synchro.</div></div>`;

  /* ══════════════════════════════════════════════════════════════════════════
     🗺️ CARTES « type Google Maps » (fond de carte CARTO / OpenStreetMap)
     + 📄 PDF généré sur le téléphone (pdf-lib) : un vrai fichier, bien cadré,
       à enregistrer, imprimer ou envoyer depuis le menu Partager.
     ══════════════════════════════════════════════════════════════════════════ */
  // Fonds de carte gratuits, sans clé : OpenStreetMap, puis Esri en secours (CARTO exige désormais une clé).
  const TILES = [
    {url:(z,x,y)=>`https://tile.openstreetmap.org/${z}/${x}/${y}.png`, by:'© contributeurs OpenStreetMap'},
    {url:(z,x,y)=>`https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/${z}/${y}/${x}`, by:'© Esri, HERE, OpenStreetMap'}
  ];
  const tileImg = {}; let tileBy = TILES[0].by;
  function loadOne(src){ return new Promise(res=>{ const im = new Image(); im.crossOrigin = 'anonymous'; let done = false; const end = v => { if(!done){ done = true; res(v); } };
    im.onload = ()=>end(im); im.onerror = ()=>end(null); im.src = src; setTimeout(()=>end(null), 8000); }); }
  function loadTile(z,x,y){
    const k = z+'/'+x+'/'+y; if(tileImg[k]) return tileImg[k];
    return tileImg[k] = (async()=>{ for(const t of TILES){ const im = await loadOne(t.url(z,x,y)); if(im){ tileBy = t.by; return im; } } return null; })();
  }
  const lon2x = (lng,z) => (lng+180)/360*Math.pow(2,z)*256;
  const lat2y = (lat,z) => { const r = lat*Math.PI/180; return (1-Math.log(Math.tan(r)+1/Math.cos(r))/Math.PI)/2*Math.pow(2,z)*256; };
  // Dessine une carte : fond de carte + tracé + repères. Renvoie un <canvas> (fond uni si hors ligne).
  async function drawMap(o){
    const W = o.w || 640, H = o.h || 380, S = 2, pad = o.pad || 46;
    const all = [...(o.markers||[]), ...((o.line||[]).map(p=>({lat:p[0], lng:p[1]})))].filter(p=>p && p.lat != null && p.lng != null);
    const c = document.createElement('canvas'); c.width = W*S; c.height = H*S; const g = c.getContext('2d'); g.scale(S,S);
    g.fillStyle = '#eef0f3'; g.fillRect(0,0,W,H);
    if(!all.length) return c;
    let z = 17;
    const mnLat = Math.min(...all.map(p=>p.lat)), mxLat = Math.max(...all.map(p=>p.lat)), mnLng = Math.min(...all.map(p=>p.lng)), mxLng = Math.max(...all.map(p=>p.lng));
    for(; z > 1; z--){ if(lon2x(mxLng,z)-lon2x(mnLng,z) <= W-2*pad && lat2y(mnLat,z)-lat2y(mxLat,z) <= H-2*pad) break; }
    if(o.maxZoom) z = Math.min(z, o.maxZoom);
    const cx = (lon2x(mnLng,z)+lon2x(mxLng,z))/2, cy = (lat2y(mnLat,z)+lat2y(mxLat,z))/2, x0 = cx - W/2, y0 = cy - H/2;
    const P = p => [lon2x(p.lng,z)-x0, lat2y(p.lat,z)-y0];
    let tilesOk = 0;
    if(o.tiles !== false){
      const n = Math.pow(2,z), jobs = [];
      for(let tx = Math.floor(x0/256); tx <= Math.floor((x0+W)/256); tx++) for(let ty = Math.floor(y0/256); ty <= Math.floor((y0+H)/256); ty++){
        if(ty < 0 || ty >= n) continue; const wx = ((tx % n) + n) % n;
        jobs.push(loadTile(z,wx,ty).then(im=>{ if(im){ g.drawImage(im, tx*256-x0, ty*256-y0, 256, 256); tilesOk++; } }));
      }
      await Promise.all(jobs);
    }
    if(!tilesOk){ g.strokeStyle = '#dde1e7'; g.lineWidth = 1; for(let x=0;x<W;x+=40){ g.beginPath(); g.moveTo(x,0); g.lineTo(x,H); g.stroke(); } for(let y=0;y<H;y+=40){ g.beginPath(); g.moveTo(0,y); g.lineTo(W,y); g.stroke(); } }
    const line = (o.line||[]).map(p=>P({lat:p[0], lng:p[1]}));
    if(line.length > 1){
      g.lineJoin = 'round'; g.lineCap = 'round';
      g.strokeStyle = 'rgba(255,255,255,.95)'; g.lineWidth = 8; g.setLineDash(o.dashed ? [12,9] : []); g.beginPath(); line.forEach(([a,b],i)=> i ? g.lineTo(a,b) : g.moveTo(a,b)); g.stroke();
      g.strokeStyle = o.color || '#4f46e5'; g.lineWidth = 4.5; g.beginPath(); line.forEach(([a,b],i)=> i ? g.lineTo(a,b) : g.moveTo(a,b)); g.stroke(); g.setLineDash([]);
    }
    (o.markers||[]).forEach(m=>{
      const [a,b] = P(m), home = m.kind === 'home';
      g.fillStyle = home ? '#111827' : (m.color || '#dc2626'); g.strokeStyle = '#fff'; g.lineWidth = 2.5;
      g.beginPath(); g.moveTo(a, b); g.bezierCurveTo(a-12, b-14, a-12, b-30, a, b-30); g.bezierCurveTo(a+12, b-30, a+12, b-14, a, b); g.fill(); g.stroke();
      g.fillStyle = '#fff'; g.font = 'bold 12px -apple-system,Helvetica,Arial,sans-serif'; g.textAlign = 'center'; g.fillText(m.label != null ? String(m.label) : '', a, b-17);
      if(m.name){ g.font = '600 12px -apple-system,Helvetica,Arial,sans-serif'; g.textAlign = 'left'; g.lineWidth = 4; g.strokeStyle = 'rgba(255,255,255,.95)'; g.strokeText(m.name, a+13, b-12); g.fillStyle = '#111827'; g.fillText(m.name, a+13, b-12); }
    });
    g.font = '10px -apple-system,Helvetica,Arial,sans-serif'; g.textAlign = 'right'; const at = tilesOk ? tileBy : 'Carte hors ligne (fond indisponible)';
    g.fillStyle = 'rgba(255,255,255,.85)'; g.fillRect(W - g.measureText(at).width - 12, H-16, g.measureText(at).width + 12, 16); g.fillStyle = '#374151'; g.fillText(at, W-6, H-4);
    return c;
  }
  // Tracé à pied par les rues (serveur public FOSSGIS / OSRM), mis en cache dans la fiche du jour ; sinon lignes droites.
  async function walkLine(stops){
    const pts = stops.filter(p=>p && p.lat != null);
    if(pts.length < 2) return pts.map(p=>[p.lat,p.lng]);
    try {
      const u = 'https://routing.openstreetmap.de/routed-foot/route/v1/foot/' + pts.map(p=>(+p.lng).toFixed(5)+','+(+p.lat).toFixed(5)).join(';') + '?overview=full&geometries=geojson';
      const r = await withTimeout(fetch(u), 12000); const j = await r.json();
      const co = j && j.routes && j.routes[0] && j.routes[0].geometry.coordinates;
      if(co && co.length > 1){ const step = Math.max(1, Math.ceil(co.length/400)); return co.filter((_,i)=>i%step===0 || i===co.length-1).map(c=>[+c[1].toFixed(5), +c[0].toFixed(5)]); }
    } catch(e){}
    return pts.map(p=>[p.lat,p.lng]);
  }
  async function dayMapCanvas(d, w, h){
    const info = dayInfo(d), r = info.route; if(!r || !r.ids || !r.ids.length) return null;
    const pl = placesOf(d), byId = Object.fromEntries(pl.map(p=>[p.id,p]));
    const stops = [r.start, ...r.ids.map(id=>r.pts[id]), r.loop ? r.start : r.end].filter(p=>p && p.lat != null);
    let line = r.geom;
    const sig = stops.map(p=>(+p.lat).toFixed(4)+','+(+p.lng).toFixed(4)).join(';');
    if(!line || r.geomSig !== sig){ line = await walkLine(stops);
      if(line.length > stops.length){ const rec = clone(R[dayId(d)]); if(rec && rec.route){ rec.route.geom = line; rec.route.geomSig = sig; R[rec.id] = rec; stamp(rec); markDirty(rec.id); persist(); } } }
    const markers = [Object.assign({kind:'home', label:'D'}, r.start)];
    r.ids.forEach((id,i)=>{ const p = r.pts[id]; if(p) markers.push({lat:p.lat, lng:p.lng, label:i+1, name: byId[id] ? byId[id].nom : ''}); });
    if(!r.loop && r.end && r.end.lat != null) markers.push(Object.assign({kind:'home', label:'A'}, r.end));
    return drawMap({w, h, line, markers});
  }
  async function tripMapCanvas(w, h){
    const st = tlStages(); if(!st.length) return null;
    const pts = []; for(const s of st){ const c = geoCached(s.city) || await geocode(s.city, null).catch(()=>null); if(c) pts.push({lat:c.lat, lng:c.lng, name:s.city}); }
    if(!pts.length) return null;
    const steps = geoSouvs(M.trip).map(s=>({lat:s.lat, lng:s.lng, label:'•', color:'#16a34a'}));
    return drawMap({w, h, line: pts.map(p=>[p.lat,p.lng]), dashed:true, color:'#7C3AED', maxZoom:12, markers: [...pts.map((p,i)=>Object.assign({label:i+1, color:'#7C3AED'}, p)), ...steps]});
  }
  async function hydrateMaps(){
    for(const el of [...document.querySelectorAll('[data-rmap]:not([data-ok]),[data-tmap]:not([data-ok])')]){
      el.dataset.ok = '1'; el.innerHTML = '<div class="v-sum-small">🗺️ Carte en cours…</div>';
      const mk = 'mapimg:' + (el.dataset.rmap || ('trip-' + M.trip));

        if(c){ const u = c.toDataURL('image/jpeg', .86); el.innerHTML = `<img src="${u}" alt="Carte" style="width:100%;border-radius:12px;display:block">`;

        else el.innerHTML = ''; }

    }

  /* ---------- 📋 Coller une confirmation de réservation ---------- */
  const MOIS_FR = {janv:1,jan:1,janvier:1,fevr:2,fev:2,feb:2,fevrier:2,mars:3,mar:3,march:3,avr:4,avril:4,apr:4,april:4,mai:5,may:5,juin:6,jun:6,june:6,juil:7,juillet:7,jul:7,july:7,aout:8,aug:8,august:8,sept:9,sep:9,septembre:9,september:9,oct:10,octobre:10,october:10,nov:11,novembre:11,november:11,dec:12,decembre:12,december:12};
  function cfDates(txt){
    const out = [], n = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\./g,'');
    let m; const re1 = /\b(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})\b/g;
    while((m = re1.exec(txt))){ let y = +m[3]; if(y < 100) y += 2000; out.push({i:m.index, d:`${y}-${String(+m[2]).padStart(2,'0')}-${String(+m[1]).padStart(2,'0')}`}); }
    const re2 = /\b(\d{4})-(\d{2})-(\d{2})\b/g; while((m = re2.exec(txt))) out.push({i:m.index, d:m[0]});
    const re3 = /\b(\d{1,2})(?:er)?\s+([a-zA-Zéèûôàç]{3,10})\.?\s+(\d{4})\b/g;
    while((m = re3.exec(txt))){ const mo = MOIS_FR[n(m[2])]; if(mo) out.push({i:m.index, d:`${m[3]}-${String(mo).padStart(2,'0')}-${String(+m[1]).padStart(2,'0')}`}); }
    const re4 = /\b([a-zA-Z]{3,9})\.?\s+(\d{1,2}),?\s+(\d{4})\b/g;
    while((m = re4.exec(txt))){ const mo = MOIS_FR[n(m[1])]; if(mo) out.push({i:m.index, d:`${m[3]}-${String(mo).padStart(2,'0')}-${String(+m[2]).padStart(2,'0')}`}); }
    return out.filter(x=>!isNaN(new Date(x.d))).sort((a,b)=>a.i-b.i).map(x=>x.d);
  }
  function cfParse(txt){
    const T = txt.replace(/\r/g,''), low = T.toLowerCase();
    const r = {kind:'autre'};
    const ref = T.match(/(?:PNR|r[ée]f[ée]rence(?: de r[ée]servation| du dossier)?|num[ée]ro de (?:r[ée]servation|confirmation|dossier)|booking (?:reference|ref|number)|confirmation(?: number| code|)|code de r[ée]servation|dossier)\s*[:#nN°º.]*\s*([A-Z0-9]{5,12})\b/i);
    if(ref) r.ref = ref[1].toUpperCase();
    const fl = T.match(/\b(?:vol|flight|flug)\s*[:#nN°º]*\s*([A-Z0-9]{2})\s?(\d{1,4})\b/i) || T.match(/\b((?:[A-Z]{2}|[A-Z]\d|\d[A-Z]))\s?(\d{2,4})\b(?=[^\n]{0,40}(?:\d{1,2}[:h]\d{2}|départ|depart|departure))/);
    const iata = [...T.matchAll(/\(([A-Z]{3})\)/g)].map(m=>m[1]);
    const times = [...T.matchAll(/\b([01]?\d|2[0-3])[:h]([0-5]\d)\b/g)].map(m=>m[1].padStart(2,'0') + ':' + m[2]);
    const dates = cfDates(T);
    if(fl || /embarquement|boarding|vol |flight|a[ée]roport|airport/.test(low)){
      r.kind = 'vol'; if(fl) r.flight = (fl[1] + fl[2]).toUpperCase();
      const ap = [...T.matchAll(/([A-ZÀ-Ý][A-Za-zÀ-ÿ'’-]+(?:[ -][A-Za-zÀ-ÿ'’-]+){0,4})\s*\(([A-Z]{3})\)/g)].map(m=>m[1].trim().split(/\s+/)[0]);
      if(ap.length >= 2){ r.from = ap[0]; r.to = ap[1]; } else if(iata.length >= 2){ r.from = iata[0]; r.to = iata[1]; }
      const fr = T.match(/(?:de|from|départ de)\s+([A-ZÉ][\wéèêàç' -]{2,30}?)\s+(?:à|to|vers|->|→)\s+([A-ZÉ][\wéèêàç' -]{2,30})/);
      if(fr && !r.from){ r.from = fr[1].trim(); r.to = fr[2].trim(); }
    } else if(/h[oô]tel|check-?in|arriv[ée]e|nuit|night|booking\.com|airbnb|chambre|room/.test(low)){
      r.kind = 'hotel';
      const hn = T.match(/(?:h[oô]tel|hotel|établissement|propriété|property)\s*[:\-]?\s*([^\n]{3,60})/i); if(hn) r.nom = hn[1].trim().replace(/^[:\-\s]+/,'');
      const ad = T.match(/(?:adresse|address)\s*[:\-]?\s*([^\n]{6,90})/i); if(ad) r.adresse = ad[1].trim();
    } else if(/train|sncf|tgv|ouigo|trenitalia|renfe|db bahn|eurostar|bus|flixbus|car /.test(low)){
      r.kind = /bus|flixbus|car /.test(low) ? 'bus' : 'train';
      const fr = T.match(/([A-ZÉ][\wéèêàç' -]{2,30}?)\s*(?:->|→|›|>|à|to)\s*([A-ZÉ][\wéèêàç' -]{2,30})/); if(fr){ r.from = fr[1].trim(); r.to = fr[2].trim(); }
    }
    r.date = dates[0] || ''; r.dateFin = dates.length > 1 && r.kind === 'hotel' ? dates[1] : '';
    r.heure = times[0] || ''; r.heureArr = r.kind !== 'hotel' ? (times[1] || '') : '';
    const co = T.match(/\b(Air France|KLM|Transavia|easyJet|Ryanair|Vueling|Volotea|Lufthansa|ITA Airways|Iberia|TAP|British Airways|Emirates|Qatar Airways|Turkish Airlines|Aegean|Air Malta|Wizz Air|EgyptAir|Royal Air Maroc|SNCF|OUIGO|TGV INOUI|Trenitalia|Italo|Renfe|Eurostar|FlixBus|BlaBlaCar)\b/i);
    if(co) r.compagnie = co[1] + (r.flight ? ' ' + r.flight : ''); else if(r.flight) r.compagnie = r.flight;
    const px = T.match(/(?:total|montant|prix|price|amount|à payer)[^\n\d]{0,25}(\d[\d\s.,]*\d)\s*(?:€|eur)/i) || T.match(/(\d[\d\s.,]*[.,]\d{2})\s*(?:€|eur)\b/i);
    if(px) r.prix = px[1].replace(/\s/g,'').replace(/\.(?=\d{3}\b)/g,'').replace(',', '.');
    return r;
  }

  /* ---------- 🌍 Empreinte carbone et conseils de réservation ---------- */
  // Facteurs d'ordre de grandeur (kg CO2e par passager et par km), inspirés des moyennes ADEME / Base Carbone.
  const CO2F = d => ({Avion: d < 1000 ? 0.23 : d < 3500 ? 0.18 : 0.15, Train: 0.03, Bus: 0.03, Voiture: 0.11, Ferry: 0.12, Bateau: 0.12}); 
  async function tlCo2(){
    const tr = items(i=>i.cat==='transport' && i.from && i.to).sort(sortItems);
    if(!tr.length){ alert('Ajoute des trajets avec un départ et une arrivée.'); return; }
    openSheet(`<h2>🌍 Empreinte et conseils</h2><div id="co2-box" class="cv-route-load">📡 Calcul des distances…</div><div class="v-actions"><button type="button" class="v-btn sec" onclick="CV.close()">Fermer</button></div>`);
    let tot = 0, rows = '', tips = '';

      const a = await geocode(it.from, null).catch(()=>null), b = await geocode(it.to, null).catch(()=>null);
      if(!a || !b){ rows += `<div class="cv-dayi"><b>${icon(it)} ${esc(it.titre)}</b><div class="v-sum-small">ville introuvable</div></div>`; continue; }
      const d = km(a, b) * (it.mode === 'Avion' ? 1.08 : 1.25), mode = it.mode || 'Train', f = (CO2F(d)[mode] != null ? CO2F(d)[mode] : 0.1), kg = d * f; tot += kg;
      rows += `<div class="cv-dayi"><b>${icon(it)} ${esc(it.titre)}</b><div class="v-sum-small">≈ ${Math.round(d).toLocaleString('fr-FR')} km · <b>≈ ${Math.round(kg).toLocaleString('fr-FR')} kg CO2e</b> par personne${mode==='Avion' && d < 800 ? ' · en train ce serait env. ' + Math.round(d*0.03) + ' kg' : ''}</div></div>`;
      if(it.mode === 'Avion' && it.statut === 'todo' && it.date){
        const w = (new Date(it.date) - new Date(isoToday())) / (7*864e5), lg = d > 3500;
        const ideal = lg ? [8, 24] : [4, 12];
        tips += `<div class="cv-dayi"><b>✈️ ${esc(it.titre)}</b> · départ dans ${Math.max(0, Math.round(w))} semaine(s)<div class="v-sum-small">${w > ideal[1] ? `⏳ Un peu tôt : la fenêtre la plus souvent favorable est ${ideal[0]}–${ideal[1]} semaines avant. Mets ce trajet dans le Radar d’Escale pour suivre le prix.` : w >= ideal[0] ? `✅ Bonne période pour réserver (${ideal[0]}–${ideal[1]} semaines avant). Vérifie le prix réel avec ⚡ dans Escale.` : `⚠️ Départ proche : les prix montent souvent. Compare vite dans Escale (« N’importe où » et dates voisines).`}</div></div>`;
      }
    }
    const b = document.getElementById('co2-box'); if(!b) return;
    b.className = ''; b.innerHTML = `<div class="v-sum" style="margin:0 0 8px"><div class="v-sum-big">≈ ${Math.round(tot).toLocaleString('fr-FR')} kg CO2e</div><div class="v-sum-small">par personne pour les trajets du voyage · repère : un aller-retour Paris–New York ≈ 1 t ; un Français émet ≈ 9 t par an</div></div>
      ${rows}${tips ? '<h3 style="margin:14px 0 4px">Quand réserver ?</h3>' + tips : ''}
      <div class="v-sum-small" style="margin-top:8px">Ordres de grandeur (distance à vol d’oiseau corrigée × facteurs moyens type ADEME), pas un calcul certifié. Conseils de réservation = tendances générales, pas une prédiction de prix.</div>`;
  }

  /* ---------- 📍 Je suis ici · 📊 Mes stats ---------- */
  async function countryOf(city){
    M.ctry = M.ctry || {}; const k = normQ(city); if(M.ctry[k]) return M.ctry[k];
    const wait = 1100 - (Date.now() - geoLast); if(wait > 0) await new Promise(r=>setTimeout(r, wait)); geoLast = Date.now();
    try { const j = await (await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&addressdetails=1&accept-language=fr&q=' + encodeURIComponent(city))).json();
      const a = j && j[0] && j[0].address; if(a && a.country){ M.ctry[k] = {pays:a.country, cc:(a.country_code||'').toUpperCase()}; persist(); return M.ctry[k]; } } catch(e){}
    return null;
  }
  const flag = cc => cc && cc.length === 2 ? String.fromCodePoint(...[...cc].map(c=>127397 + c.charCodeAt(0))) : '🌍';
  const frCountry = (cc, fb) => { try { return new Intl.DisplayNames(['fr'], {type:'region'}).of(cc) || fb || cc; } catch(e){ return fb || cc; } };
  async function tlStats(){
    openSheet(`<h2>📊 Mes stats de voyage</h2><div id="stt" class="cv-route-load">📡 Je compte…</div><div class="v-actions"><button type="button" class="v-btn sec" onclick="CV.close()">Fermer</button></div>`);
    const ts = trips(), now = isoToday(); let nights = 0, kmTot = 0, nSteps = 0; const countries = {}, cities = new Set();
    for(const t of ts){
      if(t.debut) nights += Math.max(0, nights_(t.debut, t.fin || t.debut));
      const hs = list('item', i=>i.trip===t.id && i.cat==='hotel' && i.date && !i.deleted).sort((a,b)=>a.date.localeCompare(b.date));
      let prev = null;
      for(const h of hs){ const c = cityOf(h.titre); if(!c) continue; cities.add(normQ(c));
        const g = geoCached(c) || await geocode(c, null).catch(()=>null); if(g && prev) kmTot += km(prev, g); if(g) prev = g;
        if(t.debut && t.debut <= now){ const co = await countryOf(c); const cc = co && (co.cc || ccOf(co.pays)); if(cc) countries[cc] = {cc, pays:frCountry(cc, co.pays)}; } }
      geoSouvs(t.id).forEach(s=>{ nSteps++; const cc = s.cc || ccOf(s.pays); if(cc) countries[cc] = {cc, pays:frCountry(cc, s.pays)}; });
    }
    const el = document.getElementById('stt'); if(!el) return;
    const cs = Object.values(countries);
    el.className = ''; el.innerHTML = `<div class="cv-stats"><div><b>${ts.length}</b><span>voyage${ts.length>1?'s':''}</span></div><div><b>${nights}</b><span>nuits</span></div><div><b>${Math.round(kmTot).toLocaleString('fr-FR')}</b><span>km entre étapes</span></div><div><b>${cities.size}</b><span>villes</span></div><div><b>${cs.length}</b><span>pays visités</span></div><div><b>${nSteps}</b><span>steps 📍</span></div></div>
      <div class="cv-flags">${cs.map(c=>`<span>${flag(c.cc)} ${esc(c.pays)}</span>`).join('') || '<span class="v-sum-small">Les pays apparaissent une fois les voyages commencés (ou avec « 📍 Je suis ici »).</span>'}</div>
      <div class="v-sum-small" style="margin-top:8px">Pays comptés pour les voyages commencés, d’après les villes des hébergements et tes « Je suis ici ». Distances à vol d’oiseau entre étapes.</div>`;
  }
  const nights_ = (a, b) => Math.round((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 864e5);

  /* ---------- 🗺️ Export KML (Google My Maps, Organic Maps hors ligne, Google Earth…) ---------- */
  function kmlEsc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  async function tlKml(){
    const t = trip(); if(!t) return;
    toast('🗺️ Préparation de l’export…');
    const pm = [], st = tlStages(), line = [];
    for(const s of st){ const g = geoCached(s.city) || await geocode(s.city, null).catch(()=>null); if(g){ line.push(g); pm.push(`<Placemark><name>${kmlEsc('🏨 ' + s.city)}</name><description>${kmlEsc(fshort(s.debut) + ' → ' + fshort(s.fin) + (s.h && s.h.nom ? ' · ' + s.h.nom : ''))}</description><styleUrl>#etape</styleUrl><Point><coordinates>${g.lng},${g.lat}</coordinates></Point></Placemark>`); } }
    if(line.length > 1) pm.push(`<Placemark><name>Itinéraire du voyage</name><styleUrl>#trace</styleUrl><LineString><tessellate>1</tessellate><coordinates>${line.map(g=>g.lng+','+g.lat).join(' ')}</coordinates></LineString></Placemark>`);
    dayList().forEach((d,i)=>{ const pl = placesOf(d).filter(p=>p.lat != null), r = dayInfo(d).route;
      pl.forEach((p,k)=>pm.push(`<Placemark><name>${kmlEsc('J' + (i+1) + '.' + (k+1) + ' ' + p.nom)}</name><styleUrl>#lieu</styleUrl><Point><coordinates>${p.lng},${p.lat}</coordinates></Point></Placemark>`));
      if(r && r.geom && r.geom.length > 1) pm.push(`<Placemark><name>${kmlEsc('J' + (i+1) + ' · à pied')}</name><styleUrl>#pied</styleUrl><LineString><coordinates>${r.geom.map(p=>p[1]+','+p[0]).join(' ')}</coordinates></LineString></Placemark>`); });
    geoSouvs(M.trip).forEach(s=>pm.push(`<Placemark><name>${kmlEsc('📍 ' + (s.lieu || 'Je suis ici') + ' · ' + fshort(s.date))}</name><description>${kmlEsc(s.note||'')}</description><styleUrl>#ici</styleUrl><Point><coordinates>${s.lng},${s.lat}</coordinates></Point></Placemark>`));
    if(!pm.length){ alert('Rien à exporter : ajoute des hébergements avec leur ville ou des lieux à voir.'); return; }
    const kml = `<?xml version="1.0" encoding="UTF-8"?><kml xmlns="http://www.opengis.net/kml/2.2"><Document><name>${kmlEsc(t.titre)}</name>
<Style id="etape"><IconStyle><color>ffed3a7c</color></IconStyle></Style><Style id="lieu"><IconStyle><color>ff2626dc</color></IconStyle></Style><Style id="ici"><IconStyle><color>ff4ac716</color></IconStyle></Style>
<Style id="trace"><LineStyle><color>ffed3a7c</color><width>4</width></LineStyle></Style><Style id="pied"><LineStyle><color>ffe5464f</color><width>3</width></LineStyle></Style>
${pm.join('\n')}</Document></kml>`;
    tlShareFile(new Blob([kml], {type:'application/vnd.google-earth.kml+xml'}), pdfName('itineraire', t).replace(/\.pdf$/,'.kml'), 'Itinéraire ' + t.titre);
  }

  /* ---------- 🪄 Remplir mes journées (lieux les plus connus, répartis sur les jours libres) ---------- */
  async function placesFor(city){
    const key = normQ(city); M.poiCache = M.poiCache || {};
    const hit = M.poiCache[key]; if(hit && Date.now() - hit.t < DISC_TTL && hit.list.length) return hit.list;
    const c = await withTimeout(geocode(city, null), 10000).catch(()=>null); if(!c) return [];
    const res = await Promise.allSettled([seeWiki(c), seeApi(c), seeOverpass(c)].map(p=>withTimeout(p, 20000)));
    const seen = new Set(), all = res.filter(r=>r.status==='fulfilled').flatMap(r=>r.value||[]);
    const list_ = all.filter(p=>p.nom && p.lat != null && !/^\d+$/.test(p.nom)).sort((x,y)=>y.score-x.score).filter(p=>{ const k = normQ(p.nom); if(seen.has(k)) return false; seen.add(k); return true; }).slice(0,150);
    if(list_.length){ M.poiCache[key] = {t:Date.now(), list:list_}; persist(); }
    return list_;
  }
  function tlFill(){
    const st = items(i=>i.cat==='hotel' && i.date).sort((a,b)=>a.date.localeCompare(b.date));
    if(!st.length){ alert('Ajoute d’abord les hébergements (une ville par étape).'); return; }
    openSheet(`<h2>🪄 Remplir mes journées</h2><div class="v-sum-small" style="margin-bottom:8px">Pour chaque étape, l’appli choisit les lieux les plus connus (Wikipédia, OpenStreetMap) et les répartit sur les jours, sans toucher à ce que tu as déjà prévu. Tu ajustes ensuite dans « Organiser l’étape ».</div>
      <div class="v-f"><label>Lieux par jour</label><select class="v-in" id="fl-n"><option value="2">2 (tranquille)</option><option value="3" selected>3 (équilibré)</option><option value="4">4 (intense)</option></select></div>
      <label class="cv-checkline"><input type="checkbox" id="fl-mus"> Inclure les musées</label>
      <div id="fl-msg" class="v-sum-small" style="margin:6px 0"></div>
      <div class="v-actions"><button type="button" class="v-btn" onclick="CV.tlFillGo()">🪄 Remplir</button><button type="button" class="v-btn sec cv-sq" onclick="CV.close()">✕</button></div>`);
  }
  async function tlFillGo(){
    const per = +document.getElementById('fl-n').value, mus = document.getElementById('fl-mus').checked, msg = m => { const e = document.getElementById('fl-msg'); if(e) e.textContent = m; };
    const st = items(i=>i.cat==='hotel' && i.date).sort((a,b)=>a.date.localeCompare(b.date));
    let added = 0; const out = [];
    for(const h of st){
      const city = cityOf(h.titre); if(!city) continue; msg('📡 ' + city + '…');
      const days = stayDays(h).slice(0, h.dateFin ? -1 : undefined);
      const have = placesOfStay(h.id), names = new Set(have.map(p=>normQ(p.nom)));
      const free = days.filter(d=>placesOf(d).length === 0 && !(dayInfo(d).plan||'').trim()).slice(0, 12);
      if(!free.length) continue;
      const cand = (await placesFor(city)).filter(p=>!names.has(normQ(p.nom)) && (mus || p.cat !== 'musee'));
      let k = 0; free.forEach(d=>{ for(let j=0;j<per && k<cand.length;j++,k++){ const p = cand[k]; out.push({id:'pl'+uid()+k+j, type:'place', trip:M.trip, stay:h.id, date:d, nom:p.nom, adresse:'', lat:p.lat, lng:p.lng, cat:p.cat, lock:false}); added++; } });
    }
    if(!out.length){ msg('Rien à ajouter : tes journées sont déjà remplies, ou aucun lieu trouvé.'); return; }
    putMany(out, '🪄 ' + added + ' lieu(x) ajouté(s)'); closeSheet(true); M.tab = 'prog'; refresh();
    setTimeout(()=>alert(`🪄 ${added} lieux répartis sur tes journées libres.\nPour chaque jour : « Itinéraire » optimise l’ordre de visite et trace le parcours à pied.`), 300);
  }

  function quickBar(){

  /* ---------- 📍 Step géolocalisé = souvenir avec position (photos + récit) ---------- */
  async function hereNow(){
    if(!navigator.geolocation){ alert('Localisation indisponible sur ce téléphone.'); return; }
    toast('📍 Localisation…');
    navigator.geolocation.getCurrentPosition(async pos => {
      const lat = +pos.coords.latitude.toFixed(5), lng = +pos.coords.longitude.toFixed(5);
      let lieu = '', pays = '', cc = '';
      try { const j = await (await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=10&accept-language=fr&lat=${lat}&lon=${lng}`)).json();
        const a = (j && j.address) || {}; lieu = a.city || a.town || a.village || a.municipality || a.county || ''; pays = a.country || ''; cc = (a.country_code || '').toUpperCase(); } catch(e){}
      editSouv(null);
      Object.assign(editing, {lat, lng, pays, cc, step:1});
      const f = document.getElementById('v-form'); if(f){ if(f.titre) f.titre.value = lieu || 'Step'; if(f.lieu) f.lieu.value = [lieu, pays].filter(Boolean).join(', '); }
      const h2 = document.querySelector('.v-sheet h2'); if(h2) h2.insertAdjacentHTML('afterend', `<div class="cv-here">${flag(cc)} <b>${esc(lieu || 'Position enregistrée')}</b>${pays ? ', ' + esc(pays) : ''} · ${new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}<small>Ajoute des photos et un petit récit, comme un step Polarsteps. Il apparaît sur la carte du monde et dans le journal.</small></div>`);
    }, err => alert('Position introuvable (' + (err && err.message || 'refusée') + '). Autorise la localisation pour l’appli dans les réglages du téléphone.'), {enableHighAccuracy:true, timeout:15000, maximumAge:60000});
  }
  const geoSouvs = (tripId) => [...list('souv', s=>s.lat != null && (!tripId || s.trip===tripId)), ...list('step', s=>s.lat != null && (!tripId || s.trip===tripId))];

  /* ---------- 📄 Importer une réservation : PDF, capture d'écran, photo ou texte ---------- */
  function impSheet(){
    openSheet(`<h2>📄 Importer une réservation</h2>
      <div class="v-sum-small" style="margin-bottom:10px">Le PDF de Booking, d’une compagnie aérienne, de la SNCF… ou une capture d’écran de l’e-mail : l’appli lit le document <b>sur ton téléphone</b>, crée la fiche et y joint le document comme billet.</div>
      <button type="button" class="v-btn" onclick="CV.impPick()">📄 Choisir un PDF, une capture ou une photo</button>
      <div class="v-sum-small" style="margin-top:10px"><b>Depuis Mail sur iPhone :</b> touche la pièce jointe PDF → Partager → <i>Enregistrer dans Fichiers</i>, puis choisis-la ici.<br><b>Sur Android :</b> depuis Gmail ou Booking, Partager → <i>Carnet de voyage</i> (appli installée) : l’import démarre tout seul.</div>
      <div id="imp-msg" class="v-sum-small" style="margin-top:8px"></div>
      <div class="v-actions"><button type="button" class="v-btn sec" onclick="CV.close()">Fermer</button></div>`);
  }
  const impSay = m => { const e = document.getElementById('imp-msg'); if(e) e.textContent = m; else toast(m); };
  function impPick(){ tlPickFile('application/pdf,image/*,.pdf', f => impFile(f)); }
  async function pdfText(file){
    const lib = await import(new URL('vendor/pdf.min.mjs', location.href).href);
    lib.GlobalWorkerOptions.workerSrc = new URL('vendor/pdf.worker.min.mjs', location.href).href;
    const doc = await lib.getDocument({data: new Uint8Array(await file.arrayBuffer())}).promise;
    let out = '';
    for(let p=1; p<=Math.min(doc.numPages, 6); p++){
      const tc = await (await doc.getPage(p)).getTextContent(); let lastY = null, line = '';
      for(const it of tc.items){ const y = Math.round(it.transform[5]); if(lastY !== null && Math.abs(y - lastY) > 2){ out += line.trim() + '\n'; line = ''; } line += it.str + (it.hasEOL ? '\n' : ' '); lastY = y; }
      out += line.trim() + '\n';
    }
    return out;
  }
  async function ocrText(file){
    if(!window.Tesseract) await new Promise((res, rej)=>{ const s = document.createElement('script'); s.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js'; s.onload = res; s.onerror = ()=>rej(new Error('outil de lecture indisponible (réseau ?)')); document.head.appendChild(s); });
    const small = await shrink(file, 2000, 0.9); const {data} = await Tesseract.recognize(small, 'fra+eng'); return (data && data.text) || '';
  }
  async function impFile(file, extraText){
    const isPdf = /pdf/i.test(file.type) || /\.pdf$/i.test(file.name||'');
    try {
      impSay(isPdf ? '📄 Lecture du PDF…' : '🔍 Lecture de l’image… (la 1re fois l’outil se télécharge, ~15 s)');
      const txt = (isPdf ? await pdfText(file) : await ocrText(file)) + (extraText ? '\n' + extraText : '');
      if(txt.replace(/\s/g,'').length < 30) throw new Error(isPdf ? 'ce PDF ne contient pas de texte lisible (c’est peut-être une image) : essaie une capture d’écran' : 'aucun texte reconnu');
      const id = 'pj' + uid();
      if(isPdf) await IDB.put({id, blob:file, up:1}); else { await storePhoto(file, id); uploadQueue(); }
      closeSheet(true);
      cfImport(txt, [{id, t: isPdf ? 'pdf' : 'img', n: (file.name || (isPdf ? 'reservation' : 'capture')).replace(/\.[a-z0-9]+$/i,'').slice(0,40)}]);
    } catch(e){ impSay('⚠️ ' + e.message); }
  }
  // Prétraitement commun (espaces, heures « 14 : 00 », montants « 144 , 30 »)
  const cfPre = T => String(T||'').replace(/\u00a0|\u202f/g,' ').replace(/[ \t]+/g,' ').replace(/(\d)\s*:\s*(\d{2})\b/g,'$1:$2').replace(/(\d)\s+([.,])\s*(\d)/g,'$1$2$3');
  function yearFor(T, mo, d){
    const today = new Date(isoToday() + 'T12:00:00'), ys = [...T.matchAll(/\b(20\d{2})\b/g)].map(m=>+m[1]).filter(y=>y >= today.getFullYear());
    let y = ys.length ? Math.min(...ys) : today.getFullYear();
    if(new Date(y, mo-1, d) < today && !ys.length) y++;
    return `${y}-${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  }
  function bookingParse(T){
    const L = T.split('\n').map(l=>l.trim()).filter(Boolean), r = {kind:'hotel'};
    const ref = T.match(/NUM[ÉE]RO DE CONFIRMATION\s*:\s*([\d.\s]{6,24})/i); if(ref) r.ref = ref[1].replace(/\D/g,'');
    const pin = T.match(/CODE (?:CONFIDENTIEL|PIN)\s*:\s*(\d{3,8})/i);
    const ia = L.findIndex(l=>/^Adresse\s*:/i.test(l)); if(ia > 0) r.nom = L[ia-1];
    if(ia >= 0){ const it = L.findIndex((l,i)=>i>ia && /^T[ée]l[ée]phone/i.test(l)); r.adresse = L.slice(ia, it > ia ? it : ia+4).join(' ').replace(/^Adresse\s*:\s*/i,'').replace(/\s+/g,' ').replace(/(\p{L}) ([^\x00-\x7F]) (\p{L})/gu,'$1$2$3').replace(/(^|\s)([^\x00-\x7F]) (\p{Ll})/gu,'$1$2$3').replace(/\s*:\s*/g,':').replace(/NO:/g,'No ').trim(); }
    const tel = T.match(/T[ée]l[ée]phone\s*:\s*(\+?[\d][\d\s().-]{6,20}\d)/i); if(tel) r.tel = tel[1].trim();
    const gps = T.match(/N\s*0*(\d{1,2})°\s*([\d.]+)\s*,?\s*([EW])\s*0*(\d{1,3})°\s*([\d.]+)/);
    if(gps){ r.lat = +(+gps[1] + +gps[2]/60).toFixed(5); r.lng = +((+gps[4] + +gps[5]/60) * (gps[3]==='W' ? -1 : 1)).toFixed(5); }
    const n = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
    const blk = lab => { const i = L.findIndex(l=>n(l).startsWith(lab)); if(i < 0) return null; const sl = L.slice(i+1, i+7).join(' ');
      const m = sl.match(/(\d{1,2})\s+([A-Za-zÀ-ÿ]+)/); const tm = [...sl.matchAll(/(\d{1,2}:\d{2})/g)].map(x=>x[1]);
      return m && MOIS_FR[n(m[2]).replace(/\./g,'')] ? {d: yearFor(T, MOIS_FR[n(m[2])], +m[1]), t: tm} : null; };
    const a = blk('arrivee'), d = blk('depart');
    if(a){ r.date = a.d; r.heure = a.t[0] || ''; } if(d) r.dateFin = d.d;
    const am = [...T.matchAll(/€ ?(\d[\d .]*(?:,\d{1,2})?)|(\d[\d .]*,\d{2}) ?€/g)].map(m=>parseFloat((m[1]||m[2]).replace(/\s|\.(?=\d{3})/g,'').replace(',', '.'))).filter(x=>!isNaN(x));
    if(am.length) r.prix = String(Math.max(...am));
    if(r.adresse){ const parts = r.adresse.split(','); if(parts.length >= 2) r.ville = parts[parts.length-2].replace(/\b\d{3,}\b/g,'').trim(); }
    r.note = 'Booking.com' + (pin ? ' · code confidentiel ' + pin[1] : '');
    return r;
  }
  function cfDraft(raw){
    const T = cfPre(raw);
    const r = (/NUM[ÉE]RO DE CONFIRMATION/i.test(T) && /ARRIV[ÉE]E/i.test(T)) ? bookingParse(T) : cfParse(T);
    if(r.kind === 'hotel') return {cat:'hotel', type:'item', trip:M.trip, titre: r.ville || cityOf(r.adresse ? r.adresse.split(',').slice(-2,-1)[0] || '' : '').replace(/\b\d{3,}\b/g,'').trim() || 'Hébergement',
      nom:r.nom||'', adresse:r.adresse||'', tel:r.tel||'', date:r.date||'', dateFin:r.dateFin||'', heure:r.heure||'', ref:r.ref||'', prix:r.prix||'', partage:'grp', statut:'booked', lat:r.lat, lng:r.lng, note:r.note || 'Créée depuis un document importé'};
    if(r.kind === 'autre') return {cat:'activite', type:'item', trip:M.trip, titre:'Réservation', date:r.date||'', heure:r.heure||'', ref:r.ref||'', prix:r.prix||'', statut:'booked', note:'Créée depuis un document importé'};
    return {cat:'transport', type:'item', trip:M.trip, mode: r.kind==='vol' ? 'Avion' : r.kind==='bus' ? 'Bus' : 'Train', from:r.from||'', to:r.to||'', titre:(r.from && r.to) ? r.from + ' → ' + r.to : (r.kind==='vol' ? 'Vol' : 'Trajet'),
      date:r.date||'', heureDep:r.heure||'', heureArr:r.heureArr||'', compagnie:r.compagnie||'', ref:r.ref||'', prix:r.prix||'', statut: r.prix ? 'paid' : 'booked', note:'Créée depuis un document importé'};
  }
  // Partage Android (« Partager → Carnet de voyage ») : le service worker a rangé le fichier ou le texte
  async function shareInbox(){
    if(!/[?&]partage=1/.test(location.search)) return;
    history.replaceState(null, '', location.pathname);
    try {
      const c = await caches.open('share-inbox'), keys = await c.keys(); let file = null, text = '';
      for(const k of keys){ const res = await c.match(k); if(/\/share\/file/.test(k.url)){ const b = await res.blob(); file = new File([b], decodeURIComponent((k.url.split('name=')[1]||'document')), {type:b.type}); } else if(/\/share\/text/.test(k.url)) text = await res.text(); await c.delete(k); }
      if(!trip()){ alert('Crée ou ouvre d’abord un voyage, puis partage à nouveau la réservation.'); return; }
      if(file) impFile(file, text); else if(text) cfImport(text);
    } catch(e){}
  }

  /* ---------- 📖 Journal : choisir les photos ---------- */
  function jrSheet(){
