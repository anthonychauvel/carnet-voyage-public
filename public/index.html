    voyage: {lbl:'Prochain voyage',   icon:'🌍'},
    etape:  {lbl:'Pour un voyage prévu', icon:'📍'},
    idee:   {lbl:'Idée en vrac',      icon:'💡'},
  };

  function defaults(){ return {items:[], days:{}, checklist:[], objectif:''}; }

  /* ══════════ Stockage ══════════ */
  let R = {};   // toutes les fiches, par id
  let M = {};   // réglages propres à ce téléphone
  function baseMeta(){ return {me:null, trip:null, tab:'prog', who:'all', filt:{}, envF:'all', envP:'all', dirty:[],
    sync:{url:'', code:'', on:false, since:0, last:0, err:''}}; }
  function loadStore(){
    try { const raw = localStorage.getItem(KEY); if(raw){ const o = JSON.parse(raw); R = o.records || {}; M = o.meta || {}; } } catch(e){ R = {}; M = {}; }
    M = Object.assign(baseMeta(), M);
    M.sync = Object.assign(baseMeta().sync, M.sync || {});
    if(!Array.isArray(M.dirty)) M.dirty = [];
  }
  function persist(){
    try { localStorage.setItem(KEY, JSON.stringify({records:R, meta:M})); }
    catch(e){ alert('Sauvegarde impossible (stockage plein ou bloqué). Exporte tes données.'); }
  }
  let toastT;
  function toast(msg){
    if(msg === false) return;
    const t = document.getElementById('cv-toast'); if(!t) return;
    t.textContent = msg || '💾 Enregistré'; t.classList.add('show');
    clearTimeout(toastT); toastT = setTimeout(()=>t.classList.remove('show'), 1400);
  }

  /* ── Lecture ── */
  function list(type, f){ return Object.values(R).filter(r => r.type===type && !r.deleted && (!f || f(r))); }
  const prof = id => (R[id] && R[id].type==='profile' && !R[id].deleted) ? R[id] : null;
  const pname = id => { const p = prof(id); return p ? p.nom : (R[id] ? R[id].nom || '?' : '?'); };
  const pcol = id => { const p = prof(id) || R[id]; return p && p.couleur ? p.couleur : '#999'; };
  const profiles = () => list('profile').sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
  const trips = () => list('trip').sort((a,b)=>(a.debut||'9999').localeCompare(b.debut||'9999'));
  function trip(){ const t = R[M.trip]; return t && t.type==='trip' && !t.deleted ? t : null; }
  function tv(){ const t = trip(); const v = (t && t.voyageurs || []).filter(prof); return v.length ? v : (M.me ? [M.me] : []); }
  const items = f => list('item', r => r.trip===M.trip && (!f || f(r)));

  /* ── Écriture : chaque fiche garde qui l'a créée / modifiée ── */
  function stamp(r){
    const n = Date.now();
    if(!r.createdAt || r.createdAt < 1000){ r.createdAt = n; r.createdBy = M.me; }
    r.updatedAt = Math.max(n, (r.updatedAt||0) + 1);
    r.updatedBy = M.me;
  }
  /* Partage voyage par voyage : M.tripSpace = {idVoyage: code} (gardé sur ce téléphone seulement),
     M.spaces = [{code, since, dirty, last, err}]. Un voyage sans code propre suit le carnet principal (M.sync). */
  const TS = () => M.tripSpace || (M.tripSpace = {});
  const spaceObj = code => (M.spaces || (M.spaces = [])).find(x=>x.code===code);
  function targets(r){
    if(!r) return ['main'];
    const sp = id => { const c = TS()[id]; return c && spaceObj(c) ? c : null; };
    if(r.type==='trip') return [sp(r.id) || 'main'];
    if(r.trip) return [sp(r.trip) || 'main'];
    if(r.type==='profile'){ const out = new Set(['main']); Object.entries(TS()).forEach(([tid, c])=>{ const t = R[tid]; if(t && spaceObj(c) && (t.voyageurs||[]).includes(r.id)) out.add(c); }); return [...out]; }
    return ['main'];
  }
  function markDirty(id){
    const r = R[id]; if(r && r.demo) return;
    targets(r).forEach(t=>{ const L = t==='main' ? M.dirty : spaceObj(t).dirty || (spaceObj(t).dirty = []); if(!L.includes(id)) L.push(id);
      // un voyage partagé emporte les profils de ses voyageurs
      if(t !== 'main' && r && r.type==='trip') (r.voyageurs||[]).forEach(pid=>{ if(R[pid] && !L.includes(pid)) L.push(pid); }); });
  }
  const isDirty = id => M.dirty.includes(id) || (M.spaces||[]).some(x=>(x.dirty||[]).includes(id));
  function put(r, msg){ stamp(r); R[r.id] = r; markDirty(r.id); persist(); toast(msg); queueSync(); return r; }
  function putMany(arr, msg){ arr.forEach(r=>{ stamp(r); R[r.id] = r; markDirty(r.id); }); persist(); toast(msg); queueSync(); }
  function drop(id, msg){ const r = R[id]; if(!r) return; r.deleted = true; put(r, msg || '🗑 Supprimé'); }
  const clone = o => JSON.parse(JSON.stringify(o));

  /* ── Affichage des personnes ── */
  const ini = id => `<span class="cv-ini" style="background:${pcol(id)}" title="${esc(pname(id))}">${esc((pname(id)[0]||'?').toUpperCase())}</span>`;
  const pchip = (id, extra) => `<span class="cv-pchip" style="--pc:${pcol(id)}">${esc(pname(id))}${extra||''}</span>`;
  const pname_c = id => `<b style="color:${pcol(id)}">${esc(pname(id))}</b>`;
  function when(ts){
    const d = new Date(ts), n = new Date(), s = (n - d)/1000;
    const hm = d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
    if(s < 60) return 'à l’instant';
    if(s < 3600) return 'il y a ' + Math.floor(s/60) + ' min';
    if(d.toDateString() === n.toDateString()) return 'aujourd’hui ' + hm;
    return d.toLocaleDateString('fr-FR',{day:'numeric',month:'short'}) + ' ' + hm;
  }
  function byline(r){
    if(!r || !r.updatedBy || (r.updatedAt||0) < 1000) return '';
    if(r.imported && Math.abs((r.updatedAt||0) - (r.createdAt||0)) < 5000) return '';
    const created = r.createdBy && r.createdAt > 1000;
    let h = '';
    if(created && r.createdBy !== r.updatedBy) h = `ajouté par ${pname_c(r.createdBy)} · modifié par ${pname_c(r.updatedBy)}`;
    else if(created && Math.abs(r.updatedAt - r.createdAt) < 2000) h = `ajouté par ${pname_c(r.updatedBy)}`;
    else h = `modifié par ${pname_c(r.updatedBy)}`;
    return `<div class="cv-by">✎ ${h} · ${when(r.updatedAt)}</div>`;
  }

  /* ── Dates ── */
  const JOURS = ['dim.','lun.','mar.','mer.','jeu.','ven.','sam.'];
  function fdate(iso){
    if(!iso) return '';
    const p = iso.split('-'); if(p.length!==3) return iso;
    const dt = new Date(+p[0], +p[1]-1, +p[2]);
    return JOURS[dt.getDay()] + ' ' + (+p[2]) + '/' + p[1];
  }
  function fshort(iso){ if(!iso) return ''; const p = iso.split('-'); return (+p[2]) + '/' + p[1]; }
  function nights(a,b){ if(!a||!b) return 0; const n = Math.round((new Date(b) - new Date(a))/86400000); return n>0 ? n : 0; }
  function range(a,b){
    const out = []; if(!a || !b || b < a) return out;
    const d = new Date(a + 'T12:00:00'), end = new Date(b + 'T12:00:00');
    while(d <= end && out.length < 90){ out.push(d.toISOString().slice(0,10)); d.setDate(d.getDate()+1); }
    return out;
  }
  function tripDates(t){
    if(!t || !t.debut) return '';
    const y = t.debut.slice(0,4);
    return t.fin ? `${fshort(t.debut)} → ${fshort(t.fin)}/${y}` : `${fshort(t.debut)}/${y}`;
  }

  /* ── Prix & partage ── */
  const hasPrix = it => String(it.prix ?? '').trim() !== '';
  const base = it => hasPrix(it) ? num(it.prix) : num(it.estime);
  const partage = it => it.partage || ((it.cat==='hotel' || /^Guide \+ chauffeur/.test(it.titre||'')) ? 'grp' : 'pp');
  function parts(it){ const all = tv(); const q = (it.qui||[]).filter(id => all.includes(id)); return q.length ? q : all; }
  const subset = it => parts(it).length < tv().length;
  function amount(it, kind){ return kind==='reel' ? num(it.prix) : kind==='est' ? num(it.estime) : base(it); }
  function totalOf(it, kind){ const b = amount(it, kind); return partage(it)==='pp' ? b * parts(it).length : b; }
  /* Qui prend en charge le coût : égal (défaut), une seule personne, ou montants/proportions perso */
  const chargeOf = it => (it.charge && it.charge.mode) ? it.charge : {mode:'egal'};
  const sumv = o => Object.values(o).reduce((a,b)=>a+b,0);
  function weights(pool, mode, one, map, coef){
    if(mode==='seul' && pool.includes(one)) return Object.fromEntries(pool.map(x=>[x, x===one?1:0]));
    if(mode==='perso'){ const w = Object.fromEntries(pool.map(x=>[x, Math.max(0, num((map||{})[x]))])); if(sumv(w) > 0) return w; }
    return Object.fromEntries(pool.map(x=>[x, coef ? tCoef(x) : 1]));   // parts du voyage (enfant 0,5…) pour les dépenses partagées
  }
  function shareOf(it, pid, kind){
    const c = chargeOf(it);
    if(c.mode === 'perso'){   // montants exacts en € ; le reste éventuel est partagé entre ceux sans montant
      const pool = parts(it), T0 = totalOf(it), T = totalOf(it, kind), ratio = T0 ? T / T0 : 1;
      const given = Object.fromEntries(Object.entries(c.parts||{}).filter(([k])=>pool.includes(k)).map(([k,v])=>[k, num(v)]));
      const rest = pool.filter(x=>!(x in given)), left = T0 - sumv(given);
      if(pid in given) return (given[pid] + (rest.length ? 0 : left / pool.length)) * ratio;
      return rest.includes(pid) ? Math.max(0, left) / rest.length * ratio : 0;
    }
    const w = weights(parts(it), c.mode === 'parts' ? 'perso' : c.mode, c.pid, c.parts, partage(it)!=='pp'), sw = sumv(w);
    return (sw && pid in w) ? totalOf(it, kind) * w[pid] / sw : 0;
  }
  /* Ce qui est déjà réglé : tout si « Payé », sinon les échéances cochées */
  function paidAmount(it){
    const T = totalOf(it); if(it.statut==='paid') return T;
    return Math.min(T, (it.echeances||[]).filter(e=>e.fait).reduce((s,e)=>s+num(e.montant),0));
  }
  const shareOfPaid = (it, pid) => { const T = totalOf(it); return T ? shareOf(it, pid) * paidAmount(it) / T : 0; };
  /* Qui a sorti l'argent : chacun sa part (défaut), une personne, ou montants perso */
  function advancedBy(it, pid){
    const P = paidAmount(it); if(!P) return 0;
    const py = it.payeur || 'chacun';
    if(py==='chacun') return shareOfPaid(it, pid);
    if(py==='perso'){ const w = weights(tv(), 'perso', null, it.payes), sw = sumv(w); return sw && pid in w ? P * w[pid] / sw : 0; }
    return pid===py ? P : 0;
  }
  function balances(){
    const all = items();
    const rb = rembs();
    return tv().map(pid => {
      const avance = all.reduce((s,i)=>s+advancedBy(i,pid),0), part = all.reduce((s,i)=>s+shareOfPaid(i,pid),0);
      const verse = rb.filter(x=>x.de===pid).reduce((s,x)=>s+num(x.montant),0), recu = rb.filter(x=>x.a===pid).reduce((s,x)=>s+num(x.montant),0);
      return {pid, avance, part, verse, recu, solde: avance - part + verse - recu};
    });
  }
  const rembs = () => list('remb', x=>x.trip===M.trip).sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  function rembAdd(de, a, v){
    const t = prompt(`Montant remboursé par ${pname(de)} à ${pname(a)} (€) :`, String(Math.round(v*100)/100).replace('.',','));
    if(t === null) return;
    const m = num(t); if(!(m > 0)){ alert('Montant invalide.'); return; }
    put({id:'rb'+uid(), type:'remb', trip:M.trip, de, a, montant:m, date:new Date().toISOString().slice(0,10)}, '💸 Remboursement noté');
    render();
  }
  function rembDel(id){ const x = R[id]; if(!x || !confirm(`Supprimer ce remboursement de ${eur(num(x.montant))} ?`)) return; drop(id); render(); }
  function settle(bal){
    const cr = bal.filter(b=>b.solde > 0.5).map(b=>({pid:b.pid, v:b.solde})).sort((a,b)=>b.v-a.v);
    const db = bal.filter(b=>b.solde < -0.5).map(b=>({pid:b.pid, v:-b.solde})).sort((a,b)=>b.v-a.v);
    const out = [];
    while(cr.length && db.length){
      const m = Math.min(cr[0].v, db[0].v); out.push({de:db[0].pid, a:cr[0].pid, v:m});
      cr[0].v -= m; db[0].v -= m; if(cr[0].v < 0.5) cr.shift(); if(db[0].v < 0.5) db.shift();
    }
    return out;
  }
  const forWho = it => M.who==='all' || parts(it).includes(M.who);

  function icon(it){ return it.cat==='transport' ? (MODE_ICON[it.mode]||'✈️') : (CATS[it.cat]||{icon:'•'}).icon; }
  function sortItems(a,b){
    const da = a.date||'9999', db = b.date||'9999';
    if(da!==db) return da<db?-1:1;
    return (a.heureDep||a.heure||'').localeCompare(b.heureDep||b.heure||'');
  }

  /* ══════════ Synchronisation ══════════ */
  let syncing = false, again = false, syncT = null;
  function apiUrl(){
    let u = (M.sync.url || '').trim();
    if(!u && /^https?:/.test(location.protocol)) u = location.origin;
    return u ? u.replace(/\/+$/,'') + '/api/sync' : '';
  }
  function queueSync(){ if(!M.sync.on && !(M.spaces||[]).length) return; syncDot(); clearTimeout(syncT); syncT = setTimeout(()=>syncNow(), 1200); }
  /* ── Chiffrement de bout en bout (version publique) ──
     Le code du carnet ne quitte jamais le téléphone : le serveur reçoit seulement une empreinte
     (pour ranger les données) et des fiches/photos chiffrées en AES-256-GCM avec une clé tirée du code. */
  const E2E = PUBLIC;
  const te = new TextEncoder(), td = new TextDecoder();
  const hex = buf => [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
  const b64 = u8 => { let s = ''; for(let i=0;i<u8.length;i+=0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i+0x8000)); return btoa(s); };
  const unb64 = s => Uint8Array.from(atob(s), ch=>ch.charCodeAt(0));
  let ck = {};
  async function keys(code){
    code = code || M.sync.code;
    if(ck[code]) return ck[code];
    const base = await crypto.subtle.importKey('raw', te.encode(code), 'PBKDF2', false, ['deriveKey','deriveBits']);
    const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:te.encode('carnet-voyage/e2e/v1'), iterations:200000, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
    const hb = await crypto.subtle.deriveBits({name:'PBKDF2', salt:te.encode('carnet-voyage/ids/v1'), iterations:200000, hash:'SHA-256'}, base, 256);
    const hkey = await crypto.subtle.importKey('raw', hb, {name:'HMAC', hash:'SHA-256'}, false, ['sign']);
    const token = hex(await crypto.subtle.digest('SHA-256', te.encode('carnet-voyage/space/v1:' + code)));
    return ck[code] = {code, key, hkey, token};
  }
  async function authCode(code){ code = code || M.sync.code; return E2E ? (await keys(code)).token : code; }
  async function sid(id, code){ if(!E2E) return id; return 'x' + hex(await crypto.subtle.sign('HMAC', (await keys(code)).hkey, te.encode(id))).slice(0, 40); }
  async function seal(bytes, code){
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM', iv}, (await keys(code)).key, bytes));
    const out = new Uint8Array(12 + ct.length); out.set(iv); out.set(ct, 12); return out;
  }
  async function unseal(u8, code){ return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM', iv:u8.slice(0,12)}, (await keys(code)).key, u8.slice(12))); }
  async function sealRec(r, code){ return {id: await sid(r.id, code), updatedAt: r.updatedAt, enc: b64(await seal(te.encode(JSON.stringify(r)), code))}; }
  async function openRec(x, code){ if(!x || !x.enc) return E2E ? null : x; try { return JSON.parse(td.decode(await unseal(unb64(x.enc), code))); } catch(e){ return null; } }
  // Bandeau « chiffrement en cours » (version publique) : montre que les données partent chiffrées
  let cbT = null, cbSince = 0;
  function cryptShow(txt){
    if(!E2E) return; const el = document.getElementById('cv-crypt'); if(!el) return;
    clearTimeout(cbT); el.textContent = txt; el.classList.add('show'); if(!cbSince) cbSince = Date.now();
  }
  function cryptHide(doneTxt){
    if(!E2E) return; const el = document.getElementById('cv-crypt'); if(!el) return;
    if(doneTxt) el.textContent = doneTxt;
    const wait = Math.max(doneTxt ? 1800 : 0, 1200 - (Date.now() - cbSince));
    clearTimeout(cbT); cbT = setTimeout(()=>{ el.classList.remove('show'); cbSince = 0; }, wait);
  }

  async function call(since, changes, code){
    const url = apiUrl(); if(!url) throw new Error('Adresse du serveur inconnue');
    if(E2E) changes = await Promise.all(changes.map(r=>sealRec(r, code)));
    const res = await fetch(url, {method:'POST', headers:{'Content-Type':'application/json','X-Carnet-Code':await authCode(code)}, body:JSON.stringify({since, changes})});
    let j = {}; try { j = await res.json(); } catch(e){}
    if(!res.ok) throw new Error(j.error || ('Erreur serveur ' + res.status));
    if(!Array.isArray(j.records)) throw new Error('Réponse inattendue du serveur');
    if(E2E) j.records = (await Promise.all(j.records.map(x=>openRec(x, code)))).filter(Boolean);
    return j;
  }
  function mergeRemote(records){
    let changed = 0;
    for(const r of records){
      if(!r || !r.id) continue;
      const l = R[r.id];
      if(l && isDirty(r.id) && (l.updatedAt||0) > (r.updatedAt||0)) continue;
      if(!l || (r.updatedAt||0) > (l.updatedAt||0)){ R[r.id] = r; changed++; }
    }
    return changed;
  }
  async function syncSpace(sp){
    sp.dirty = sp.dirty || []; let changed = 0;
    try {
      const ids = [...sp.dirty]; let first = true;
      for(let i = 0; first || i < ids.length; i += 500){
        first = false;
        const chunk = ids.slice(i, i+500).map(id => R[id]).filter(Boolean);
        const sent = {}; chunk.forEach(c => sent[c.id] = c.updatedAt);
        const j = await call(Math.max(0, (sp.since||0) - 5000), chunk, sp.code);
        sp.dirty = sp.dirty.filter(id => !(id in sent) || (R[id] && R[id].updatedAt !== sent[id]));
        j.records.forEach(r=>{ if(r && r.type==='trip' && !TS()[r.id]) TS()[r.id] = sp.code; });
        changed += mergeRemote(j.records); sp.since = j.now;
      }
      sp.last = Date.now(); sp.err = '';
    } catch(e){ sp.err = e.message || String(e); }
    return changed;
  }
  async function syncNow(manual){
    const mainOn = !!(M.sync.on && M.sync.code);
    if(!mainOn && !(M.spaces||[]).length) return;
    if(syncing){ again = true; return; }
    syncing = true; syncDot();
    const showC = E2E && !!manual;
    if(showC) cryptShow('🔐 Chiffrement de tes données en cours…');
    let changed = 0;
    try {
      if(mainOn){
      const ids = [...M.dirty];
      let first = true;
      for(let i = 0; first || i < ids.length; i += 500){
        first = false;
        const chunk = ids.slice(i, i+500).map(id => R[id]).filter(Boolean);
        const sent = {}; chunk.forEach(c => sent[c.id] = c.updatedAt);
        const j = await call(Math.max(0, (M.sync.since||0) - 5000), chunk);
        M.dirty = M.dirty.filter(id => !(id in sent) || (R[id] && R[id].updatedAt !== sent[id]));
        changed += mergeRemote(j.records);
        M.sync.since = j.now;
      }
      M.sync.last = Date.now(); M.sync.err = '';
      }
      for(const sp of (M.spaces||[])) changed += await syncSpace(sp);
      if(showC) cryptHide('🔒 Données chiffrées et synchronisées');
      else if(manual) toast('☁️ Synchronisé');
      setTimeout(uploadQueue, 100);
    } catch(e){
      M.sync.err = e.message || String(e);
      if(showC) cryptHide();
      if(manual) alert('Synchro impossible : ' + M.sync.err);
    }
    persist(); syncing = false; syncDot();
    if(changed) refresh();
    else if(M.tab==='reglages' && M.trip!==LEGACY && !sheetOpen()) render();
    if(again){ again = false; syncNow(); }
  }
  function syncDot(){
    const el = document.getElementById('cv-sd'); if(!el) return;
    el.className = 'sd ' + (!M.sync.on ? 'off' : M.sync.err ? 'err' : (M.dirty.length || syncing || (M.pq||[]).length) ? 'wait' : 'ok');
  }

  /* ══════════ En-tête, voyages, navigation ══════════ */
  const GROUPS = [
    {id:'jours',  icon:'🗓️', lbl:'Programme', tabs:[['prog','Jour par jour'], ['souv','📸 Souvenirs'], ['notes','📌 Notes'], ['outils','🧰 Outils']]},
    {id:'resas',  icon:'🎫', lbl:'Résas',     tabs:[['transport','✈️ Trajets'], ['hotel','🏨 Hôtels'], ['activite','🎟️ Visites'], ['divers','🧾 Divers']]},
    {id:'sous',   icon:'💸', lbl:'Budget',    tabs:[['budget','Qui paie quoi'], ['ech','📆 Échéancier']]},
    {id:'envies', icon:'✨', lbl:'Envies',    tabs:[['envies','Envies']]},
    {id:'plus',   icon:'🧳', lbl:'Plus',      tabs:[['check','✅ Checklist'], ['reglages','👥 Partage & profils']]},
  ];
  const groupOf = id => GROUPS.find(g=>g.tabs.some(t=>t[0]===id)) || GROUPS[0];
  const MOIS = ['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
  function tripDatesLong(t){
    if(!t || !t.debut) return '';
    const a = t.debut.split('-'), b = (t.fin||t.debut).split('-');
    if(a[0]===b[0] && a[1]===b[1]) return `${+a[2]} → ${+b[2]} ${MOIS[+a[1]-1]} ${a[0]}`;
    return `${+a[2]} ${MOIS[+a[1]-1]} → ${+b[2]} ${MOIS[+b[1]-1]} ${b[0]}`;

  }

    { const ph = R[id] ? tripPhase(R[id]) : 'prep'; const want = ph === 'prep' ? 'prep' : ph === 'live' ? 'live' : (M.mode === 'past' || M.mode === 'bilan' ? M.mode : 'bilan');
      if(M.mode && M.mode !== want && !(M.mode === 'past' && want === 'bilan')) M.mode = want; M.modeTrip[M.mode === 'past' ? 'bilan' : M.mode] = id; }

    else if(M.tab==='souv') renderSouv();
    else if(M.tab==='check') renderCheck();
    else if(M.tab==='envies') renderEnvies();
    else if(M.tab==='outils') renderOutils();

  /* ── Filtre « pour qui » (départs / retours séparés) ── */
  function whoBar(){
    const v = tv(); if(v.length < 2) return '';
    return `<div class="v-filters cv-whobar"><span class="cv-lbl">Voir pour</span>
      <button class="v-chip${M.who==='all'?' on':''}" onclick="CV.who('all')">Tout le monde</button>
      ${v.map(id=>`<button class="v-chip cv-pc${M.who===id?' on':''}" style="--pc:${pcol(id)}" onclick="CV.who('${id}')">${esc(pname(id))}</button>`).join('')}</div>`;
  }
  function setWho(id){ M.who = id; persist(); render(); }

  /* ══════════ Listes par catégorie ══════════ */
  function priceHTML(it){
    const n = parts(it).length, pp = partage(it)==='pp';
    const per = n>1 && pp ? '<small>/pers</small>' : '';
    const tag = n>1 && chargeOf(it).mode==='egal' ? `<div class="v-ptag">${pp ? '× '+n+' = '+eur(totalOf(it)) : 'partagé · '+eur(base(it)/n)+'/pers'}</div>` : '';
    if(hasPrix(it)) return `<div class="v-price">${eur(num(it.prix))}${per}</div>${tag}`;
    if(num(it.estime)) return `<div class="v-price est">≈ ${eur(num(it.estime))}${per}</div>${tag}`;
    return '';
  }
  function subline(it){
    const bits = [];
    if(it.cat==='transport'){
      if(it.date) bits.push(fdate(it.date));
      const h = [it.heureDep, it.heureArr].filter(Boolean).join(' → '); if(h) bits.push(h);
      if(it.from || it.to) bits.push([it.from, it.to].filter(Boolean).join(' → '));
      if(it.compagnie) bits.push(it.compagnie);
    } else if(it.cat==='hotel'){
      if(it.date) bits.push(fdate(it.date) + (it.dateFin ? ' → ' + fdate(it.dateFin) : ''));
      const n = nights(it.date, it.dateFin); if(n) bits.push(n + ' nuit' + (n>1?'s':''));
      if(it.nom) bits.push(it.nom);
    } else {
      if(it.date) bits.push(fdate(it.date));
      if(it.heure) bits.push(it.heure);
    }
    if(it.ref) bits.push('Réf. ' + it.ref);
    return bits.map(esc).join(' · ');
  }
  function quiLine(it){
    if(!subset(it)) return '';
    const p = parts(it);
    return `<div class="cv-qui"><span class="ins">${p.map(ini).join('')}</span>${p.map(id=>esc(pname(id))).join(', ')} seulement</div>`;
  }
  function card(it){
    const ns = notesFor('item:'+it.id);
    const pinned = ns.filter(n=>n.pin);
    const showHint = it.hint && it.statut==='todo';
    return `<div class="v-card ${it.statut}" onclick="CV.edit('${it.id}')">
      <div class="v-card-ico">${icon(it)}</div>
      <div class="v-card-main">

        <div class="v-card-sub">${subline(it)}</div>

  /* Carte « Que voir ? » : un bouton par étape, ouvre la recherche des lieux à visiter */
  function discoverCard(compact){
    const seen = new Set();
    const st = items(i=>i.cat==='hotel').sort((a,b)=>(a.date||'').localeCompare(b.date||''))
      .filter(h=>{ const c = cityOf(h.titre||''); if(!c || seen.has(c)) return false; seen.add(c); return true; });
    if(!st.length) return '';
    return `<div class="cv-disc-card${compact?' compact':''}"><div class="dt">🔎 Que voir pendant le voyage ?</div>
      ${compact ? '' : '<div class="dd">Musées, monuments, points de vue… autour de chaque étape. Touche une ville pour voir les lieux et les ajouter au programme.</div>'}
      <div class="dc">${st.map(h=>`<button type="button" onclick="CV.discover('${h.id}')">📍 ${esc(cityOf(h.titre))}</button>`).join('')}</div></div>`;
  }
  function renderList(cat){
    const all = items(i => i.cat===cat).sort(sortItems);
    const mine = all.filter(forWho);
    const f = M.filt[cat] || 'all';
    const shown = f==='all' ? mine : mine.filter(i=>i.statut===f);
    const n = mine.length, paid = mine.filter(i=>i.statut==='paid').length, booked = mine.filter(i=>i.statut==='booked').length;
    const proj = M.who==='all' ? mine.reduce((s,i)=>s+totalOf(i),0) : mine.reduce((s,i)=>s+shareOf(i,M.who),0);
    const reel = M.who==='all' ? mine.reduce((s,i)=>s+totalOf(i,'reel'),0) : mine.reduce((s,i)=>s+shareOf(i,M.who,'reel'),0);

      <div class="v-sum-small">${M.who!=='all' ? 'Part de '+esc(pname(M.who)) : nv>1 ? 'Total pour '+nv+' · soit ≈ '+eur(proj/nv)+' par personne' : 'Projection'} · réel saisi : ${eur(reel)}</div>
      <div class="v-bar"><span class="b-paid" style="width:${n?paid/n*100:0}%"></span><span class="b-booked" style="width:${n?booked/n*100:0}%"></span></div>

    </div>
    <div class="v-filters">${[['all','Tous'],['todo','À réserver'],['booked','Réservé'],['paid','Payé']].map(([k,l])=>
      `<button class="v-chip${f===k?' on':''}" onclick="CV.filter('${cat}','${k}')">${l}</button>`).join('')}</div>`;
    if(!shown.length) h += `<div class="v-empty">Encore rien par ici.<br>Le bouton ＋ est fait pour ça.</div>`;
    h += shown.map(card).join('');
    document.getElementById('cv-body').innerHTML = h;
  }

  function cycle(id){

  /* ══════════ Panneaux (bottom sheet) ══════════ */
  let editing = null;

  function openSheet(html, locked){
    const prev = document.getElementById('v-sheet-bg'); if(prev) prev.remove();

    bg.className = 'v-sheet-bg'; bg.id = 'v-sheet-bg';

    if(!locked) bg.addEventListener('click', e=>{ if(e.target===bg) closeSheet(); });
    if(locked) bg.dataset.locked = '1';
    document.body.appendChild(bg);
    document.body.style.overflow = 'hidden';
    if(/data-[rt]map=/.test(html)) setTimeout(hydrateMaps, 30);
    if(/data-ph=/.test(html)) setTimeout(hydrate, 30);

  function closeSheet(force){
    const bg = document.getElementById('v-sheet-bg');

  const actions = (del) => `<div class="v-actions">

  function segBtns(id, opts, cur, attr){
    return `<div class="v-seg v-seg2" id="${id}">${opts.map(([k,l])=>`<button type="button" class="${k===cur?'on':''}" data-v="${k}" onclick="CV.seg(this)">${l}</button>`).join('')}</div>`;

  function seg(btn){ btn.parentNode.querySelectorAll('button').forEach(b=>b.classList.remove('on')); btn.classList.add('on'); if(document.getElementById('cv-live')) live(); }
  const segVal = id => { const b = document.querySelector('#'+id+' button.on'); return b ? b.dataset.v : null; };
  function peopleSel(id, pool, selected){

  /* ── Fiche trajet / hôtel / visite / dépense ── */
  function edit(id, newCat){
    let draft = null; if(id && typeof id === 'object'){ draft = id; id = null; newCat = draft.cat; }
    const src = draft ? Object.assign({id:null, type:'item', trip:M.trip, titre:'', statut:'todo', date:'', mode:'Avion', qui:[]}, draft) : id ? R[id] : {id:null, type:'item', trip:M.trip, cat:newCat, titre:'', statut:'todo', date:'', mode:'Avion', qui: M.who!=='all' ? [M.who] : []};

    const it = clone(src); editing = it;

    if(id) h += byline(it);
    if(it.hint) h += `<div class="v-hint">💡 ${esc(it.hint)}</div>`;
    h += `<form id="v-form" onsubmit="event.preventDefault();CV.saveForm()" oninput="CV.live()">`;
    h += `<div class="v-f"><label>Statut</label><div class="v-seg" id="v-seg">${Object.entries(STATUTS).map(([k,l])=>
      `<button type="button" class="${k}${it.statut===k?' on':''}" data-v="${k}" onclick="CV.seg(this)">${l}</button>`).join('')}</div></div>`;

    if(v.length > 1){

      h += `<div class="v-f"><label>${c==='transport'?'Qui fait ce trajet ?':c==='hotel'?'Qui dort ici ?':'Pour qui ?'}</label>${peopleSel('cv-qui', v, sel)}

    }

      h += `<div class="v-f"><label>Mode</label><select class="v-in" name="mode">${Object.keys(MODE_ICON).map(m=>`<option${it.mode===m?' selected':''}>${m}</option>`).join('')}</select></div>`;
      h += `<div class="v-f2">${field('Départ','from',it.from)}${field('Arrivée','to',it.to)}</div>`;
      h += `<div class="v-f2">${field('Date','date',it.date,'date')}${field('Compagnie / n° vol','compagnie',it.compagnie)}</div>`;
      h += `<div class="v-f2">${field('Heure départ','heureDep',it.heureDep,'time')}${field('Heure arrivée','heureArr',it.heureArr,'time')}</div>`;
    } else if(c==='hotel'){
      h += field('Nom de l’hôtel / du bateau','nom',it.nom);

      h += field('Lieu / prestataire','adresse',it.adresse);

      : `<div class="v-f"><button type="button" class="v-day-edit" onclick="CV.rcAttach('${id}')">📷 Joindre la photo du ticket</button></div>`;
    h += `<div class="v-f"><label>Le prix saisi est</label>${segBtns('cv-part', [['pp','Par personne'],['grp','Global, partagé']], partage(it))}

    h += payForm(it);
    h += field('N° de réservation','ref',it.ref);

  function readForm(){
    const it = editing; if(!it) return null;
    const fd = new FormData(document.getElementById('v-form'));
    for(const [k,v] of fd.entries()) it[k] = String(v).trim();
    it.statut = segVal('v-seg') || 'todo';
    it.partage = segVal('cv-part') || partage(it);
    if(document.getElementById('cv-qui')){
      const q = peopleVal('cv-qui');
      it.qui = (!q.length || q.length === tv().length) ? [] : q;
    }
    readPay(it);
    return it;
  }
  function saveForm(keepOpen){
    const it = readForm(); if(!it) return false;
    if(!it.titre){ alert('Donne un intitulé.'); return false; }
    const isNew = !it.id; if(isNew) it.id = 'i' + uid();
    if(isNew || !sameItem(R[it.id], it)) put(it);
    if(keepOpen) return it.id;
    closeSheet(); render(); return it.id;
  }
  function sameItem(a, b){
    if(!a || !b) return false;
    const norm = v => Array.isArray(v) ? (v.length ? JSON.stringify(v) : '') : (v && typeof v==='object') ? (Object.keys(v).length ? JSON.stringify(v) : '') : (v == null ? '' : String(v));
    const keys = new Set([...Object.keys(a), ...Object.keys(b)]);
    for(const k of keys){
      if(k==='partage'){ if(partage(a)!==partage(b)) return false; continue; }
      if(k==='charge'){ if(JSON.stringify(chargeOf(a))!==JSON.stringify(chargeOf(b))) return false; continue; }
      if(k==='payeur'){ if((a.payeur||'chacun')!==(b.payeur||'chacun')) return false; continue; }
      if(norm(a[k]) !== norm(b[k])) return false;
    }
    return true;
  }
  function noteFromItem(){ const id = saveForm(true); if(!id) return; editNote(null, 'item:'+id); }
  function del(id){
    const it = R[id];
    if(!it || !confirm('Supprimer « ' + (it.titre||'') + ' » ?')) return;

  /* ══════════ Jours ══════════ */
  const openD = {};

  function itemsForDay(d){
    const own = items(i=>i.date===d && i.cat!=='hotel' && forWho(i)).sort(sortItems);
    const night = items(i=>i.cat==='hotel' && i.date && forWho(i) && (i.dateFin ? (i.date<=d && d<i.dateFin) : i.date===d));
    return {own, night};
  }
  function pinBoard(){
    const pins = list('note', n=>n.trip===M.trip && n.pin).sort((a,b)=>b.updatedAt-a.updatedAt);

    const open = M.pinOpen !== false;

  function renderBudget(){

      const proj = all.reduce((s,i)=>s+shareOf(i,pid),0);
      const paye = all.reduce((s,i)=>s+shareOfPaid(i,pid),0);
      const reel = all.reduce((s,i)=>s+shareOf(i,pid,'reel'),0);

    });
    const tot = rows.reduce((a,r)=>({est:a.est+r.est, reel:a.reel+r.reel, proj:a.proj+r.proj, paye:a.paye+r.paye}), {est:0,reel:0,proj:0,paye:0});

      </div>
      <div class="v-tiles">
        <div class="v-tile"><div class="a">${eur(tot.proj)}</div><div class="l">Total du voyage${v.length>1?' (tous)':''}</div></div>

        <div class="v-tile g"><div class="a">${eur(tot.paye)}</div><div class="l">Déjà payé</div></div>
        <div class="v-tile r"><div class="a">${eur(tot.proj - tot.paye)}</div><div class="l">Reste à payer</div></div>
      </div>
      <div class="v-sum">
        <div class="v-obj"><span>Objectif par personne</span><input class="v-in" inputmode="decimal" value="${esc(t.objectif||'')}" placeholder="—" onchange="CV.setObj(this.value)"> €</div>
        ${per.map(p=>{
          const pct = obj ? Math.min(100, p.proj/obj*100) : 0, ok = !obj || p.proj <= obj;
          return `<div class="cv-pbud">
            <div class="cv-pbud-h">${pchip(p.pid)}<b>${eur(p.proj)}</b></div>
            ${obj ? `<div class="v-bar"><span class="b-paid" style="width:${pct}%;background:${ok?pcol(p.pid):'var(--red)'}"></span></div>` : ''}
            <div class="v-sum-small">sa part réglée ${eur(p.paye)} · reste ${eur(p.proj-p.paye)}${obj ? ` · ${ok ? 'marge '+eur(obj-p.proj) : '<b style="color:var(--red)">dépasse de '+eur(p.proj-obj)+'</b>'}` : ''}</div>
          </div>`;}).join('')}
      </div>
      ${v.length > 1 ? equilibreHTML() : ''}
      <table class="v-btable">
        <thead><tr><th>Poste (total)</th><th>Estimé</th><th>Réel</th><th>Payé</th></tr></thead>
        <tbody>
          ${rows.map(r=>`<tr onclick="CV.tab('${r.c}')" style="cursor:pointer"><td>${CATS[r.c].icon} ${CATS[r.c].lbl}</td><td>${eur(r.est)}</td><td>${eur(r.reel)}</td><td>${eur(r.paye)}</td></tr>`).join('')}

      <form id="v-form" onsubmit="event.preventDefault();CV.saveWish()">

  function saveWish(){
    const w = editing; if(!w) return;

    const g = {};
    document.querySelectorAll('[data-dep]').forEach(i=>{ const pid = i.dataset.dep, ret = document.querySelector(`[data-ret="${pid}"]`).value.trim(), dep = i.value.trim(); if(dep||ret) g[pid] = {dep, ret}; });
    w.gens = g;

  function wishToTrip(id){
    const w = R[id]; if(!w) return;
    const who = [...new Set([...wishPeople(w), ...(w.likes||[]).filter(prof)])];
    if(!who.length && M.me) who.push(M.me);
    if(!confirm(`Créer le voyage « ${w.titre} » pour ${who.map(pname).join(', ')} ?\nLes trajets aller/retour de chacun et l’hébergement seront préparés.`)) return;
    const tid = 't' + uid(), out = [];
    out.push({id:tid, type:'trip', titre:w.titre, sous:WISH[w.kind]?WISH[w.kind].lbl:'', debut:w.debut||'', fin:w.fin||w.debut||'', voyageurs:who, objectif:num(w.budget)||''});
    out.push({id:'i'+uid(), type:'item', trip:tid, cat:'hotel', titre:w.titre, nom:w.hotel||'', date:w.debut||'', dateFin:w.fin||'', statut:'todo', partage:'grp', qui:[]});
    const g = w.gens || {};
    who.forEach(pid=>{
      const dep = (g[pid]||{}).dep || '', ret = (g[pid]||{}).ret || dep;
      const solo = who.length > 1 ? [pid] : [];
      out.push({id:'i'+uid(), type:'item', trip:tid, cat:'transport', mode:'Avion', titre:(dep||'Départ')+' → '+w.titre, from:dep, to:w.titre, date:w.debut||'', statut:'todo', qui:solo, partage:'pp'});
      out.push({id:'i'+uid(), type:'item', trip:tid, cat:'transport', mode:'Avion', titre:w.titre+' → '+(ret||'Retour'), from:w.titre, to:ret, date:w.fin||'', statut:'todo', qui:solo, partage:'pp'});
    });
    if(w.notes) out.push({id:'n'+uid(), type:'note', trip:tid, ref:'', texte:w.notes, pin:true});
    BASIC_CHECK.forEach(([cat,label],i)=>out.push({id:'c'+uid()+i, type:'check', trip:tid, cat, label, done:false}));
    w.tripCree = tid; w.statut = 'prevu'; out.push(w);
    putMany(out, '🚀 Voyage créé');
    M.tab = 'prog'; go(tid);
  }

  function saveTrip(){
    const t = editing; if(!t) return;
    const fd = new FormData(document.getElementById('v-form'));
    for(const [k,v] of fd.entries()) t[k] = String(v).trim();
    if(!t.titre){ alert('Donne un nom au voyage.'); return; }

    t.objectif = t.objectif === '' ? '' : num(t.objectif);
    const isNew = !t.id;
    if(isNew) t.id = 't' + uid();
    const out = [t];
    if(isNew && document.getElementById('cv-basic') && document.getElementById('cv-basic').checked)
      BASIC_CHECK.forEach(([cat,label],i)=>out.push({id:'c'+uid()+i, type:'check', trip:t.id, cat, label, done:false}));
    putMany(out, isNew ? '🧳 Voyage créé' : '💾 Enregistré');
    closeSheet(true);
    if(isNew){ M.tab = 'prog'; go(t.id); } else refresh();

  function delTrip(id){
    const t = R[id]; if(!t) return;
    if(!confirm('Supprimer le voyage « ' + t.titre + ' » et toutes ses fiches ? (pour tout le monde si la synchro est active)')) return;
    const out = Object.values(R).filter(r=>r.trip===id && !r.deleted);
    out.forEach(r=>r.deleted = true); t.deleted = true;
    putMany([...out, t], '🗑 Voyage supprimé'); closeSheet(true); M.trip = null; applyMode();
  }
  function closeTrip(){
    const t = trip(); if(!t) return;
    if(!confirm('Clôturer « ' + t.titre + ' » : tout marquer payé et coché, et le garder en archive ?')) return;
    const out = [];
    items().forEach(i=>{ if(i.statut!=='paid'){ i.statut='paid'; out.push(i); } });
    list('check', c=>c.trip===t.id && !c.done).forEach(c=>{ c.done = true; out.push(c); });
    t.archived = true; out.push(t);
    putMany(out, '✓ Voyage clôturé'); refresh();
  }
  function reopenTrip(){ const t = trip(); t.archived = false; put(t); refresh(); }

  /* ══════════ Partage & réglages ══════════ */
  function genCode(){
    const a = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789', r = new Uint8Array(12); crypto.getRandomValues(r);
    return [...r].map(x=>a[x % a.length]).join('').replace(/(.{4})(?=.)/g,'$1-');
  }
  function activity(){
    return Object.values(R).filter(r=>r.updatedBy && (r.updatedAt||0) > 1000 && r.type!=='geo')
      .sort((a,b)=>b.updatedAt-a.updatedAt).slice(0,30).map(r=>{
        const verb = r.deleted ? 'a supprimé' : (r.createdAt && Math.abs(r.updatedAt-r.createdAt) < 2000) ? 'a ajouté' : 'a modifié';
        const what = r.type==='item' ? icon(r)+' '+esc(r.titre) : r.type==='note' ? '📌 note « '+esc((r.texte||'').slice(0,40))+' »'
          : r.type==='wish' ? '✨ envie « '+esc(r.titre)+' »' : r.type==='trip' ? '🧳 voyage « '+esc(r.titre)+' »'
          : r.type==='day' ? '📅 programme du '+fdate(r.date) : r.type==='check' ? '✅ '+esc(r.label)+(r.done?' (coché)':'') : r.type==='profile' ? '👤 profil '+esc(r.nom) : r.type==='place' ? '📍 lieu « '+esc(r.nom)+' »' : r.type==='remb' ? '💸 remboursement de '+eur(num(r.montant)) : r.type==='souv' ? '📸 souvenir « '+esc(r.titre||r.lieu||'')+' »' : esc(r.type);
        const tr = r.trip && R[r.trip] && r.type!=='trip' ? ` <span class="cv-act-t">· ${esc(R[r.trip].titre||'')}</span>` : '';
        return `<div class="cv-act"><span class="cv-dot" style="background:${pcol(r.updatedBy)}"></span><div>${pname_c(r.updatedBy)} ${verb} ${what}${tr}<div class="cv-act-w">${when(r.updatedAt)}</div></div></div>`;
      }).join('') || '<div class="v-sum-small">Rien pour l’instant.</div>';
  }

  async function syncOn(){

    if(code.length < 8){ alert('Choisis ou génère un code d’au moins 8 caractères.'); return; }
    const prev = clone(M.sync);
    M.sync.url = urlEl ? urlEl.value.trim() : M.sync.url; M.sync.code = code;
    if(!apiUrl()){ alert('Indique l’adresse de l’appli en ligne.'); M.sync = prev; return; }
    try {
      const j = await call(0, []);
      const remote = j.records.filter(r=>!r.deleted);
      const localContent = Object.values(R).filter(r=>r.type!=='profile' && !r.deleted && !r.demo);
      if(remote.length && localContent.length){
        const replace = confirm(`Le carnet partagé contient déjà ${remote.length} fiches.\n\nOK = utiliser le carnet partagé (recommandé pour rejoindre : ce téléphone garde seulement ses profils).\nAnnuler = fusionner les deux carnets.`);
        if(replace) Object.keys(R).forEach(id=>{ if(R[id].type!=='profile') delete R[id]; });
      }
      M.dirty = [];
      mergeRemote(j.records);
      Object.values(R).forEach(r=>{ if(!j.records.some(x=>x.id===r.id)) markDirty(r.id); });
      M.sync.on = true; M.sync.since = j.now; M.sync.err = '';
      persist();
      await syncNow();
      if(!prof(M.me)) whoSheet();
      refresh(); toast('☁️ Synchro activée');
      if(PUBLIC && prof(M.me)) setTimeout(codeSheet, 300);
    } catch(e){ M.sync = prev; persist(); alert('Connexion impossible : ' + e.message); }

  function importData(data){

      recs.forEach(r=>{ stamp(r); r.imported = true; });

    recs.forEach(r=>{ if(r && r.id && (!R[r.id] || (r.updatedAt||0) >= (R[r.id].updatedAt||0))){ R[r.id] = r; markDirty(r.id); n++; } });

  function fromV1(S, meId, seed){
    const tid = 't2027', out = [];
    const comp = (S.voyageurs||[]).slice(1).map((v,i)=>({id:'p'+uid()+i, type:'profile', nom:v.nom, couleur:COLORS[(i+1)%COLORS.length]}));

      voyageurs:[meId, ...comp.map(c=>c.id)].filter(Boolean), objectif:S.objectif||4000});
    (S.items||[]).forEach((it,i)=>out.push(Object.assign({}, it, {id: seed ? 's27-'+i : it.id, type:'item', trip:tid})));
    Object.entries(S.days||{}).forEach(([d,v])=>out.push({id:'day:'+tid+':'+d, type:'day', trip:tid, date:d, titre:v.titre||'', plan:v.plan||''}));
    (S.checklist||[]).forEach((c,i)=>out.push({id:'chk:'+tid+':'+(seed ? 's'+i : c.id), type:'check', trip:tid, cat:c.cat, label:c.label, done:!!c.done}));
    return out;
  }

  /* ══════════ 📆 Échéancier ══════════ */
  const thisMonth = () => new Date().toISOString().slice(0,7);

  function monthLbl(k){ if(!k || k==='—') return 'Sans date'; const [y,m] = k.split('-'); const s = new Date(+y,+m-1,1).toLocaleDateString('fr-FR',{month:'long',year:'numeric'}); return s[0].toUpperCase() + s.slice(1); }
  function planRange(){
    const t = trip(), now = thisMonth(), tk = (t.debut||'').slice(0,7);

    let a = /^\d{4}-\d{2}$/.test(t.echA||'') ? t.echA : (tk && tk > now ? addMonths(tk,-1) : now);
    if(a < de) a = de;
    return {de, a, custom: !!(t.echDe || t.echA)};
  }
  function planMonths(){
    const {de, a} = planRange(), out = [];

    return out;
  }
  function echRange(){

  function echToggle(iid, eid){

  function lisser(){
    const months = planMonths(), all = items(), unpl = unplanned(all);
    if(!unpl.length) return;
    const total = unpl.reduce((s,u)=>s+u.rest,0), target = total / months.length;
    if(!confirm(`Répartir ${eur(total)} sur ${months.length} mois (${monthLbl(months[0])} → ${monthLbl(months[months.length-1])}), soit ≈ ${eur(target)} par mois ?\nLes grosses dépenses sont coupées en plusieurs fois. Tu pourras tout ajuster dans chaque fiche.`)) return;
    const load = Object.fromEntries(months.map(k=>[k,0]));
    all.forEach(it=>(it.echeances||[]).forEach(e=>{ const k = (e.date||'').slice(0,7); if(k in load && !e.fait) load[k] += num(e.montant); }));
    const changed = [];
    unpl.sort((a,b)=>b.rest-a.rest).forEach(({it, rest})=>{
      const pieces = rest > target*1.3 ? Math.min(months.length, Math.ceil(rest/target)) : 1;
      const each = Math.floor(rest/pieces*100)/100, used = new Set();
      it.echeances = [...(it.echeances||[])];

  /* ══════════ 🗺️ Lieux du jour & itinéraire optimisé ══════════ */
  function placesOf(d){

    return list('place', p=>p.trip===M.trip && p.date===d).sort((a,b)=>{ const ia = idx(a.id), ib = idx(b.id); if(ia>=0 && ib>=0) return ia-ib; if(ia>=0) return -1; if(ib>=0) return 1; return (a.createdAt||0)-(b.createdAt||0); });

  const hotelQ = h => h.adresse || [h.nom, cityOf(h.titre)].filter(Boolean).join(', ');
  function dayCity(d){ const {night, prev} = hotelsAround(d); return cityOf((night||prev||{}).titre || ''); }
  function pointOptions(d){

    [night, prev].filter(Boolean).forEach(h=>{ if(!o.some(x=>x.k==='item:'+h.id)) o.push({k:'item:'+h.id, lbl:'🏨 '+(h.nom ? h.nom+' · ' : 'Hôtel · ')+cityOf(h.titre), q:hotelQ(h), ctx:false}); });
    items(i=>i.cat==='transport' && i.date===d).forEach(t=>{

  function dayCfg(d){

  }
  const normQ = q => String(q||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,' ').trim().slice(0,100);
  function coordsIn(q){ const m = String(q).match(/(-?\d{1,2}\.\d{3,})\s*,\s*(-?\d{1,3}\.\d{3,})/); return m ? {lat:+m[1], lng:+m[2]} : null; }
  let geoLast = 0;
  async function geocode(q, ctx){
    q = String(q||'').trim(); if(!q) return null;
    const c = coordsIn(q); if(c) return c;
    const full = ctx && !normQ(q).includes(normQ(ctx)) ? q + ', ' + ctx : q;
    const key = 'geo:' + normQ(full);
    if(R[key] && !R[key].deleted && R[key].lat != null) return {lat:R[key].lat, lng:R[key].lng};
    const wait = 1100 - (Date.now() - geoLast); if(wait > 0) await new Promise(r=>setTimeout(r, wait));
    geoLast = Date.now();
    let res = null;
    try { const j = await (await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&accept-language=fr&q=' + encodeURIComponent(full))).json(); if(j && j[0]) res = {lat:+j[0].lat, lng:+j[0].lon}; } catch(e){}
    if(!res){ try { const j = await (await fetch('https://photon.komoot.io/api/?limit=1&q=' + encodeURIComponent(full))).json(); const f = j && j.features && j.features[0]; if(f) res = {lat:f.geometry.coordinates[1], lng:f.geometry.coordinates[0]}; } catch(e){} }
    if(!res && full !== q) return geocode(q, null);
    if(res){ const g = {id:key, type:'geo', q:full, lat:res.lat, lng:res.lng}; stamp(g); R[key] = g; markDirty(key); persist(); }

  }
  function km(a,b){
    const rad = x => x*Math.PI/180, dLa = rad(b.lat-a.lat), dLo = rad(b.lng-a.lng);

  function bestOrder(start, end, pts){
    const n = pts.length; if(n < 2) return pts.map((_,i)=>i);
    let order = [], left = new Set(pts.map((_,i)=>i)), cur = start;
    while(left.size){ let b = null, bd = Infinity; left.forEach(i=>{ const d = km(cur, pts[i]); if(d < bd){ bd = d; b = i; } }); order.push(b); left.delete(b); cur = pts[b]; }
    const len = o => { let s = km(start, pts[o[0]]); for(let i=1;i<o.length;i++) s += km(pts[o[i-1]], pts[o[i]]); return s + km(pts[o[o.length-1]], end); };
    let best = len(order), improved = true, guard = 0;

        if(L < best - 1e-9){ order = o; best = L; improved = true; }

    }
    return order;
  }
  function legAdvice(d, walkMax, forced){

    if(d <= 12) return {icon:'🚇', txt:'métro / bus', min:Math.round(d/20*60+10), mode:'transit', alt: d <= walkMax*2 ? `ou ${fmtMin(walk)} à pied` : ''};
    return {icon:'🚕', txt:'taxi / VTC ou train', min:Math.round(d/35*60+10), mode:'driving'};
  }
  const fmtMin = m => m >= 60 ? Math.floor(m/60) + ' h ' + String(m%60).padStart(2,'0') : m + ' min';
  const fmtKm = k => k < 1 ? Math.round(k*1000/10)*10 + ' m' : k.toFixed(1).replace('.',',') + ' km';
  const ll = p => (+p.lat).toFixed(6) + ',' + (+p.lng).toFixed(6);
  const dirUrl = (a, b, mode, way) => `https://www.google.com/maps/dir/?api=1&origin=${ll(a)}&destination=${ll(b)}${way && way.length ? '&waypoints=' + way.map(ll).join('%7C') : ''}&travelmode=${mode}`;
  function routeHTML(d, compact){
    const r = dayInfo(d).route, pl = placesOf(d);
    if(!pl.length) return '';
    const byId = Object.fromEntries(pl.map(p=>[p.id,p]));
    const fresh = r && r.ids && r.ids.every(id=>byId[id]) && pl.every(p=>r.ids.includes(p.id) || (r.miss||[]).includes(p.id));
    if(!fresh) return compact ? `<div class="cv-route-mini">📍 ${pl.map(p=>esc(p.nom)).join(' · ')}<div class="v-sum-small">⚡ ordre pas encore optimisé</div></div>` : '';
    const stops = [r.start, ...r.ids.map(id=>Object.assign({}, r.pts[id], {nom:byId[id].nom})), r.end];
    let tot = 0, walk = 0, mins = 0; const legs = [];
    for(let i=1;i<stops.length;i++){ const dk = km(stops[i-1], stops[i]), a = legAdvice(dk, r.walk||2.5, (r.tr||[]).includes(i-1)); tot += dk; if(a.mode==='walking') walk += dk; mins += a.min; legs.push({dk, a, from:stops[i-1], to:stops[i]}); }
    const way = r.ids.map(id=>r.pts[id]);
    const full = way.length <= 9 ? [dirUrl(r.start, r.end, 'walking', way)] : [dirUrl(r.start, way[8], 'walking', way.slice(0,8)), dirUrl(way[8], r.end, 'walking', way.slice(9))];
    const gm = full.map((u,i)=>`<a class="cv-gm" href="${u}" target="_blank" rel="noopener" onclick="event.stopPropagation()">🗺️ Ouvrir dans Google Maps${full.length>1?' ('+(i+1)+'/'+full.length+')':''}</a>`).join('');
    const sum = `≈ ${fmtKm(tot)} dont ${fmtKm(walk)} à pied · ${fmtMin(mins)} de trajets`;
    if(compact) return `<div class="cv-route-mini">🗺️ ${r.ids.map((id,i)=>`<b>${i+1}</b> ${esc(byId[id].nom)}`).join(' → ')}${r.loop?' ↩️':''}<div class="v-sum-small">${sum}</div>${gm}</div>`;
    return `<div class="cv-route">
      <div class="cv-stop s">🏁 ${esc(r.start.lbl||'Départ')}</div>
      ${legs.map((L,i)=>`<a class="cv-leg" href="${dirUrl(L.from, L.to, L.a.mode)}" target="_blank" rel="noopener">${L.a.icon} ${L.a.txt} · ${fmtKm(L.dk)} · ~${fmtMin(L.a.min)}${L.a.alt ? ' <span>('+L.a.alt+')</span>' : ''} ↗</a>
        <div class="cv-stop${i===legs.length-1?' s':''}">${i===legs.length-1 ? (r.loop ? '↩️ Retour · ' : '🏁 ') + esc(r.end.lbl||'Arrivée') : '<b>'+(i+1)+'</b> '+esc(L.to.nom)}</div>`).join('')}
      <div class="cv-route-sum">${sum}</div>${gm}
      <div class="cv-rmap" data-rmap="${d}"></div>
      ${(r.miss||[]).length ? `<div class="v-sum-small" style="color:var(--red)">Introuvable(s) : ${r.miss.map(id=>byId[id] ? esc(byId[id].nom) : '').filter(Boolean).join(', ')} — ajoute une adresse précise ou un lien Google Maps.</div>` : ''}
    </div>`;
  }
  let planD = null;
  function planDay(d){
    planD = d;
    const cfg = dayCfg(d), opts = pointOptions(d), pl = placesOf(d), t = trip(), city = dayCity(d);
    const sel = (id, cur, loop) => `<select class="v-in" id="${id}" onchange="CV.plCfg()">${loop ? `<option value="boucle"${cur==='boucle'?' selected':''}>↩️ Retour au point de départ (boucle)</option>` : ''}${opts.map(o=>`<option value="${o.k}"${o.k===cur?' selected':''}>${esc(o.lbl)}</option>`).join('')}</select>`;
    openSheet(`<h2>🗺️ ${fdate(d)}${dayInfo(d).titre ? ' · ' + esc(dayInfo(d).titre) : ''}</h2>
      <div class="v-f"><label>Point de départ</label>${sel('pl-dep', cfg.dep)}
        <input class="v-in" id="pl-dept" style="margin-top:6px;${cfg.dep==='libre'?'':'display:none'}" value="${esc(cfg.depTxt)}" placeholder="Adresse, lieu ou lien Google Maps" onchange="CV.plCfg()"></div>
      <div class="v-f"><label>Arrivée</label>${sel('pl-arr', cfg.arr, true)}
        <input class="v-in" id="pl-arrt" style="margin-top:6px;${cfg.arr==='libre'?'':'display:none'}" value="${esc(cfg.arrTxt)}" placeholder="Adresse, lieu ou lien Google Maps" onchange="CV.plCfg()"></div>
      <div class="v-f"><label>Ce que tu veux voir (${pl.length})</label>
        <div>${pl.map((p,i)=>`<div class="cv-place"><span class="n">${i+1}</span><span class="x">${esc(p.nom)}${p.adresse && p.adresse!==p.nom ? `<small>${esc(p.adresse.slice(0,60))}</small>` : ''}${byline(p).replace('cv-by','cv-by s')}</span>
          <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(coordsIn(p.adresse||'') ? ll(coordsIn(p.adresse)) : (p.adresse||p.nom) + (city ? ', ' + city : ''))}" target="_blank" rel="noopener">📍</a>
          <button type="button" class="cv-x" onclick="CV.plDel('${p.id}')">✕</button></div>`).join('') || '<div class="v-sum-small">Ajoute les lieux de la journée, dans n’importe quel ordre.</div>'}</div>
        <div class="cv-row" style="margin-top:6px"><input class="v-in" id="pl-new" placeholder="Ex. Colisée ; Trastevere ; Bocca della Verità" onkeydown="if(event.key==='Enter'){event.preventDefault();CV.plAdd()}">
          <button type="button" class="v-btn sec cv-sq" onclick="CV.plAdd()">＋</button></div>
        <div class="v-sum-small" style="margin-top:4px">Un nom suffit${city ? ' (« ' + esc(city) + ' » est ajouté pour la recherche)' : ''}, ou une adresse, ou un lien Google Maps. Plusieurs d’un coup : sépare par « ; ».</div></div>
      ${hotelsAround(d).night ? `<div class="cv-row" style="margin-bottom:10px"><button type="button" class="v-day-edit" onclick="CV.discover('${hotelsAround(d).night.id}')">🔎 Lieux à visiter à ${esc(city)}</button><button type="button" class="v-day-edit" onclick="CV.planCity('${hotelsAround(d).night.id}')">🏙️ Organiser toute l’étape</button></div>` : ''}
      <div class="v-f"><label>Je marche jusqu’à</label><div class="cv-row"><input class="v-in cv-num" id="pl-walk" inputmode="decimal" value="${esc(t.marche||2.5)}" onchange="CV.plCfg()">
        <span class="v-sum-small">km par trajet ; au-delà : métro / bus, puis taxi</span></div></div>
      <button type="button" class="v-btn" id="pl-go" onclick="CV.plOpt()">⚡ Optimiser l’itinéraire</button>
      <div id="pl-res">${routeHTML(d, false)}</div>
      <div class="v-actions"><button type="button" class="v-btn sec" onclick="CV.close()">Fermer</button></div>`);
  }
  const val = id => { const e = document.getElementById(id); return e ? e.value.trim() : ''; };
  function plCfg(){
    const d = planD; if(!d) return;
    const cur = R[dayId(d)] || {};
    const nx = {dep:val('pl-dep'), depTxt:val('pl-dept'), arr:val('pl-arr'), arrTxt:val('pl-arrt')};
    document.getElementById('pl-dept').style.display = nx.dep==='libre' ? '' : 'none';
    document.getElementById('pl-arrt').style.display = nx.arr==='libre' ? '' : 'none';
    const w = num(val('pl-walk')) || 2.5, t = trip();
    if(num(t.marche||2.5) !== w){ t.marche = w; put(t, false); }
    if(['dep','depTxt','arr','arrTxt'].some(k=>(cur[k]||'') !== nx[k])){
      const info = Object.assign(clone(cur), {id:dayId(d), type:'day', trip:M.trip, date:d}, nx); delete info.deleted;
      put(info, false);
    }
  }
  function plAdd(){
    const d = planD, raw = val('pl-new'); if(!raw) return;
    const out = raw.split(/[;\n]+/).map(s=>s.trim()).filter(Boolean).map((s,i)=>{
      let nom = s; const m = s.match(/\/place\/([^/@?]+)/);
      if(/^https?:/.test(s)) nom = m ? decodeURIComponent(m[1].replace(/\+/g,' ')) : 'Lieu ' + (placesOf(d).length + i + 1);
      const st = hotelsAround(d).night;
      return {id:'pl'+uid()+i, type:'place', trip:M.trip, date:d, stay: st ? st.id : '', nom, adresse: s!==nom ? s : ''};
    });
    putMany(out, '📍 Ajouté'); planDay(d);
  }
  function plDel(id){ drop(id, false); planDay(planD); }
  async function plOpt(){
    const d = planD; plCfg();
    const cfg = dayCfg(d), pl = placesOf(d), opts = pointOptions(d), city = dayCity(d) || cityOf(trip().titre);
    if(!pl.length){ alert('Ajoute au moins un lieu.'); return; }
    const res = document.getElementById('pl-res'), btn = document.getElementById('pl-go');
    const say = m => { if(res) res.innerHTML = `<div class="cv-route-load">${m}</div>`; };
    const pt = k => { if(k==='libre') return null; return opts.find(o=>o.k===k); };
    btn.disabled = true;
    try {
      say('📡 Je localise le point de départ…');
      const o1 = pt(cfg.dep), depQ = o1 ? o1.q : cfg.depTxt;
      if(!depQ) throw new Error('Choisis un point de départ, ou saisis une adresse.');
      const start = await geocode(depQ, (!o1 || o1.ctx) ? city : null);
      if(!start) throw new Error('Point de départ introuvable : précise l’adresse, ou colle un lien Google Maps.');
      let end = start, endLbl = o1 ? o1.lbl.replace(/^\S+\s/,'') : cfg.depTxt;
      if(cfg.arr !== 'boucle'){
        const o2 = pt(cfg.arr), arrQ = o2 ? o2.q : cfg.arrTxt;
        say('📡 Je localise l’arrivée…');
        end = arrQ ? await geocode(arrQ, (!o2 || o2.ctx) ? city : null) : null;
        if(!end) throw new Error('Arrivée introuvable : précise l’adresse.');
        endLbl = o2 ? o2.lbl.replace(/^\S+\s/,'') : cfg.arrTxt;
      }
      const pts = {}, miss = [];
      for(let i=0;i<pl.length;i++){
        say(`📡 Je localise ${i+1}/${pl.length} : ${esc(pl[i].nom)}…`);
        const c = pl[i].lat != null && pl[i].lng != null ? {lat:+pl[i].lat, lng:+pl[i].lng} : await geocode(pl[i].adresse || pl[i].nom, city);
        if(c) pts[pl[i].id] = c; else miss.push(pl[i].id);
      }
      const ok = pl.filter(p=>pts[p.id]);
      const order = bestOrder(start, end, ok.map(p=>pts[p.id]));
      const info = Object.assign(clone(R[dayId(d)] || {}), {id:dayId(d), type:'day', trip:M.trip, date:d}); delete info.deleted;
      info.route = {start:Object.assign({}, start, {lbl: o1 ? o1.lbl.replace(/^\S+\s/,'') : cfg.depTxt}), end:Object.assign({}, end, {lbl:endLbl}),
        loop: cfg.arr==='boucle', ids: order.map(i=>ok[i].id), pts, miss, walk: num(val('pl-walk')) || 2.5};
      put(info, '⚡ Itinéraire optimisé');
      planDay(d);
      const r2 = document.getElementById('pl-res'); if(r2) r2.scrollIntoView({block:'start', behavior:'smooth'});
    } catch(e){
      say(''); alert(e.message);
    }
    const b2 = document.getElementById('pl-go'); if(b2) b2.disabled = false;
  }

  /* ══════════ 🧭 Assistant « nouveau voyage » ══════════ */
  let wz = null;
  function addDays(iso, n){ const d = new Date(iso + 'T12:00:00'); d.setDate(d.getDate() + n); return d.toISOString().slice(0,10); }
  const WZ_STEPS = ['Le voyage', 'Dates', 'Étapes', 'Départs & retours', 'Modèle & création'];
  function wizard(){
    wz = {step:1, titre:'', voyageurs:[M.me].filter(Boolean), objectif:'', debut:'', nuits:7,
      etapes:[{ville:'', nuits:7, mode:'Avion'}], gens:{}, modeRetour:'Avion', tpl:'', copyCheck:true, copyDivers:false};
    wzRender();
  }
  function wzRead(){
    const g = id => { const e = document.getElementById(id); return e ? e.value.trim() : ''; };
    if(!document.getElementById('wz')) return;
    if(wz.step===1){ wz.titre = g('wz-titre'); wz.voyageurs = peopleVal('wz-tv'); wz.objectif = g('wz-obj'); }
    if(wz.step===2){ wz.debut = g('wz-debut'); wz.nuits = Math.max(1, parseInt(g('wz-nuits'))||1); }
    if(wz.step===3) wz.etapes = [...document.querySelectorAll('.wz-et')].map(r=>({ville:r.querySelector('[data-k=ville]').value.trim(),
      nuits:Math.max(0, parseInt(r.querySelector('[data-k=nuits]').value)||0), mode:r.querySelector('[data-k=mode]').value}));
    if(wz.step===4){ const gg = {}; document.querySelectorAll('[data-wdep]').forEach(i=>{ const pid = i.dataset.wdep; gg[pid] = {dep:i.value.trim(), ret:document.querySelector(`[data-wret="${pid}"]`).value.trim()}; }); wz.gens = gg; wz.modeRetour = g('wz-mret') || 'Avion'; }
    if(wz.step===5){ wz.tpl = g('wz-tpl'); const cc = document.getElementById('wz-cc'), cd = document.getElementById('wz-cd'); wz.copyCheck = cc ? cc.checked : true; wz.copyDivers = cd ? cd.checked : false; }
  }
  function wzGo(n){
    wzRead();
    if(n > wz.step){
      if(wz.step===1 && !wz.titre){ alert('Donne un nom au voyage.'); return; }
      if(wz.step===1 && !wz.voyageurs.length){ alert('Choisis au moins un voyageur.'); return; }
      if(wz.step===2 && !wz.debut){ alert('Choisis la date de départ.'); return; }
      if(wz.step===2 && wz.etapes.length===1) wz.etapes[0].nuits = wz.nuits;
      if(wz.step===3 && !wz.etapes.some(e=>e.ville)){ alert('Ajoute au moins une étape (une ville).'); return; }
    }
    wz.step = n; wzRender();
  }
  function wzDates(src){
    const deb = val('wz-debut'), n = document.getElementById('wz-nuits'), f = document.getElementById('wz-fin');
    if(src==='f' && deb && f.value) n.value = Math.max(1, nights(deb, f.value));
    else if(deb) f.value = addDays(deb, Math.max(1, parseInt(n.value)||1));
    const k = parseInt(n.value)||0, lbl = document.getElementById('wz-dur');
    if(lbl) lbl.textContent = deb ? `${k} nuit${k>1?'s':''} · ${k+1} jours, du ${fdate(deb)} au ${fdate(addDays(deb,k))}` : '';
  }
  function wzEt(action, i){
    wzRead();
    if(action==='add') wz.etapes.push({ville:'', nuits:Math.max(0, wz.nuits - wz.etapes.reduce((s,e)=>s+e.nuits,0)), mode:'Train'});
    if(action==='del') wz.etapes.splice(i,1);
    if(action==='up' && i > 0) [wz.etapes[i-1], wz.etapes[i]] = [wz.etapes[i], wz.etapes[i-1]];
    if(action==='even'){ const k = wz.etapes.length, b = Math.floor(wz.nuits/k); wz.etapes.forEach((e,j)=>e.nuits = b + (j < wz.nuits - b*k ? 1 : 0)); }
    if(!wz.etapes.length) wz.etapes.push({ville:'', nuits:wz.nuits, mode:'Avion'});
    wzRender();
  }
  function wzSum(){
    wzRead(); const s = wz.etapes.reduce((a,e)=>a+e.nuits,0), el = document.getElementById('wz-sum');
    if(el){ el.textContent = `${s} / ${wz.nuits} nuits réparties` + (s!==wz.nuits ? (s < wz.nuits ? ` · il en reste ${wz.nuits-s}` : ` · ${s-wz.nuits} de trop (le retour sera décalé)`) : ' ✓'); el.style.color = s===wz.nuits ? 'var(--green)' : '#a06d00'; }
  }
  function wzPlan(){
    let cur = wz.debut;
    const st = wz.etapes.filter(e=>e.ville).map(e=>{ const o = Object.assign({}, e, {debut:cur, fin:addDays(cur, e.nuits)}); cur = o.fin; return o; });
    return {st, fin:cur};
  }
  function wzRender(){
    const s = wz.step, modes = cur => Object.keys(MODE_ICON).map(m=>`<option${m===cur?' selected':''}>${m}</option>`).join('');
    let h = `<div id="wz"><h2>🧭 Nouveau voyage</h2>
      <div class="wz-steps">${WZ_STEPS.map((l,i)=>`<span class="${i+1===s?'on':i+1<s?'done':''}" title="${l}">${i+1<s?'✓':i+1}</span>`).join('<i></i>')}</div>
      <div class="wz-title">${WZ_STEPS[s-1]}</div>`;
    if(s===1){
      h += `<div class="v-f"><label>Nom du voyage</label><input class="v-in" id="wz-titre" value="${esc(wz.titre)}" placeholder="Ex. Été 2028 en Scandinavie, Week-end Palma…"></div>
        <div class="v-f"><label>Qui part ?</label>${peopleSel('wz-tv', profiles().map(p=>p.id), wz.voyageurs)}
          <div class="v-sum-small" style="margin-top:4px">Il manque quelqu’un ? Ajoute son profil dans ⚙️ Partage, ou plus tard dans 💰 Budget.</div></div>
        <div class="v-f"><label>Budget visé par personne (facultatif)</label><input class="v-in" id="wz-obj" inputmode="decimal" value="${esc(wz.objectif)}" placeholder="€"></div>`;
    }
    if(s===2){
      h += `<div class="v-f2"><div class="v-f"><label>Départ le</label><input class="v-in" type="date" id="wz-debut" value="${esc(wz.debut)}" oninput="CV.wzDates('d')"></div>

        <div class="v-f"><label>Combien de nuits ?</label><div class="cv-row"><input class="v-in cv-num" type="number" min="1" max="90" id="wz-nuits" value="${wz.nuits}" oninput="CV.wzDates('n')">

        <div class="cv-row">${[2,3,7,14,19,21].map(n=>`<button type="button" class="v-chip" onclick="document.getElementById('wz-nuits').value=${n};CV.wzDates('n')">${n===2?'Week-end (2)':n+' nuits'}</button>`).join('')}</div>`;
    }
    if(s===3){
      h += `<div class="v-sum-small" style="margin-bottom:8px">Une ligne par ville où vous dormez. Le mode, c’est comment vous y arrivez (pour la 1ʳᵉ : depuis chez vous).</div>
        <div oninput="CV.wzSum()">${wz.etapes.map((e,i)=>`<div class="wz-et"><span class="n">${i+1}</span>
          <input class="v-in" data-k="ville" value="${esc(e.ville)}" placeholder="Ville">
          <input class="v-in cv-num" data-k="nuits" type="number" min="0" value="${e.nuits}"><span class="v-sum-small">nuit${e.nuits>1?'s':''}</span>
          <select class="v-in" data-k="mode">${modes(e.mode)}</select>
          <span class="wz-btns">${i>0?`<button type="button" class="cv-x" onclick="CV.wzEt('up',${i})" title="Monter">↑</button>`:''}<button type="button" class="cv-x" onclick="CV.wzEt('del',${i})">✕</button></span></div>`).join('')}</div>
        <div id="wz-sum" class="v-sum-small" style="margin:6px 0;font-weight:700"></div>
        <div class="cv-row"><button type="button" class="v-day-edit" onclick="CV.wzEt('add')">＋ Étape</button><button type="button" class="v-day-edit" onclick="CV.wzEt('even')">⚖️ Répartir les nuits</button></div>`;
    }
    if(s===4){
      const plan = wzPlan(), first = plan.st[0] ? plan.st[0].ville : '…', last = plan.st.length ? plan.st[plan.st.length-1].ville : '…';
      h += `<div class="v-sum-small" style="margin-bottom:8px">D’où part chacun vers ${esc(first)}, et où rentre-t-il après ${esc(last)} ? Des villes différentes = un trajet aller et un trajet retour pour chacun.</div>
        ${wz.voyageurs.map(pid=>`<div class="cv-deprow">${pchip(pid)}<input class="v-in" data-wdep="${pid}" value="${esc((wz.gens[pid]||{}).dep)}" placeholder="départ de…"><input class="v-in" data-wret="${pid}" value="${esc((wz.gens[pid]||{}).ret)}" placeholder="retour vers…"></div>`).join('')}
        <div class="v-f" style="margin-top:8px"><label>Mode du retour</label><select class="v-in" id="wz-mret">${modes(wz.modeRetour)}</select></div>`;
    }
    if(s===5){
      const {st, fin} = wzPlan(), nt = nights(wz.debut, fin);
      h += `<div class="wz-recap"><b>${esc(wz.titre)}</b> · ${wz.voyageurs.map(pid=>pchip(pid)).join(' ')}
        <div class="v-sum-small">${fdate(wz.debut)} → ${fdate(fin)} · ${nt} nuits${nt!==wz.nuits ? ' (au lieu de '+wz.nuits+' prévues : les étapes font foi)' : ''}</div>
        <ol>${st.map(e=>`<li>${MODE_ICON[e.mode]||''} <b>${esc(e.ville)}</b> · ${e.nuits} nuit${e.nuits>1?'s':''} <span class="v-sum-small">${fshort(e.debut)} → ${fshort(e.fin)}</span></li>`).join('')}</ol></div>
        <div class="v-f"><label>Reprendre la configuration d’un voyage (vierge)</label><select class="v-in" id="wz-tpl" onchange="CV.wzTpl()"><option value="">— Checklist de base —</option>${trips().map(t=>`<option value="${t.id}"${wz.tpl===t.id?' selected':''}>${esc(t.titre)}</option>`).join('')}</select></div>
        <div id="wz-tplx">${wzTplOpts()}</div>

      <button type="button" class="v-btn sec cv-sq" onclick="CV.close()">✕</button></div></div>`;
    openSheet(h);
    if(s===2) wzDates(wz.debut ? 'n' : 'd');

    const tid = 't' + uid(), out = [], v = wz.voyageurs, days = {};
    const day = (date, titre) => { days[date] = {id:'day:'+tid+':'+date, type:'day', trip:tid, date, titre, plan:''}; };
    const T = (o, k) => out.push(Object.assign({id:'i'+uid()+k, type:'item', trip:tid, cat:'transport', statut:'todo', partage:'pp', qui:[]}, o));
    out.push({id:tid, type:'trip', titre:wz.titre, sous:st.map(e=>e.ville).join(' → '), debut:wz.debut, fin, voyageurs:v, objectif: wz.objectif==='' ? '' : num(wz.objectif)});
    st.forEach((e,i)=>{

      const arrive = i===0 ? 'Arrivée à ' + e.ville : st[i-1].ville + ' → ' + e.ville;
      day(e.debut, arrive);
      range(addDays(e.debut,1), addDays(e.fin,-1)).forEach(dd=>day(dd, e.ville));
      if(i > 0) T({mode:e.mode, titre:st[i-1].ville+' → '+e.ville, from:st[i-1].ville, to:e.ville, date:e.debut}, 'e'+i);
    });
    const last = st[st.length-1];
    day(fin, (days[fin] && days[fin].titre && fin===last.debut ? days[fin].titre + ' · ' : last.ville + ' → ') + 'retour');
    const group = key => { const m = new Map(); v.forEach(pid=>{ const g = wz.gens[pid] || {}; const c = key==='dep' ? (g.dep||'') : (g.ret||g.dep||''); if(!m.has(c)) m.set(c, []); m.get(c).push(pid); }); return m; };
    let k = 0;
    group('dep').forEach((pids, c)=>T({mode:st[0].mode, titre:(c||'Départ')+' → '+st[0].ville, from:c, to:st[0].ville, date:wz.debut, qui: pids.length===v.length ? [] : pids}, 'a'+(k++)));
    group('ret').forEach((pids, c)=>T({mode:wz.modeRetour, titre:last.ville+' → '+(c||'Retour'), from:last.ville, to:c, date:fin, qui: pids.length===v.length ? [] : pids}, 'r'+(k++)));
    out.push(...Object.values(days));

    if(tpl && wz.copyCheck) list('check', c=>c.trip===tpl.id).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0)).forEach((c,i)=>out.push({id:'c'+uid()+i, type:'check', trip:tid, cat:c.cat, label:c.label, done:false}));
    else BASIC_CHECK.forEach(([cat,label],i)=>out.push({id:'c'+uid()+i, type:'check', trip:tid, cat, label, done:false}));
    if(tpl && wz.copyDivers) list('item', i=>i.trip===tpl.id && i.cat==='divers').forEach((x,i)=>out.push({id:'i'+uid()+'d'+i, type:'item', trip:tid, cat:'divers', titre:x.titre, hint:x.hint||'', partage:x.partage, statut:'todo', qui:[]}));
    putMany(out, '🚀 Voyage créé'); closeSheet(true); M.tab = 'prog'; go(tid);
  }

  // Photos : stockées sur le téléphone (IndexedDB) et envoyées sur le serveur (D1) quand la synchro est active.
  const IDB = (() => {
    let dbp = null;
    const db = () => dbp || (dbp = new Promise((res, rej) => {
      const r = indexedDB.open('carnet-photos', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('p', {keyPath:'id'});
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
    }));
    const op = async (mode, fn) => { const d = await db(); return new Promise((res, rej) => {
      const tx = d.transaction('p', mode), rq = fn(tx.objectStore('p'));
      tx.oncomplete = () => res(rq ? rq.result : undefined); tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error); }); };
    return { get: id => op('readonly', s => s.get(id)), put: o => op('readwrite', s => s.put(o)) };
  })();
  const urls = {};
  const photoApi = () => { const u = apiUrl(); return u ? u.replace(/\/sync$/, '/photo') : ''; };
  // à quel carnet appartient une photo ? (celui de la fiche qui la contient)
  function photoCode(id){
    const base = String(id).replace(/\.t$/,'');
    const r = Object.values(R).find(x=>x && ((x.photos||[]).includes(base) || x.recu===base || (x.pj||[]).some(p=>p.id===base)));
    if(r && r.demo) return null;   // les photos de démo restent sur le téléphone
    const t = targets(r)[0];
    return t === 'main' ? (M.sync.on && M.sync.code ? M.sync.code : null) : t;
  }
  async function photoBlob(id){
    try { const o = await IDB.get(id); if(o && o.blob){ try { await o.blob.slice(0, 1).arrayBuffer(); return o.blob; } catch(e){ /* fichier perdu par Safari : on le reprend sur le serveur */ } } } catch(e){}
    const code = photoCode(id); if(!code || !photoApi()) return null;
    try {
      const r = await fetch(photoApi() + '?id=' + encodeURIComponent(await sid(id, code)), {headers:{'X-Carnet-Code':await authCode(code)}});
      if(!r.ok) return null;
      let b = await r.blob();
      if(E2E) b = new Blob([await unseal(new Uint8Array(await b.arrayBuffer()), code)], {type:'image/jpeg'});
      try { await IDB.put({id, blob:b, up:1}); } catch(e){}
      return b;
    } catch(e){ return null; }
  }
  async function photoURL(id){
    if(urls[id]) return urls[id];

  async function shrink(blob, max, q){
    const bmp = await createImageBitmap(blob);
    const s = Math.min(1, max / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas'); c.width = Math.round(bmp.width*s); c.height = Math.round(bmp.height*s);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height); if(bmp.close) bmp.close();
    return new Promise(r => c.toBlob(r, 'image/jpeg', q));
  }

      const tryOne = i => {
        if(i >= srcs.length){ zipLib = null; rej(new Error('Impossible de charger le lecteur de ZIP (connexion internet nécessaire).')); return; }
        const sc = document.createElement('script'); sc.src = srcs[i];
        sc.onload = () => { try { window.zip.configure({useWebWorkers:false}); } catch(e){} res(window.zip); };
        sc.onerror = () => { sc.remove(); tryOne(i+1); };
        document.head.appendChild(sc);

      tryOne(0);
    });
    return zipLib;

        if(/\.json$/i.test(nm) || file.type === 'application/json'){
          let j; try { j = JSON.parse(await file.text()); } catch(e){ notes.push(nm + ' : JSON illisible'); continue; }
          if(!psSteps(j).length){ notes.push(nm + ' : pas d’étapes (choisis le trip.json du voyage)'); continue; }
          found.push(psTrip(j, '', [], null, nm)); continue;
        }
        say('Lecture de ' + nm + '…');
        const zip = await loadZip();
        let reader, entries;
        try { reader = new zip.ZipReader(new zip.BlobReader(file)); entries = await reader.getEntries(); }
        catch(e){ notes.push(nm + ' : ce n’est pas un .zip lisible'); continue; }
        const tj = entries.filter(e => !e.directory && /(^|\/)trip\.json$/i.test(e.filename) && !/__MACOSX\//.test(e.filename));
        if(!tj.length){
          const nImg = entries.filter(e => !e.directory && isImg(e.filename)).length;
          notes.push(nm + ' : pas de trip.json dedans' + (nImg ? ` (${nImg} photos seules). Compresse le dossier du voyage entier, celui qui contient trip.json.` : '.'));
          try { await reader.close(); } catch(e){}
          continue;
        }
        let n = 0;
        for(const e of tj){
          let j; try { j = JSON.parse(await e.getData(new zip.TextWriter())); } catch(err){ notes.push(e.filename + ' : illisible'); continue; }
          const dir = e.filename.replace(/trip\.json$/i, '');
          const photos = entries.filter(x => !x.directory && x.filename.startsWith(dir) && isImg(x.filename));
          const f = psTrip(j, dir, photos, reader, nm);
          if(!f.steps.length){ notes.push(f.name + ' : aucune étape'); continue; }
          found.push(f); n++;
        }
        if(!n){ try { await reader.close(); } catch(e){} }
      }
      if(!found.length) throw new Error('Aucun voyage trouvé. ' + notes.join(' · '));
      ps = {found};
      const opts = sel => `<option value="new"${sel==='new'?' selected':''}>＋ Nouveau voyage (archivé)</option>${trips().map(t=>`<option value="${t.id}"${sel===t.id?' selected':''}>${esc(t.titre)}</option>`).join('')}`;
      const guess = f => { const t = trips().find(t => t.debut && f.debut && t.debut <= (f.fin||f.debut) && (t.fin||t.debut) >= f.debut); return t ? t.id : 'new'; };
      openSheet(`<h2>📥 Import Polarsteps</h2>
        <div class="v-sum-small" style="margin-bottom:10px">${found.length} voyage(s) trouvé(s). Coche ceux à importer et choisis où les ranger. Un voyage déjà dans le carnet garde son programme et ses dépenses : seuls les souvenirs et photos sont ajoutés. Les photos sont copiées : tes originaux ne sont jamais touchés.</div>
        ${found.map((f,i)=>`<div class="cv-psrow"><label class="cv-checkline"><input type="checkbox" id="ps-c${i}" checked> <b>${esc(f.name)}</b></label>
          <div class="v-sum-small">${f.debut ? fdate(f.debut) + ' → ' + fdate(f.fin) + ' ' + f.debut.slice(0,4) : ''} · ${f.steps.length} étape(s) · ${f.photos.length} photo(s)</div>
          <select class="v-in" id="ps-t${i}">${opts(guess(f))}</select></div>`).join('')}
        ${notes.length ? `<div class="v-sum-small" style="margin:6px 0">ℹ️ ${notes.map(esc).join('<br>')}</div>` : ''}
        <div class="v-sum-small" id="ps-msg" style="margin:8px 0"></div>
        <div class="v-actions"><button type="button" class="v-btn" id="ps-go" onclick="CV.psImport()">Importer</button><button type="button" class="v-btn sec cv-sq" onclick="CV.close()">✕</button></div>`);
    } catch(e){ say('⚠️ ' + (e.message || e)); }
  }
  // Photos d'une étape : n'importe quel dossier « <nom>_<idEtape> » au-dessus de la photo
  function psStepPhotos(f, st, k){
    if(!f.photos.length) return [];
    if(st.id != null){
      const re = new RegExp('(^|/)[^/]*_' + String(st.id).replace(/\W/g,'') + '/');
      const m = f.photos.filter(p => re.test(p.filename.slice(f.dir.length)));
      if(m.length) return m;
    }
    return [];
  }
  async function psImport(){
    if(!ps) return;
    const zip = window.zip, msg = document.getElementById('ps-msg'), btn = document.getElementById('ps-go');
    const say = t => { if(msg) msg.textContent = t; };
    btn.disabled = true;
    let lastTrip = null, nPh = 0;
    try {
      for(let i=0;i<ps.found.length;i++){
        if(!document.getElementById('ps-c'+i).checked) continue;
        const f = ps.found[i], out = [];
        let tid = document.getElementById('ps-t'+i).value;
        if(tid === 'new'){
          tid = 'ps' + (f.j.id || uid());
          if(!R[tid] || R[tid].deleted) out.push({id:tid, type:'trip', titre:f.name, sous:'', debut:f.debut, fin:f.fin, voyageurs:[M.me].filter(Boolean), objectif:'', archived:true, imported:true});
          f.steps.forEach(st=>{ const d = psTime(st.start_time); if(d && !R['day:'+tid+':'+d]) out.push({id:'day:'+tid+':'+d, type:'day', trip:tid, date:d, titre:(st.location && st.location.name) || st.name || st.display_name || '', plan:'', imported:true}); });
        }
        for(let k=0;k<f.steps.length;k++){
          const st = f.steps[k], sid = 'sv-ps' + (st.id || (f.j.id||'') + '-' + k);
          const loc = st.location || {};
          const prev = R[sid] && !R[sid].deleted ? R[sid] : null;
          const mine = psStepPhotos(f, st, k);
          const ids = prev ? [...(prev.photos||[])] : [];
          for(let n=0;n<mine.length;n++){
            const pid = 'ps' + (st.id||k) + '-' + mine[n].filename.split('/').pop().replace(/[^\w.\-]/g,'').slice(0,60);
            if(ids.includes(pid)) continue;
            nPh++; say(`📸 ${f.name} · étape ${k+1}/${f.steps.length} · photo ${nPh}…`);
            try { const blob = await mine[n].getData(new zip.BlobWriter('image/jpeg')); await storePhoto(blob, pid); ids.push(pid); }
            catch(err){ /* photo illisible (HEIC…) : on passe */ }
          }
          out.push(Object.assign(prev ? clone(prev) : {id:sid, type:'souv', imported:true}, {trip:tid, date:psTime(st.start_time), ordre:k,
            titre: st.name || st.display_name || loc.name || '', lieu: loc.name || '', pays: loc.detail || loc.country || '', cc: (loc.country_code || '').toUpperCase(),
            texte: st.description || (prev ? prev.texte : '') || '', lat: loc.lat, lng: loc.lon, photos: ids}));
        }
        putMany(out, false); lastTrip = tid;
      }
      for(const r of new Set(ps.found.map(f=>f.reader).filter(Boolean))){ try { await r.close(); } catch(e){} }
      ps = null; persist();
      closeSheet(true); toast('📥 Import terminé · ' + nPh + ' photo(s)');
      if(lastTrip){ M.tab = 'souv'; go(lastTrip); }
      uploadQueue();
    } catch(e){ say('⚠️ ' + (e.message || e)); btn.disabled = false; }
  }
