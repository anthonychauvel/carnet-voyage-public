<script>/* Carnet + Escale : au lancement, rouvre la dernière appli utilisée */
(function(){ try {
  var u = new URL(location.href);
  if(u.searchParams.get('app') === 'carnet'){ localStorage.setItem('app_last','carnet'); sessionStorage.setItem('app_started','1'); history.replaceState(null,'',u.pathname); return; }
  if(!sessionStorage.getItem('app_started') && localStorage.getItem('app_last') === 'escale'){ sessionStorage.setItem('app_started','1'); location.replace('/escale/'); return; }
  sessionStorage.setItem('app_started','1'); localStorage.setItem('app_last','carnet');
} catch(e){} })();
</script>

<style>
:root {
  --navy:   #16213e;
  --navy2:  #0f3460;
  --gold:   #c9a84c;
  --gold2:  #f0c040;
  --cream:  #faf6ef;
  --light:  #f0ece2;
  --green:  #2d9e6b;
  --red:    #e05252;
  --blue:   #2166ac;
  --gray:   #888;
  --white:  #ffffff;
  --radius: 12px;
  --shadow: 0 2px 14px rgba(0,0,0,0.1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:-apple-system,'Helvetica Neue',sans-serif;background:var(--cream);color:#1a1a2e;min-height:100vh;padding-bottom:30px;}

/* ── HEADER ──────────────────────────────────────────── */
.header{background:var(--navy);padding:16px 16px 0;position:sticky;top:0;z-index:200;}
.header h1{font-family:Georgia,serif;font-size:1.25rem;color:var(--gold);text-align:center;letter-spacing:1px;}
.header .sub{font-size:0.7rem;color:rgba(255,255,255,0.5);text-align:center;margin:2px 0 12px;}
.tabs{display:flex;overflow-x:auto;gap:0;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tab{padding:10px 14px;font-size:0.75rem;font-weight:600;white-space:nowrap;cursor:pointer;color:rgba(255,255,255,0.5);border-bottom:3px solid transparent;transition:all .2s;flex-shrink:0;}
.tab.active{color:var(--gold);border-bottom-color:var(--gold);}

/* ── CONTENT ─────────────────────────────────────────── */
.content{padding:14px;}
.section{display:none;animation:fadeIn .2s;}
.section.active{display:block;}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}

/* ── ROUTE VISUAL ─────────────────────────────────────── */
.route-wrap{background:var(--navy);border-radius:var(--radius);padding:16px;margin-bottom:14px;overflow-x:auto;}
.route-title{color:var(--gold);font-family:Georgia,serif;font-size:0.85rem;margin-bottom:12px;letter-spacing:0.5px;}
.route-line{display:flex;align-items:center;min-width:max-content;padding:4px 0;}
.city-stop{display:flex;flex-direction:column;align-items:center;gap:3px;}
.city-stop .dot{width:10px;height:10px;border-radius:50%;background:var(--gold);border:2px solid white;flex-shrink:0;}
.city-stop .cn{font-size:0.6rem;color:var(--cream);white-space:nowrap;}
.city-stop .cd{font-size:0.52rem;color:rgba(255,255,255,0.4);}
.route-seg{height:2px;background:rgba(201,168,76,0.35);flex:0 0 28px;margin-bottom:13px;}

/* ── TABLE ───────────────────────────────────────────── */
.table-scroll{overflow-x:auto;border-radius:var(--radius);box-shadow:var(--shadow);}
.itin-tbl{width:100%;border-collapse:collapse;min-width:540px;background:white;}
.itin-tbl th{background:var(--navy);color:var(--gold);padding:8px 6px;font-size:0.68rem;text-align:left;white-space:nowrap;}
.itin-tbl td{padding:7px 6px;border-bottom:1px solid #f0ece4;font-size:0.76rem;vertical-align:middle;}
.itin-tbl tr.sejour td{background:#f0f5ff;}
.itin-tbl tr.sejour:nth-child(even) td{background:#e8f0ff;}
.itin-tbl tr.trajet:nth-child(even) td{background:#faf9f7;}
[contenteditable]{outline:none;}
[contenteditable]:focus{background:#fff9e0;border-radius:4px;box-shadow:0 0 0 2px var(--gold);padding:1px 3px;}

.paid-btn{display:inline-flex;align-items:center;justify-content:center;padding:3px 7px;border-radius:10px;border:none;font-size:0.62rem;font-weight:700;cursor:pointer;white-space:nowrap;transition:all .2s;}
.paid-btn.oui{background:#d4edda;color:var(--green);}
.paid-btn.non{background:#fdecea;color:var(--red);}

.tbadge.flixbus{background:#e8f5e9;color:#1b5e20;cursor:pointer;}
.tbadge.train{background:#e3f2fd;color:#1565c0;cursor:pointer;}
.tbadge.avion{background:#fff3e0;color:#e65100;cursor:pointer;}
.tbadge.bus{background:#f3e5f5;color:#6a1b9a;cursor:pointer;}
.tbadge.voiture{background:#fce4ec;color:#880e4f;cursor:pointer;}
.tbadge.other{background:#f5f5f5;color:#555;cursor:pointer;}
.tbadge{transition:transform .1s;}
.tbadge:active{transform:scale(0.92);}

/* ── INSERT ROW ──────────────────────────────────────── */
.insert-btn{background:none;border:none;color:rgba(201,168,76,0.5);font-size:10px;cursor:pointer;padding:2px 4px;vertical-align:middle;}
.insert-btn:hover,.insert-btn:active{color:var(--gold);}
.insert-row-form{background:#fffbe6;border-top:2px dashed var(--gold);border-bottom:2px dashed var(--gold);}
.insert-row-form td{padding:8px 6px;}
.insert-inputs{display:flex;flex-wrap:wrap;gap:4px;align-items:center;}
.insert-inputs input,.insert-inputs select{padding:5px 6px;border:1px solid #ddd;border-radius:6px;font-size:0.72rem;background:white;width:auto;flex:1;min-width:70px;}
.insert-inputs .btn-ok{padding:5px 12px;font-size:0.72rem;flex-shrink:0;}
.insert-inputs .btn-no{padding:5px 10px;font-size:0.72rem;flex-shrink:0;}


.tbl-footer{background:var(--navy);color:white;font-size:0.75rem;}
.tbl-footer td{padding:8px 6px;font-weight:600;border-bottom:none;}

.add-row-btn{display:flex;align-items:center;gap:6px;padding:9px 14px;background:var(--navy);color:var(--gold);border:none;border-radius:8px;font-size:0.78rem;font-weight:600;cursor:pointer;margin-top:10px;}

/* ── ADD FORM ────────────────────────────────────────── */
.add-form{background:#f8f9ff;border-radius:var(--radius);padding:14px;margin-top:10px;border:2px dashed #c5cae9;display:none;}
.add-form.open{display:block;}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.fg input,.fg select,.fg.full input{padding:8px;border:1px solid #ddd;border-radius:7px;font-size:0.78rem;background:white;width:100%;}
.fg input:focus,.fg select:focus{outline:none;border-color:var(--gold);}
.full{grid-column:1/-1;}
.form-actions{display:flex;gap:8px;margin-top:10px;}
.btn-ok{padding:8px 16px;background:var(--navy);color:white;border:none;border-radius:8px;font-size:0.78rem;font-weight:600;cursor:pointer;}
.btn-no{padding:8px 16px;background:#eee;color:#555;border:none;border-radius:8px;font-size:0.78rem;cursor:pointer;}

/* ── BUDGET ──────────────────────────────────────────── */
.budget-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
.bstat{background:white;border-radius:var(--radius);padding:14px;text-align:center;box-shadow:var(--shadow);}
.bstat .amt{font-size:1.4rem;font-weight:700;font-family:Georgia,serif;}
.bstat .lbl{font-size:0.68rem;color:var(--gray);margin-top:3px;}
.bstat.t .amt{color:var(--navy);}
.bstat.p .amt{color:var(--green);}
.bstat.r .amt{color:var(--red);}
.bstat.n .amt{color:var(--blue);}
.progress-bar{height:8px;background:#f0f0f0;border-radius:4px;overflow:hidden;margin:6px 0;}
.progress-fill{height:100%;background:var(--green);border-radius:4px;transition:width .4s;}
.prog-label{font-size:0.68rem;color:var(--gray);text-align:right;}
.budget-table{width:100%;border-collapse:collapse;background:white;border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);}
.budget-table th{background:var(--navy);color:var(--gold);padding:8px 10px;font-size:0.7rem;text-align:left;}
.budget-table td{padding:8px 10px;border-bottom:1px solid #f0ece4;font-size:0.78rem;}
.budget-table tr:last-child td{border-bottom:none;}
.budget-table .sub-total{font-weight:700;background:var(--light);}

/* ── HOTELS / GARES CARDS ────────────────────────────── */
.info-card{background:white;border-radius:var(--radius);margin-bottom:10px;box-shadow:var(--shadow);border-left:4px solid var(--gold);overflow:hidden;}
.ic-header{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:linear-gradient(90deg,rgba(22,33,62,0.04),transparent);}
.ic-city{font-family:Georgia,serif;font-weight:bold;font-size:0.95rem;color:var(--navy);}
.ic-dates{font-size:0.68rem;color:var(--gray);}
.ic-body{padding:0 14px 12px;}
.if{margin-bottom:8px;}
.if label{display:block;font-size:0.62rem;text-transform:uppercase;letter-spacing:0.5px;color:var(--gray);margin-bottom:3px;}
.if-edit{display:block;width:100%;font-size:0.8rem;padding:7px 9px;background:var(--light);border-radius:7px;border:1px solid transparent;min-height:30px;outline:none;font-family:-apple-system,sans-serif;transition:border .2s;}
.if-edit:focus{border-color:var(--gold);background:#fff9e0;}
.if-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.ic-paid-row{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;border-top:1px solid #f0ece4;background:#fafafa;}
.ic-paid-lbl{font-size:0.75rem;color:#555;}
.map-link{display:inline-flex;align-items:center;gap:4px;font-size:0.68rem;color:var(--navy);background:var(--light);border:none;border-radius:20px;padding:4px 10px;cursor:pointer;text-decoration:none;margin-top:6px;}
.map-link:active{background:var(--gold);color:white;}
/* ── IMAGE BANK ──────────────────────────────────────────── */
.img-bank{margin-top:10px;padding-top:10px;border-top:1px solid #f0ece4;}
.img-bank-title{font-size:0.65rem;text-transform:uppercase;letter-spacing:0.5px;color:var(--gray);margin-bottom:6px;font-weight:600;}
.img-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px;}
.img-thumb{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;cursor:pointer;}
.img-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
.img-thumb .img-del{position:absolute;top:2px;right:2px;background:rgba(0,0,0,0.6);color:white;border:none;border-radius:50%;width:18px;height:18px;font-size:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .2s;}
.img-thumb:hover .img-del,.img-thumb:active .img-del{opacity:1;}
.img-thumb .img-cap{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,0.5);color:white;font-size:0.55rem;padding:2px 4px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.img-add-btn{display:flex;align-items:center;justify-content:center;gap:4px;width:100%;padding:7px;border:2px dashed #d0ccc0;border-radius:8px;background:none;color:var(--gray);font-size:0.72rem;cursor:pointer;transition:all .15s;}
.img-add-btn:active{border-color:var(--gold);color:var(--gold);}
/* ── IMAGE MODAL ─────────────────────────────────────────── */
.img-modal{position:fixed;inset:0;background:rgba(0,0,0,0.92);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;}
.img-modal img{max-width:100%;max-height:80vh;border-radius:10px;object-fit:contain;}
.img-modal-cap{color:rgba(255,255,255,0.7);font-size:0.75rem;margin-top:8px;text-align:center;}
.img-modal-cap[contenteditable=true]{outline:1px dashed rgba(255,255,255,0.3);padding:2px 8px;border-radius:4px;}
.img-modal-close{position:absolute;top:12px;right:16px;background:none;border:none;color:white;font-size:24px;cursor:pointer;}
.img-modal-del{background:#e05252;color:white;border:none;border-radius:8px;padding:8px 16px;font-size:0.78rem;margin-top:10px;cursor:pointer;}

.map-mini{display:inline-flex;align-items:center;gap:3px;font-size:0.62rem;color:#2166ac;text-decoration:none;background:#e8f4fd;border-radius:12px;padding:2px 7px;flex-shrink:0;}
.map-mini:active{background:#2166ac;color:white;}

/* ── CHECKLIST ───────────────────────────────────────── */
.cl-cat{margin-bottom:14px;}
.cl-cat h3{font-size:0.72rem;text-transform:uppercase;letter-spacing:1px;color:white;background:var(--navy);padding:6px 12px;border-radius:7px;margin-bottom:8px;}
.cl-item{display:flex;align-items:center;gap:10px;padding:10px 12px;background:white;border-radius:9px;margin-bottom:5px;box-shadow:0 1px 4px rgba(0,0,0,0.07);cursor:pointer;transition:background .2s;}
.cl-item.done{background:#f0faf5;}
.cl-check{width:20px;height:20px;border-radius:50%;border:2px solid #ddd;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s;}
.cl-item.done .cl-check{background:var(--green);border-color:var(--green);}
.cl-check::after{content:'✓';color:white;font-size:11px;display:none;}
.cl-item.done .cl-check::after{display:block;}
.cl-text{font-size:0.82rem;flex:1;}
.cl-item.done .cl-text{text-decoration:line-through;color:var(--gray);}
.cl-prog{background:white;border-radius:var(--radius);padding:14px;margin-bottom:14px;box-shadow:var(--shadow);text-align:center;}
.cl-prog .cnt{font-size:1.6rem;font-weight:700;font-family:Georgia,serif;color:var(--navy);}
.cl-prog .sub{font-size:0.72rem;color:var(--gray);}

/* ── SAVE TOAST ──────────────────────────────────────── */
.toast{position:fixed;bottom:24px;right:16px;background:var(--green);color:white;padding:7px 14px;border-radius:20px;font-size:0.7rem;font-weight:600;opacity:0;transition:opacity .3s;pointer-events:none;z-index:999;}
.toast.show{opacity:1;}
.section-title{font-family:Georgia,serif;font-size:1rem;color:var(--navy);margin-bottom:12px;font-weight:bold;}
/* ── PROGRAMME ───────────────────────────────────────── */
.prog-card{background:white;border-radius:var(--radius);margin-bottom:8px;box-shadow:var(--shadow);overflow:hidden;}
.prog-header{display:flex;align-items:center;gap:8px;padding:12px 14px;cursor:pointer;user-select:none;-webkit-user-select:none;}
.prog-header:active{background:#f9f6f0;}
.prog-jour{display:inline-block;background:var(--navy);color:var(--gold);font-size:0.62rem;font-weight:700;padding:2px 7px;border-radius:10px;flex-shrink:0;}
.prog-flag{font-size:1rem;flex-shrink:0;}
.prog-titre{font-family:Georgia,serif;font-weight:bold;font-size:0.9rem;color:var(--navy);flex:1;}
.prog-date{font-size:0.62rem;color:var(--gray);white-space:nowrap;}
.prog-arrow{font-size:0.9rem;color:var(--gold);flex-shrink:0;transition:transform .2s;}
.prog-body{padding:0 14px 12px;border-top:1px solid #f0ece4;animation:fadeIn .15s;}
.prog-item{display:flex;align-items:flex-start;gap:8px;padding:5px 0;border-bottom:1px solid #f8f5f0;}
.prog-item:last-child{border-bottom:none;}
.prog-time{font-size:0.65rem;color:var(--gold);font-weight:700;min-width:38px;padding-top:1px;flex-shrink:0;}
.prog-icon{font-size:0.85rem;flex-shrink:0;}
.prog-desc{font-size:0.78rem;color:#333;flex:1;line-height:1.35;}
.prog-hotel-tag{display:flex;align-items:center;gap:6px;margin-top:8px;padding:6px 10px;background:#fff9e6;border-radius:7px;border-left:3px solid var(--gold);font-size:0.75rem;color:var(--navy);font-weight:600;}
.prog-section-lbl{font-size:0.65rem;text-transform:uppercase;letter-spacing:0.5px;color:var(--gray);margin-top:8px;margin-bottom:2px;font-weight:600;}
.type-train{color:#1565c0;}
.type-avion{color:#e65100;}
.type-hotel{color:var(--green);}
.type-visit{color:#333;}
.type-food{color:#7b3f00;}
.type-info{color:var(--gray);}
/* ── VISITES PAR VILLE ───────────────────────────────── */
.vcard{background:white;border-radius:var(--radius);margin-bottom:12px;box-shadow:var(--shadow);overflow:hidden;}
.vcard-header{display:flex;align-items:center;gap:10px;padding:13px 14px;background:linear-gradient(135deg,var(--navy),var(--navy2));cursor:pointer;user-select:none;-webkit-user-select:none;}
.vcard-header:active{opacity:.85;}
.vcard-flag{font-size:1.3rem;flex-shrink:0;}
.vcard-info{flex:1;}
.vcard-city{font-family:Georgia,serif;font-weight:bold;font-size:1rem;color:var(--gold);}
.vcard-dates{font-size:0.62rem;color:rgba(255,255,255,0.5);margin-top:1px;}
.vcard-count{background:var(--gold);color:var(--navy);font-size:0.62rem;font-weight:800;padding:2px 7px;border-radius:10px;flex-shrink:0;}
.vcard-arrow{color:var(--gold);font-size:0.9rem;flex-shrink:0;transition:transform .2s;}
.vcard-body{padding:10px 14px 14px;}

.vitem{display:flex;align-items:flex-start;gap:8px;padding:8px 10px;border-radius:9px;margin-bottom:6px;background:var(--light);position:relative;transition:background .15s;}
.vitem:last-child{margin-bottom:0;}
.vitem-drag{color:#ccc;font-size:14px;cursor:grab;flex-shrink:0;padding-top:2px;touch-action:none;}
.vitem-drag:active{cursor:grabbing;}
.vitem-icon{font-size:1.1rem;flex-shrink:0;padding-top:1px;}
.vitem-body{flex:1;min-width:0;}
.vitem-nom{font-size:0.82rem;font-weight:600;color:var(--navy);outline:none;word-break:break-word;}
.vitem-nom:focus{background:#fff9e0;border-radius:4px;padding:0 2px;}
.vitem-desc{font-size:0.72rem;color:var(--gray);margin-top:3px;outline:none;word-break:break-word;line-height:1.4;}
.vitem-desc:focus{background:#fff9e0;border-radius:4px;padding:0 2px;}
.vitem-desc:empty::before{content:'Ajouter une note…';color:#bbb;}
.vitem-meta{display:flex;align-items:center;gap:6px;margin-top:5px;}
.vtag{display:inline-block;padding:1px 7px;border-radius:8px;font-size:0.6rem;font-weight:700;text-transform:uppercase;}
.vtag.must{background:#fde8e8;color:#c0392b;}
.vtag.opt{background:#e8f4fd;color:#2166ac;}
.vtag.food{background:#fef9e0;color:#9a6f00;}
.vtag.free{background:#e8faf0;color:#1e7e4f;}
.vitem-del{background:none;border:none;color:#ddd;font-size:13px;cursor:pointer;padding:2px 3px;flex-shrink:0;}
.vitem-del:active{color:var(--red);}
.vitem.done-v .vitem-nom{text-decoration:line-through;color:var(--gray);}
.vitem.done-v{opacity:.55;}
.vcheck{width:18px;height:18px;border-radius:50%;border:2px solid #ccc;flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:9px;color:white;transition:all .2s;margin-top:2px;}
.vcheck.checked{background:var(--green);border-color:var(--green);}

.vadd-btn{display:flex;align-items:center;justify-content:center;gap:5px;width:100%;padding:8px;border:2px dashed #d0ccc0;border-radius:9px;background:none;color:var(--gold);font-size:0.78rem;font-weight:600;cursor:pointer;margin-top:8px;transition:all .15s;}
.vadd-btn:active{background:var(--light);}

.vadd-form{background:#fffbe6;border-radius:9px;padding:10px;margin-top:8px;border:2px dashed var(--gold);display:none;}
.vadd-form.open{display:block;}
.vadd-form input,.vadd-form select,.vadd-form textarea{display:block;width:100%;padding:7px 9px;border:1px solid #ddd;border-radius:7px;font-size:0.78rem;margin-bottom:6px;background:white;font-family:-apple-system,sans-serif;}
.vadd-form textarea{resize:vertical;min-height:50px;}
.vadd-form input:focus,.vadd-form select:focus,.vadd-form textarea:focus{outline:none;border-color:var(--gold);}
.vtag-select{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;}
.vtag-opt{padding:4px 10px;border-radius:10px;font-size:0.68rem;font-weight:700;cursor:pointer;border:2px solid transparent;transition:all .15s;}
.vtag-opt.must{background:#fde8e8;color:#c0392b;}
.vtag-opt.opt{background:#e8f4fd;color:#2166ac;}
.vtag-opt.food{background:#fef9e0;color:#9a6f00;}
.vtag-opt.free{background:#e8faf0;color:#1e7e4f;}
.vtag-opt.sel{border-color:currentColor;box-shadow:0 0 0 1px currentColor;}
.vcard-prog{height:4px;background:#f0ece4;margin:0 14px 10px;border-radius:2px;overflow:hidden;}
.vcard-prog-fill{height:100%;background:var(--green);border-radius:2px;transition:width .3s;}
/* ── EXPORT PDF ──────────────────────────────────────── */
.export-fab{position:fixed;bottom:20px;right:16px;z-index:500;background:var(--navy);color:var(--gold);border:none;border-radius:50px;padding:10px 16px;font-size:0.78rem;font-weight:700;box-shadow:0 4px 16px rgba(0,0,0,0.3);cursor:pointer;display:flex;align-items:center;gap:6px;}
.export-fab:active{transform:scale(0.95);}
.pdf-modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:800;display:flex;align-items:flex-end;}
.pdf-modal{background:white;border-radius:20px 20px 0 0;width:100%;padding:20px;max-height:90vh;overflow-y:auto;}
.pdf-modal h2{font-family:Georgia,serif;font-size:1.1rem;color:var(--navy);margin-bottom:4px;}
.pdf-modal .sub{font-size:0.72rem;color:var(--gray);margin-bottom:16px;}
.pdf-section-toggle{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid #f0ece4;}
.pdf-section-toggle label{font-size:0.82rem;font-weight:600;color:#333;cursor:pointer;flex:1;}
.pdf-section-toggle input[type=checkbox]{width:18px;height:18px;accent-color:var(--navy);cursor:pointer;}
.pdf-launch{display:block;width:100%;padding:14px;background:var(--navy);color:var(--gold);border:none;border-radius:12px;font-size:0.9rem;font-weight:700;cursor:pointer;margin-top:16px;text-align:center;}
.pdf-launch:active{opacity:0.85;}
.pdf-tip{font-size:0.68rem;color:var(--gray);text-align:center;margin-top:8px;line-height:1.5;}

/* ── RENDU IMPRESSION ────────────────────────────────── */
@media print {
  *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important;}
  body{background:white!important;padding:0!important;font-family:Georgia,serif;}
  .header,.tabs,.content,.export-fab,.pdf-modal-bg{display:none!important;}
  #pdf-render{display:block!important;}
  .pdf-page{page-break-after:always;padding:20mm 18mm;min-height:100vh;position:relative;}
  .pdf-page:last-child{page-break-after:avoid;}
  .pdf-cover{background:linear-gradient(160deg,#16213e 0%,#0f3460 100%)!important;color:white;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:100vh;}
  .pdf-cover h1{font-size:2.4rem;color:#c9a84c;margin-bottom:8px;}
  .pdf-cover .sub{color:rgba(255,255,255,0.7);font-size:1rem;}
  .pdf-cover .route{color:rgba(255,255,255,0.5);font-size:0.8rem;margin-top:16px;}
  .pdf-section-header{border-bottom:3px solid #16213e;padding-bottom:6px;margin-bottom:14px;margin-top:0;}
  .pdf-section-header h2{font-size:1.3rem;color:#16213e;margin:0;}
  .pdf-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:10px;}
  .pdf-card{border:1px solid #e0ddd8;border-radius:8px;padding:10px;break-inside:avoid;}
  .pdf-card h3{font-size:0.85rem;color:#16213e;margin-bottom:4px;border-bottom:1px solid #f0ece4;padding-bottom:4px;}
  .pdf-card p{font-size:0.72rem;color:#555;margin:2px 0;line-height:1.4;}
  .pdf-card .badge{display:inline-block;padding:1px 6px;border-radius:6px;font-size:0.6rem;font-weight:700;background:#e3f2fd;color:#1565c0;margin-bottom:4px;}
  .pdf-table{width:100%;border-collapse:collapse;font-size:0.68rem;margin-bottom:12px;}
  .pdf-table th{background:#16213e!important;color:#c9a84c;padding:5px 7px;text-align:left;}
  .pdf-table td{padding:4px 7px;border-bottom:1px solid #f0ece4;}
  .pdf-table tr.sejour td{background:#f0f5ff!important;}
  .pdf-day-header{background:#f8f5f0!important;padding:6px 10px;border-left:4px solid #c9a84c;margin-bottom:6px;break-inside:avoid;break-before:auto;}
  .pdf-day-header h3{font-size:0.9rem;color:#16213e;margin:0;}
  .pdf-day-header .dt{font-size:0.65rem;color:#888;}
  .pdf-visit-item{padding:3px 0;font-size:0.72rem;color:#333;border-bottom:1px solid #f8f5f0;}
  .pdf-visit-tag{display:inline-block;padding:0 5px;border-radius:5px;font-size:0.58rem;font-weight:700;margin-right:4px;}
  .pdf-must{background:#fde8e8!important;color:#c0392b;}
  .pdf-opt{background:#e8f4fd!important;color:#2166ac;}
  .pdf-food{background:#fef9e0!important;color:#9a6f00;}
  .pdf-free{background:#e8faf0!important;color:#1e7e4f;}
  .pdf-img-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px;}
  .pdf-img-grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:5px;}
  .pdf-img-cap{font-size:0.55rem;color:#888;text-align:center;margin-top:2px;}
  .pdf-checklist-item{display:flex;align-items:center;gap:6px;font-size:0.72rem;padding:3px 0;break-inside:avoid;}
  .pdf-check-box{width:12px;height:12px;border:1.5px solid #888;border-radius:3px;flex-shrink:0;}
  .pdf-check-box.done{background:#2d9e6b!important;border-color:#2d9e6b;}
  .pdf-stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px;}
  .pdf-stat{border:1px solid #e0ddd8;border-radius:8px;padding:10px;text-align:center;}
  .pdf-stat .val{font-size:1.4rem;font-weight:700;color:#16213e;}
  .pdf-stat .lbl{font-size:0.65rem;color:#888;}
}
#pdf-render{display:none;}

/* ══════════ SÉLECTEUR DE VOYAGE ══════════ */
.mode-switch{display:flex;gap:6px;justify-content:center;margin:0 0 10px;}
.mode-btn{border:1px solid rgba(201,168,76,0.45);background:transparent;color:rgba(255,255,255,0.65);font-size:0.72rem;font-weight:700;padding:6px 14px;border-radius:20px;cursor:pointer;}
.mode-btn.active{background:var(--gold);color:var(--navy);border-color:var(--gold);}
.archive-banner{background:#e8f5ee;border:1px solid #b7e0c8;color:#1e6b46;border-radius:var(--radius);padding:10px 12px;font-size:0.78rem;margin-bottom:12px;line-height:1.4;}

/* ══════════ VOYAGE 2027 ══════════ */
#app27{padding:14px;padding-bottom:90px;}
.s27{display:none;animation:fadeIn .2s;}
.s27.active{display:block;}
.t27{padding:10px 14px;font-size:0.75rem;font-weight:600;white-space:nowrap;cursor:pointer;color:rgba(255,255,255,0.5);border-bottom:3px solid transparent;flex-shrink:0;}
.t27.active{color:var(--gold);border-bottom-color:var(--gold);}

.v-sum{background:white;border-radius:var(--radius);box-shadow:var(--shadow);padding:12px 14px;margin-bottom:10px;}
.v-sum-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;}
.v-sum-big{font-family:Georgia,serif;font-size:1.25rem;font-weight:700;color:var(--navy);}
.v-sum-small{font-size:0.7rem;color:var(--gray);}
.v-bar{height:6px;background:#eee;border-radius:3px;overflow:hidden;margin-top:8px;display:flex;}
.v-bar span{display:block;height:100%;}
.v-bar .b-paid{background:var(--green);}
.v-bar .b-booked{background:#e0a92e;}

.v-filters{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px;scrollbar-width:none;}
.v-filters::-webkit-scrollbar{display:none;}
.v-chip{border:1px solid #ddd;background:white;color:#555;font-size:0.72rem;font-weight:600;padding:6px 12px;border-radius:16px;white-space:nowrap;cursor:pointer;}
.v-chip.on{background:var(--navy);color:var(--gold);border-color:var(--navy);}

.v-card{background:white;border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:8px;padding:12px 12px 12px 14px;display:flex;gap:10px;align-items:flex-start;cursor:pointer;border-left:4px solid #ddd;}
.v-card:active{background:#faf8f3;}
.v-card.todo{border-left-color:var(--red);}
.v-card.booked{border-left-color:#e0a92e;}
.v-card.paid{border-left-color:var(--green);}
.v-card-ico{font-size:1.2rem;line-height:1.2;flex-shrink:0;}
.v-card-main{flex:1;min-width:0;}
.v-card-title{font-weight:700;font-size:0.88rem;color:var(--navy);word-break:break-word;}
.v-card-sub{font-size:0.72rem;color:#666;margin-top:2px;line-height:1.35;word-break:break-word;}
.v-card-hint{font-size:0.68rem;color:var(--gray);font-style:italic;margin-top:4px;line-height:1.35;}
.v-card-side{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0;}
.v-price{font-weight:700;font-size:0.9rem;color:var(--navy);white-space:nowrap;}
.v-price.est{color:var(--gray);font-weight:600;font-size:0.78rem;}
.v-status{border:none;font-size:0.64rem;font-weight:800;padding:4px 9px;border-radius:12px;cursor:pointer;white-space:nowrap;}
.v-status.todo{background:#fdecea;color:var(--red);}
.v-status.booked{background:#fff4d6;color:#a06d00;}
.v-status.paid{background:#d4edda;color:var(--green);}
.v-empty{text-align:center;color:var(--gray);font-size:0.8rem;padding:24px 10px;}

.v-fab{position:fixed;right:16px;bottom:20px;z-index:500;background:var(--gold);color:var(--navy);border:none;border-radius:50px;padding:13px 18px;font-size:0.85rem;font-weight:800;box-shadow:0 4px 16px rgba(0,0,0,0.25);cursor:pointer;}
.v-fab:active{transform:scale(0.95);}

/* Programme */
.v-day{background:white;border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:8px;overflow:hidden;}
.v-day-h{display:flex;align-items:center;gap:8px;padding:11px 12px;cursor:pointer;}
.v-day-d{background:var(--navy);color:var(--gold);font-size:0.62rem;font-weight:800;padding:3px 7px;border-radius:9px;white-space:nowrap;flex-shrink:0;}
.v-day-t{font-family:Georgia,serif;font-weight:700;font-size:0.88rem;color:var(--navy);flex:1;}
.v-day-dots{display:flex;gap:3px;flex-shrink:0;}
.v-day-dots i{width:7px;height:7px;border-radius:50%;display:block;}
.v-day-b{padding:0 12px 12px;border-top:1px solid #f0ece4;}
.v-day-plan{font-size:0.78rem;color:#333;line-height:1.45;padding:8px 0;white-space:pre-wrap;}
.v-day-item{display:flex;align-items:center;gap:8px;padding:7px 9px;background:var(--light);border-radius:8px;margin-bottom:5px;font-size:0.76rem;cursor:pointer;}
.v-day-item .x{flex:1;min-width:0;}
.v-day-item .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.v-day-edit{background:none;border:1px dashed #d0ccc0;border-radius:8px;color:var(--gold);font-size:0.72rem;font-weight:700;padding:6px 10px;cursor:pointer;margin-top:4px;}
.dot.todo,.v-day-dots i.todo{background:var(--red);}
.dot.booked,.v-day-dots i.booked{background:#e0a92e;}
.dot.paid,.v-day-dots i.paid{background:var(--green);}

/* Budget */
.v-tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;}
.v-tile{background:white;border-radius:var(--radius);box-shadow:var(--shadow);padding:12px;text-align:center;}
.v-tile .a{font-family:Georgia,serif;font-size:1.2rem;font-weight:700;color:var(--navy);}
.v-tile .l{font-size:0.66rem;color:var(--gray);margin-top:2px;}
.v-tile.g .a{color:var(--green);}
.v-tile.r .a{color:var(--red);}
.v-btable{width:100%;border-collapse:collapse;background:white;border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);margin-bottom:10px;}
.v-btable th{background:var(--navy);color:var(--gold);font-size:0.66rem;padding:8px;text-align:right;}
.v-btable th:first-child,.v-btable td:first-child{text-align:left;}
.v-btable td{font-size:0.76rem;padding:8px;border-bottom:1px solid #f0ece4;text-align:right;}
.v-btable tr.tot td{font-weight:800;background:var(--light);}
.v-obj{display:flex;align-items:center;gap:8px;font-size:0.78rem;color:#555;}
.v-obj input{width:100px;}

/* Checklist */
.v-cl-cat{font-size:0.7rem;text-transform:uppercase;letter-spacing:1px;color:white;background:var(--navy);padding:6px 12px;border-radius:7px;margin:12px 0 6px;}
.v-cl{display:flex;align-items:center;gap:10px;background:white;border-radius:9px;padding:11px 12px;margin-bottom:5px;box-shadow:0 1px 4px rgba(0,0,0,0.07);cursor:pointer;}
.v-cl .c{width:20px;height:20px;border-radius:50%;border:2px solid #ddd;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:white;font-size:11px;}
.v-cl.done .c{background:var(--green);border-color:var(--green);}
.v-cl .t{flex:1;font-size:0.82rem;}
.v-cl.done .t{text-decoration:line-through;color:var(--gray);}
.v-cl .del{background:none;border:none;color:#ccc;font-size:14px;cursor:pointer;padding:2px 4px;}
.v-cl-add{display:flex;gap:6px;margin-top:6px;}
.v-cl-add input{flex:1;}

/* Données */
.v-box{background:white;border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;margin-bottom:10px;}
.v-box h3{font-family:Georgia,serif;font-size:0.92rem;color:var(--navy);margin-bottom:6px;}
.v-box p{font-size:0.76rem;color:#555;line-height:1.45;margin-bottom:10px;}
.v-btn{display:block;width:100%;padding:12px;border:none;border-radius:10px;font-size:0.85rem;font-weight:700;cursor:pointer;margin-bottom:8px;background:var(--navy);color:var(--gold);}
.v-btn.sec{background:var(--light);color:var(--navy);}
.v-btn.danger{background:#fdecea;color:var(--red);}

/* Formulaires (16px = pas de zoom auto sur iPhone) */
.v-in{width:100%;padding:10px 11px;border:1px solid #ddd;border-radius:9px;font-size:16px;background:white;font-family:-apple-system,'Helvetica Neue',sans-serif;color:#1a1a2e;}
.v-in:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 2px rgba(201,168,76,0.25);}
textarea.v-in{min-height:70px;resize:vertical;}

/* Panneau d'édition */
.v-sheet-bg{position:fixed;inset:0;background:rgba(10,15,30,0.55);z-index:1000;display:flex;align-items:flex-end;justify-content:center;}
.v-sheet{background:var(--cream);width:100%;max-width:640px;max-height:90vh;overflow-y:auto;border-radius:18px 18px 0 0;padding:8px 16px calc(16px + env(safe-area-inset-bottom));animation:sheetUp .2s ease-out;}
@keyframes sheetUp{from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1}}
.v-grab{width:40px;height:4px;background:#ccc;border-radius:2px;margin:4px auto 10px;}
.v-sheet h2{font-family:Georgia,serif;font-size:1.05rem;color:var(--navy);margin-bottom:10px;}
.v-hint{background:#fff8e6;border-left:3px solid var(--gold);border-radius:7px;padding:8px 10px;font-size:0.74rem;color:#5a4a1a;margin-bottom:12px;line-height:1.4;}
.v-f{margin-bottom:10px;}
.v-f label{display:block;font-size:0.66rem;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;color:var(--gray);margin-bottom:4px;}
.v-f2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.v-seg{display:flex;background:white;border:1px solid #ddd;border-radius:10px;overflow:hidden;}
.v-seg button{flex:1;border:none;background:none;padding:10px 4px;font-size:0.76rem;font-weight:700;color:#777;cursor:pointer;}
.v-seg button.on.todo{background:#fdecea;color:var(--red);}
.v-seg button.on.booked{background:#fff4d6;color:#a06d00;}
.v-seg button.on.paid{background:#d4edda;color:var(--green);}
.v-actions{display:flex;gap:8px;margin-top:6px;position:sticky;bottom:0;background:var(--cream);padding-top:8px;}
.v-actions .v-btn{margin-bottom:0;}
.v-link{display:inline-block;margin-top:5px;font-size:0.72rem;color:var(--blue);}
.v-toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--green);color:white;padding:7px 14px;border-radius:20px;font-size:0.72rem;font-weight:700;opacity:0;transition:opacity .3s;pointer-events:none;z-index:1100;}
.v-toast.show{opacity:1;}
.v-price small{font-size:0.62rem;font-weight:600;color:var(--gray);margin-left:2px;}
.v-ptag{font-size:0.6rem;color:var(--gray);white-space:nowrap;}
.v-seg2 button.on{background:var(--navy);color:var(--gold);}
.v-perslist{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
.v-pers{display:inline-flex;align-items:center;gap:4px;background:var(--light);border-radius:14px;padding:5px 10px;font-size:0.76rem;font-weight:600;color:var(--navy);}
.v-pers button{border:none;background:none;color:#aaa;font-size:0.72rem;cursor:pointer;padding:0 0 0 2px;}



.hdr-brand{display:flex;align-items:center;justify-content:center;gap:10px;}
.hdr-logo{width:44px;height:44px;border-radius:11px;object-fit:cover;box-shadow:0 2px 8px rgba(0,0,0,0.35);flex-shrink:0;}
.hdr-brand-txt{text-align:left;}
.hdr-brand-txt h1{text-align:left;}
.hdr-brand-txt .sub{text-align:left;margin:2px 0 0;}
.header .mode-switch{margin-top:10px;}

/* ══════════ CARNET PARTAGÉ ══════════ */
.hdr-brand{position:relative;padding:0 44px;}
.cv-me{position:absolute;right:0;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:50%;border:2px solid rgba(255,255,255,.85);color:#fff;font-weight:800;font-size:1rem;cursor:pointer;background:#777;padding:0;}
.cv-me .sd{position:absolute;right:-3px;bottom:-3px;width:12px;height:12px;border-radius:50%;border:2px solid var(--navy);}
.sd.off{display:none}.sd.ok{background:#3ecf8e}.sd.wait{background:#f5b041}.sd.err{background:#e74c3c}
.cv-trips{overflow-x:auto;justify-content:flex-start;flex-wrap:nowrap;scrollbar-width:none;padding-bottom:2px;}
.cv-trips::-webkit-scrollbar{display:none}
.cv-trips .mode-btn{white-space:nowrap;flex-shrink:0}
.mode-btn.add{border-style:dashed;color:var(--gold)}
#appC{padding:14px;padding-bottom:90px;}
#appC .v-sheet, .v-sheet{scroll-padding-bottom:80px}
.cv-lbl{font-size:.66rem;font-weight:700;color:var(--gray);text-transform:uppercase;letter-spacing:.5px;align-self:center;white-space:nowrap;margin-right:2px}
.v-chip.cv-pc{border-color:color-mix(in srgb,var(--pc) 45%,white);color:var(--pc)}
.v-chip.cv-pc.on{background:var(--pc);color:#fff;border-color:var(--pc)}
.cv-ini{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;color:#fff;font-size:.58rem;font-weight:800;border:1.5px solid #fff;flex-shrink:0;}
.ins{display:inline-flex}.ins .cv-ini+.cv-ini{margin-left:-5px}
.cv-qui-in{display:inline-flex;margin-left:6px;vertical-align:middle}.cv-qui-in .cv-ini+.cv-ini{margin-left:-5px}
.cv-pchip{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:14px;font-size:.76rem;font-weight:700;background:color-mix(in srgb,var(--pc) 13%,white);color:var(--pc);border:1px solid color-mix(in srgb,var(--pc) 35%,white);white-space:nowrap}
.cv-pchip::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--pc);flex-shrink:0}
.cv-pchip button{border:none;background:none;color:inherit;opacity:.6;font-size:.72rem;cursor:pointer;padding:0 0 0 2px}
.cv-by{font-size:.63rem;color:var(--gray);margin-top:5px;line-height:1.35}
.cv-by b{font-weight:700}
.v-sheet > .cv-by{margin:-6px 0 10px}
.cv-qui{display:flex;align-items:center;gap:6px;margin-top:5px;font-size:.68rem;color:#555;font-weight:600}
.cv-qsel{display:flex;flex-wrap:wrap;gap:6px}
.cv-qsel button{border:1px dashed #ccc;background:#fff;color:#999;font-size:.8rem;font-weight:700;padding:8px 12px;border-radius:18px;cursor:pointer}
.cv-qsel button.on{border:1px solid var(--pc);background:var(--pc);color:#fff}
.cv-qsel button.on::before{content:'✓ '}
.cv-nbadge{font-size:.62rem;font-weight:700;background:#fff4c9;color:#8a6d00;border-radius:8px;padding:1px 5px;white-space:nowrap}
.cv-pinline{font-size:.7rem;color:#5a4a1a;background:#fff8dc;border-left:3px solid var(--pc);border-radius:6px;padding:4px 7px;margin-top:5px;line-height:1.35;word-break:break-word}
.cv-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.cv-row .v-in{flex:1}
.cv-sq{flex:0 0 auto!important;width:auto!important;padding:12px 14px!important;margin:0!important}
/* Notes */
.cv-note{background:#fffdf6;border-radius:10px;padding:10px 12px;margin-bottom:8px;box-shadow:0 1px 4px rgba(0,0,0,.08);border-left:4px solid var(--pc)}
.cv-note.pin{background:#fff6cf}
.cv-note.compact{padding:8px 10px;margin:6px 0;box-shadow:none;border:1px solid #f0e6c0;border-left:4px solid var(--pc)}
.cv-note-h{display:flex;align-items:center;gap:6px}
.cv-note-ref{flex:1;font-size:.68rem;font-weight:700;color:var(--navy);cursor:pointer}
.cv-note-ref.s{font-weight:600;color:var(--gray);margin-top:3px;cursor:default}
.cv-note.compact .cv-note-h{float:right;margin-left:6px}
.cv-pinbtn{border:none;background:none;font-size:.95rem;cursor:pointer;filter:grayscale(1);opacity:.35;padding:0 2px}
.cv-pinbtn.on{filter:none;opacity:1}
.cv-note-t{font-size:.82rem;color:#2a2a2a;line-height:1.45;white-space:pre-wrap;word-break:break-word;cursor:pointer;margin-top:2px}
.cv-pinboard{background:#fff2b8;border-radius:var(--radius);padding:10px 10px 4px;margin-bottom:10px;box-shadow:var(--shadow)}
.cv-pinboard-h{font-size:.7rem;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:#7a5d00;margin-bottom:2px}
.cv-pinboard .cv-note{background:#fffbe6}
/* Budget par personne */
.cv-pbud{padding:8px 0;border-top:1px solid #f0ece4}
.cv-pbud:first-of-type{margin-top:8px}
.cv-pbud-h{display:flex;justify-content:space-between;align-items:center;font-size:.9rem;color:var(--navy)}
/* Profils */
.cv-plist{display:flex;flex-direction:column;gap:6px}
.cv-prow{display:flex;justify-content:space-between;align-items:center;background:#fff;border:1px solid #eee;border-radius:10px;padding:10px 12px;cursor:pointer;font-size:.74rem;color:var(--gray)}
.cv-prow.me{border-color:var(--gold);background:#fffaf0}
.cv-colors{display:flex;gap:9px;flex-wrap:wrap}
.cv-sw{width:36px;height:36px;border-radius:50%;border:3px solid #fff;cursor:pointer;box-shadow:0 0 0 1px #ddd;padding:0}
.cv-sw.on{box-shadow:0 0 0 3px var(--navy)}
.cv-sw-custom{display:flex;align-items:center;justify-content:center;background:#fff;position:relative;overflow:hidden;font-size:1rem}
.cv-sw-custom input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.cv-checkline{display:flex;gap:8px;align-items:center;font-size:.82rem;margin:4px 0 10px}
.cv-code{font-family:ui-monospace,Menlo,monospace;letter-spacing:1px}
.cv-act{display:flex;gap:8px;align-items:flex-start;font-size:.76rem;padding:6px 0;border-top:1px solid #f3efe6;line-height:1.35}
.cv-act:first-of-type{border-top:none}
.cv-act-w,.cv-act-t{font-size:.64rem;color:var(--gray)}
.cv-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;margin-top:4px;display:inline-block}
/* Envies */
.cv-wish{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:9px;padding:12px 12px 10px 14px;border-left:5px solid var(--pc)}
.cv-wish.done{opacity:.6}
.cv-wish-k{font-size:.64rem;font-weight:700;color:var(--gray);text-transform:uppercase;letter-spacing:.5px}
.cv-wish-t{font-family:Georgia,serif;font-weight:700;font-size:1rem;color:var(--navy);margin:2px 0}
.cv-wish-n{font-size:.76rem;color:#444;margin-top:6px;white-space:pre-wrap;line-height:1.4}
.cv-dep{font-size:.72rem;color:#444;display:flex;align-items:center;gap:6px;margin-top:4px}
.cv-wish-a{display:flex;align-items:center;gap:8px;margin-top:8px;padding-top:8px;border-top:1px solid #f3efe6}
.cv-like{border:1px solid #f3c6d8;background:#fff;color:#c2185b;font-size:.72rem;font-weight:700;padding:5px 10px;border-radius:14px;cursor:pointer}
.cv-like.on{background:#fde4ee}
.cv-deprow{display:grid;grid-template-columns:auto 1fr 1fr;gap:6px;align-items:center;margin-bottom:6px}
.cv-deprow .v-in{padding:8px 9px}
.cv-seg-big .v-seg button{padding:12px 4px;font-size:.82rem}
.cv-seg-big{margin-bottom:12px}
#cv-ob-new,#cv-ob-join{margin-top:4px}
/* Paiement */
.cv-paybox{background:#fff;border:1px solid #ece6d6;border-radius:12px;padding:10px 12px;margin:4px 0 12px}
.cv-paybox-h{font-family:Georgia,serif;font-weight:700;color:var(--navy);font-size:.92rem;margin-bottom:8px}
.cv-paybox .v-seg{flex-wrap:wrap}
.cv-paybox .v-seg button{flex:1 0 auto;font-size:.72rem;padding:9px 6px}
.cv-live{background:var(--light);border-radius:9px;padding:8px 10px;margin:0 0 10px;font-size:.76rem;color:#333;line-height:1.45}
.cv-live:empty{display:none}
.cv-live-t span{color:var(--gray);font-size:.7rem}
.cv-live-r{display:flex;flex-wrap:wrap;gap:8px;margin-top:5px;align-items:center}
.cv-live-r>span{display:inline-flex;align-items:center;gap:5px;font-size:.78rem}
.cv-live-s{margin-top:5px;font-size:.72rem}
.cv-amts{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.cv-amts label{display:grid;grid-template-columns:1fr 110px;align-items:center;gap:8px}
.cv-num{width:72px!important;flex:0 0 72px!important;text-align:center}
.cv-month{width:150px!important;flex:0 0 150px!important}
.cv-x{border:none;background:#f3efe6;color:#888;border-radius:8px;padding:7px 9px;cursor:pointer;font-size:.8rem}
.cv-echrow{display:grid;grid-template-columns:1.25fr 1fr auto auto;gap:6px;align-items:center;margin-bottom:6px}
.cv-echrow .v-in{padding:8px}
.cv-echok{font-size:.7rem;display:flex;align-items:center;gap:3px;color:#555;white-space:nowrap}
.cv-payline{font-size:.68rem;color:#555;margin-top:5px;line-height:1.5}
.cv-links{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.cv-links a{font-size:.66rem;font-weight:700;color:var(--navy);background:var(--light);border-radius:12px;padding:4px 9px;text-decoration:none;white-space:nowrap}
.cv-links.big{margin:-4px 0 12px}
.cv-links.big a{font-size:.76rem;padding:7px 12px;background:#fff;border:1px solid #e3dccb}
.cv-bal{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;padding:7px 0;border-top:1px solid #f0ece4;font-size:.74rem;color:#555}
.cv-bal:first-of-type{margin-top:8px}
.cv-settle{background:#eef6f1;border-radius:9px;padding:9px 11px;margin-top:8px;font-size:.8rem;line-height:1.6}
/* Échéancier */
.cv-echm{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:11px 12px;margin-bottom:9px}
.cv-echm.now{box-shadow:0 0 0 2px var(--gold),var(--shadow)}
.cv-echm.late{box-shadow:0 0 0 2px var(--red),var(--shadow)}
.cv-echm-h{display:flex;justify-content:space-between;align-items:baseline;font-family:Georgia,serif;font-weight:700;color:var(--navy);font-size:.92rem}
.cv-echm .cv-live-r{margin:4px 0 6px}
.cv-echi{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid #f3efe6;font-size:.78rem}
.cv-echi input{width:18px;height:18px;flex-shrink:0}
.cv-echi .x{flex:1;cursor:pointer;min-width:0}
.cv-echi .x small{display:block;font-size:.64rem;color:var(--gray)}
.cv-echi.done{color:var(--gray)}.cv-echi.done .x{text-decoration:line-through}
/* Itinéraire du jour */
.cv-place{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid #eee;border-radius:9px;padding:8px 9px;margin-bottom:5px;font-size:.82rem}
.cv-place .n{width:22px;height:22px;border-radius:50%;background:var(--navy);color:var(--gold);font-size:.68rem;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.cv-place .x{flex:1;min-width:0}
.cv-place .x small{display:block;color:var(--gray);font-size:.64rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cv-place a{text-decoration:none}
.cv-by.s{margin-top:1px;font-size:.6rem}
.cv-route{background:#fff;border-radius:12px;border:1px solid #e3dccb;padding:12px;margin-top:12px}
.cv-stop{font-size:.84rem;color:var(--navy);padding:4px 0 4px 2px}
.cv-stop b{display:inline-flex;width:20px;height:20px;border-radius:50%;background:var(--navy);color:var(--gold);font-size:.64rem;align-items:center;justify-content:center;margin-right:4px}
.cv-stop.s{font-weight:700}
.cv-leg{display:block;margin:2px 0 2px 9px;padding:5px 0 5px 14px;border-left:3px dotted #cfc6ae;font-size:.72rem;color:#555;text-decoration:none}
.cv-leg span{color:var(--gray)}
.cv-route-sum{font-size:.76rem;font-weight:700;color:var(--navy);margin:8px 0 4px}
.cv-gm{display:inline-block;margin-top:6px;margin-right:6px;font-size:.74rem;font-weight:700;color:#fff;background:#1a73e8;border-radius:16px;padding:7px 12px;text-decoration:none}
.cv-route-mini{background:#f4f8ff;border:1px solid #dbe6fb;border-radius:9px;padding:8px 10px;margin:6px 0;font-size:.74rem;color:#333;line-height:1.5}
.cv-route-mini b{display:inline-flex;width:17px;height:17px;border-radius:50%;background:var(--navy);color:var(--gold);font-size:.6rem;align-items:center;justify-content:center}
.cv-route-load{padding:12px;text-align:center;font-size:.8rem;color:var(--navy)}
/* Assistant */
.wz-steps{display:flex;align-items:center;margin:2px 0 10px}
.wz-steps span{width:26px;height:26px;border-radius:50%;background:#e8e3d6;color:#888;font-size:.72rem;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.wz-steps span.on{background:var(--navy);color:var(--gold)}
.wz-steps span.done{background:var(--green);color:#fff}
.wz-steps i{flex:1;height:2px;background:#e8e3d6}
.wz-title{font-family:Georgia,serif;font-weight:700;font-size:1rem;color:var(--navy);margin-bottom:10px}
.wz-et{display:grid;grid-template-columns:22px 1fr 56px auto;gap:6px;align-items:center;margin-bottom:6px}
.wz-et .n{width:22px;height:22px;border-radius:50%;background:var(--navy);color:var(--gold);font-size:.66rem;font-weight:800;display:flex;align-items:center;justify-content:center}
.wz-et .cv-num{width:56px!important;flex:none!important;padding:9px 4px}
.wz-et select{grid-column:2 / 4}
.wz-et .wz-btns{grid-column:4;grid-row:1 / 3;display:flex;flex-direction:column;gap:4px}
.wz-et > .v-sum-small{display:none}
.wz-recap{background:#fff;border-radius:10px;border:1px solid #ece6d6;padding:10px 12px;margin-bottom:12px;font-size:.84rem;line-height:1.6}
.wz-recap ol{margin:6px 0 0 18px;font-size:.8rem}

/* ═════════════════════════════════════════════════════════
   THÈME « RIVIERA AU COUCHANT »
   Nuit prune · coucher de soleil · champagne · perle rosée
═════════════════════════════════════════════════════════ */
:root{
  --navy:#2A1238; --navy2:#4A1A4F; --gold:#F3C98B; --gold2:#FFD9A0;
  --cream:#FFF4F1; --light:#FBE9E6; --gray:#8F7A90; --white:#fff;
  --green:#14A08C; --red:#EC4D6E; --blue:#7A4FE0; --amber:#E89A2C;
  --ink:#2B1A35; --sun1:#FFA06B; --sun2:#F2557F; --sun3:#9D4EDD;
  --sunset:linear-gradient(120deg,var(--sun1),var(--sun2) 55%,var(--sun3));
  --radius:20px;
  --shadow:0 10px 30px -14px rgba(74,26,79,.35), 0 2px 6px -2px rgba(74,26,79,.08);
  --display:'Bodoni Moda', 'Didot', 'Bodoni 72', Georgia, serif;
  --ui:'Outfit', -apple-system, 'Helvetica Neue', sans-serif;
}
html{background:var(--navy)}
body{font-family:var(--ui);background:var(--cream);color:var(--ink);font-size:15px;padding-bottom:0;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:var(--ui)}
:focus-visible{outline:2px solid var(--sun2);outline-offset:2px}

/* ── Hero ── */
.header{position:relative;top:auto;padding:0;background:var(--navy);z-index:5}
.hero{position:relative;overflow:hidden;padding:calc(14px + env(safe-area-inset-top)) 20px 22px;
  background:radial-gradient(120% 90% at 85% 115%, rgba(242,85,127,.95) 0%, rgba(157,78,221,.55) 38%, transparent 70%),
             linear-gradient(180deg,#1E0C2A 0%, #3A1547 60%, #6B1F5C 100%);
  border-radius:0 0 34px 34px}
.hero-sun{position:absolute;right:-60px;bottom:-110px;width:260px;height:260px;border-radius:50%;
  background:radial-gradient(circle at 50% 40%, #FFE2B0 0%, #FFA06B 35%, rgba(242,85,127,.0) 70%);opacity:.75;pointer-events:none}
@media (prefers-reduced-motion:no-preference){ .hero-sun{animation:sunrise 1.6s cubic-bezier(.2,.7,.2,1) both} }
@keyframes sunrise{from{transform:translateY(70px);opacity:0}to{transform:translateY(0);opacity:.75}}
.hero-top{position:relative;display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
.trip-pill{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);
  color:#fff;border-radius:30px;padding:5px 14px 5px 5px;font-size:.82rem;font-weight:600;cursor:pointer;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.trip-pill .hdr-logo{width:30px;height:30px;border-radius:50%;box-shadow:none}
.trip-pill em{font-style:normal;opacity:.7;font-size:.7rem}
.cv-switch{display:flex;align-items:center;height:38px;padding:0 12px;border-radius:20px;background:rgba(255,255,255,.16);border:1.5px solid rgba(255,255,255,.6);color:#fff;font-weight:800;font-size:.82rem;text-decoration:none;backdrop-filter:blur(6px)}
.header .cv-me{position:relative;right:auto;top:auto;transform:none;width:38px;height:38px;border:2px solid rgba(255,255,255,.9);box-shadow:0 4px 14px rgba(0,0,0,.25)}
.header h1,#hdr-title{position:relative;font-family:var(--display);font-style:italic;font-weight:500;font-size:2.45rem;line-height:1.02;
  color:#fff;text-align:left;letter-spacing:-.5px;max-width:15ch;text-wrap:balance}
.header .sub,#hdr-sub{position:relative;font-size:.86rem;color:rgba(255,236,226,.82);text-align:left;margin:10px 0 0;line-height:1.4;max-width:34ch}
.hero-foot{position:relative;display:flex;justify-content:space-between;align-items:flex-end;margin-top:18px;min-height:40px}
.cv-avs{display:flex;align-items:center}
.cv-av{width:30px;height:30px;border-radius:50%;color:#fff;font-weight:700;font-size:.8rem;display:inline-flex;align-items:center;justify-content:center;border:2px solid #3A1547;margin-right:-8px}
.cv-av-names{margin-left:16px;color:rgba(255,255,255,.85);font-size:.8rem;font-weight:500}
.hero-count{text-align:right;color:#fff;line-height:1}
.hero-count b{display:block;font-family:var(--display);font-style:italic;font-weight:600;font-size:2.1rem;color:var(--gold2)}
.hero-count span{font-size:.72rem;color:rgba(255,236,226,.8)}
body.is-legacy .hero{border-radius:0}
.header .tabs{background:var(--navy);padding:0 8px}
.header .tab.active{color:var(--gold);border-bottom-color:var(--gold)}

/* ── Sous-onglets collants + barre du bas ── */
#appC{padding:0 16px calc(150px + env(safe-area-inset-bottom))}
.cv-sub{position:sticky;top:0;z-index:50;display:flex;gap:6px;overflow-x:auto;padding:12px 0 10px;margin:0 -16px 6px;padding-left:16px;padding-right:16px;
  background:rgba(255,244,241,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.cv-sub .t27{border:none;border-radius:30px;background:#fff;color:var(--ink);font-size:.84rem;font-weight:600;padding:9px 16px;white-space:nowrap;
  box-shadow:0 2px 8px -4px rgba(74,26,79,.3);border-bottom:none;cursor:pointer}
.cv-sub .t27.active{background:var(--navy);color:#fff}
#cv-body{padding-top:10px}
.cv-nav{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:600;display:flex;justify-content:space-around;
  background:rgba(42,18,56,.92);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-radius:26px;padding:7px 6px;
  box-shadow:0 14px 34px -10px rgba(42,18,56,.6)}
.cv-nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;border:none;background:none;color:rgba(255,255,255,.55);
  font-size:.66rem;font-weight:600;padding:6px 2px;border-radius:18px;cursor:pointer}
.cv-nav button i{font-style:normal;font-size:1.25rem;filter:grayscale(1) brightness(1.6);opacity:.7;transition:transform .2s}
.cv-nav button.on{color:#fff;background:rgba(255,255,255,.1)}
.cv-nav button.on i{filter:none;opacity:1;transform:translateY(-1px) scale(1.08)}
.v-fab{bottom:calc(92px + env(safe-area-inset-bottom));right:18px;background:var(--sunset);color:#fff;font-weight:700;font-size:.92rem;
  padding:14px 20px;box-shadow:0 12px 26px -8px rgba(242,85,127,.7)}
.cv-crypt{position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top));transform:translate(-50%,-10px);background:#14532d;color:#fff;padding:9px 16px;border-radius:30px;font-size:.8rem;font-weight:600;box-shadow:0 4px 16px rgba(0,0,0,.25);opacity:0;transition:opacity .3s,transform .3s;pointer-events:none;z-index:1200;max-width:92vw;text-align:center}
.cv-crypt.show{opacity:1;transform:translate(-50%,0)}
.v-toast{bottom:calc(150px + env(safe-area-inset-bottom));background:var(--navy);color:#fff;border-radius:30px;font-weight:600;padding:9px 16px;font-size:.8rem}
.export-fab{bottom:24px}

/* ── Surfaces ── */
.v-sum,.v-box,.v-tile,.v-card,.v-day,.cv-wish,.cv-echm,.v-btable{border-radius:var(--radius);box-shadow:var(--shadow);border:none}
.v-sum{padding:16px 18px;margin-bottom:12px}
.v-sum-big{font-family:var(--display);font-weight:600;font-size:1.7rem;color:var(--ink);letter-spacing:-.3px}
.v-sum-small{color:var(--gray);font-size:.78rem}
.v-bar{height:8px;border-radius:8px;background:#F5E3E0}
.v-bar .b-paid{background:var(--green)}.v-bar .b-booked{background:var(--amber)}
.v-tiles{gap:10px;margin-bottom:12px}
.v-tile{padding:16px 10px}
.v-tile .a{font-family:var(--display);font-weight:600;font-size:1.45rem;color:var(--ink)}
.v-tile .l{font-size:.74rem;color:var(--gray);margin-top:3px}
.v-tile.g .a{color:var(--green)}.v-tile.r .a{color:var(--red)}
.v-tiles .v-tile:first-child{background:var(--navy)}
.v-tiles .v-tile:first-child .a{color:var(--gold2)}.v-tiles .v-tile:first-child .l{color:rgba(255,255,255,.7)}
.v-box{padding:18px}
.v-box h3{font-family:var(--display);font-weight:600;font-size:1.25rem;color:var(--ink);margin-bottom:8px}
.v-box p{font-size:.86rem;color:#5d4b60;line-height:1.5}

/* Cartes de résa */
.v-card{padding:14px 14px 14px 12px;margin-bottom:10px;border-left:none!important;gap:12px}
.v-card-ico{width:42px;height:42px;border-radius:14px;background:var(--light);display:flex;align-items:center;justify-content:center;font-size:1.25rem;flex-shrink:0}
.v-card.paid .v-card-ico{background:#DDF3EE}.v-card.booked .v-card-ico{background:#FCEFD9}
.v-card-title{font-size:1rem;font-weight:600;color:var(--ink)}
.v-card-sub{font-size:.78rem;color:#7d6a80}
.v-card-hint{font-size:.74rem;color:#9b7f86;font-style:normal;background:#FFF8F2;border-radius:10px;padding:6px 9px;margin-top:6px}
.v-price{font-family:var(--display);font-weight:600;font-size:1.1rem;color:var(--ink)}
.v-price.est{font-family:var(--ui);font-weight:500;font-size:.88rem;color:var(--gray)}
.v-status{border-radius:30px;font-size:.68rem;font-weight:700;padding:5px 11px;letter-spacing:.1px}
.v-status.todo{background:#FFE6EA;color:#C42E52}.v-status.booked{background:#FDEBD0;color:#A8650A}.v-status.paid{background:#D5F1EB;color:#0B7A6A}

/* Filtres & chips */
.v-filters{gap:7px;margin-bottom:12px}
.v-chip{border:1px solid #EBD3D3;background:#fff;color:#6b5670;font-size:.8rem;font-weight:500;padding:7px 14px;border-radius:30px}
.v-chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.cv-lbl{text-transform:none;letter-spacing:0;font-size:.78rem;font-weight:600;color:var(--gray)}

/* Programme */
.v-day{margin-bottom:12px;overflow:hidden}
.v-day-h{padding:14px 14px}
.v-day-d{background:var(--sunset);color:#fff;font-size:.7rem;font-weight:700;padding:5px 10px;border-radius:30px}
.v-day-t{font-family:var(--display);font-style:italic;font-weight:600;font-size:1.15rem;color:var(--ink)}
.v-day-b{border-top:1px solid #F6E6E3;padding:4px 14px 14px}
.v-day-plan{font-size:.88rem;color:#4d3b50;line-height:1.55}
.v-day-item{background:#FFF7F4;border-radius:12px;font-size:.84rem;padding:9px 11px}
.v-day-edit{border:1px solid #F0D7D4;border-style:solid;background:#fff;color:var(--ink);border-radius:30px;font-size:.78rem;font-weight:600;padding:7px 13px}
.cv-route-mini{background:linear-gradient(135deg,#FFF1EA,#F8ECFF);border:none;border-radius:14px}

/* Notes */
.cv-note{border-radius:16px;background:#fff;box-shadow:var(--shadow);border-left:5px solid var(--pc)}
.cv-note.pin{background:#FFF6DD}
.cv-note-t{font-size:.92rem}
.cv-pinboard{background:linear-gradient(135deg,#FFE9B8,#FFD1C4);border-radius:var(--radius);padding:14px 12px 6px}
.cv-pinboard-h{text-transform:none;letter-spacing:0;font-family:var(--display);font-style:italic;font-size:1.1rem;color:#7A3A1E}

/* Envies */
.cv-wish{border-left:none;position:relative;padding:16px 16px 12px}
.cv-wish::before{content:'';position:absolute;left:0;top:16px;bottom:16px;width:4px;border-radius:0 4px 4px 0;background:var(--pc)}
.cv-wish-k{text-transform:none;letter-spacing:0;font-size:.76rem;font-weight:600}
.cv-wish-t{font-family:var(--display);font-style:italic;font-weight:600;font-size:1.4rem}

/* Budget, échéancier */
.cv-echm-h{font-family:var(--display);font-style:italic;font-weight:600;font-size:1.15rem}
.cv-echm.now{box-shadow:0 0 0 2px var(--sun2),var(--shadow)}
.v-btable th{background:var(--navy);color:var(--gold2);font-weight:600}
.cv-settle{background:#E4F6F1;border-radius:14px;font-size:.88rem}
.cv-pbud-h b{font-family:var(--display);font-size:1.15rem}

/* Checklist */
.v-cl-cat{background:none;color:var(--ink);text-transform:none;letter-spacing:0;font-family:var(--display);font-style:italic;font-size:1.1rem;padding:6px 2px;margin-top:16px}
.v-cl{border-radius:14px;padding:13px 14px;box-shadow:0 2px 10px -6px rgba(74,26,79,.3)}
.v-cl.done .c{background:var(--green);border-color:var(--green)}

/* Boutons */
.v-btn{border-radius:30px;padding:14px;font-weight:600;font-size:.92rem;background:var(--navy);color:#fff}
.v-btn:not(.sec):not(.danger){background:var(--sunset);color:#fff;box-shadow:0 10px 22px -10px rgba(242,85,127,.8)}
.v-btn.sec{background:#fff;color:var(--ink);border:1px solid #EBD3D3}
.v-btn.danger{background:#FFE6EA;color:#C42E52}
.cv-sq{border-radius:50%!important;width:48px!important;height:48px;padding:0!important;display:flex;align-items:center;justify-content:center}
.cv-links a{background:#fff;border:1px solid #F0D7D4;color:var(--ink);font-weight:600;border-radius:30px}
.cv-gm{background:var(--ink);border-radius:30px}

/* Panneaux */
.v-sheet-bg{background:rgba(30,12,42,.55);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.v-sheet{background:var(--cream);border-radius:28px 28px 0 0;padding:8px 18px calc(18px + env(safe-area-inset-bottom))}
.v-sheet h2{font-family:var(--display);font-style:italic;font-weight:600;font-size:1.6rem;line-height:1.15;color:var(--ink);margin:4px 0 12px}
.v-grab{background:#E2C9C6}
.v-f label{text-transform:none;letter-spacing:0;font-size:.8rem;font-weight:600;color:#6b5670}
.v-in{border:1px solid #EBD3D3;border-radius:14px;color:var(--ink)}
.v-in:focus{border-color:var(--sun2);box-shadow:0 0 0 3px rgba(242,85,127,.15)}
.v-seg{border:1px solid #EBD3D3;border-radius:30px;padding:3px;background:#fff}
.v-seg button{border-radius:30px;font-weight:600}
.v-seg2 button.on,.cv-seg-big .v-seg button.on{background:var(--ink);color:#fff}
.v-hint{background:#FFF1E4;border-left:none;border-radius:14px;color:#7A4A1E}
.v-actions{background:var(--cream)}
.cv-paybox{border:none;background:#fff;border-radius:18px;box-shadow:var(--shadow)}
.cv-paybox-h{font-family:var(--display);font-style:italic;font-size:1.15rem}
.cv-live{background:#FFF1EC;border-radius:14px}

  .pr-doc{max-width:none;padding:0}

  const D = d => d ? '2027-07-' + String(d).padStart(2,'0') : '';
  const num = v => { const n = parseFloat(String(v ?? '').replace(',','.')); return isNaN(n) ? 0 : n; };
  const eur = n => (Math.round(n*100)/100).toLocaleString('fr-FR',{minimumFractionDigits:0,maximumFractionDigits:2}) + ' €';

  function nextColor(){
    const used = new Set(profiles().map(p=>(p.couleur||'').toLowerCase()));
    const free = COLORS.find(c=>!used.has(c)); if(free) return free;
    const h = (profiles().length * 137.508) % 360, l = .42, a = .55 * Math.min(l, 1-l);
    const f = n => { const k = (n + h/30) % 12; return Math.round(255*(l - a*Math.max(-1, Math.min(k-3, 9-k, 1)))).toString(16).padStart(2,'0'); };
    return '#' + f(0) + f(8) + f(4);
  }
